<!DOCTYPE html>
<html lang="en" data-build="v2">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pattern Pegs</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<main id="stage">

  <!-- Menu -->
  <section id="menu" class="screen" aria-label="Pattern Pegs menu">
    <header class="topbar">
      <!-- Owner, 2026-08-26: "add back button to test hub for the test apps too." This app
           is carded on the Test Hub without one: inside an activity ⌂ returns to this menu,
           and from the menu there is nothing at all, so an installed PWA with no browser
           chrome has no way out. It takes the same slot in the same top bar that ⌂ takes one
           screen in, so the leftmost button is always "back one level". Menu screen only.
           Absolute URL on purpose: published, /pattern-pegs/ and /test-apps/ are siblings,
           but in the repo the hub lives under site/, so a relative link would work live and
           404 in every local preview. Carries `hub-btn` so the promotion check greps a class
           and not a URL — a card has moved hubs without its arrow before. -->
      <a class="round-btn hub-btn" href="https://veeranuchlee.github.io/test-apps/" aria-label="Back to Test Apps">←</a>
      <h1 class="title">Pattern Pegs</h1>
      <button id="sound-toggle" class="round-btn" type="button" aria-label="Sound on or off" aria-pressed="true">🔊</button>
    </header>
    <nav class="menu-grid" aria-label="Choose an activity">
      <button class="menu-card" type="button" data-activity="copy">
        <span class="menu-beads" data-beads="square:blue,circle:red,square:blue"></span>
        <span class="menu-name">Copy the Tower</span>
      </button>
      <button class="menu-card" type="button" data-activity="continue">
        <span class="menu-beads" data-beads="circle:red,circle:blue,circle:red"></span>
        <span class="menu-name">Continue the Pattern</span>
      </button>
      <button class="menu-card" type="button" data-activity="sort">
        <span class="menu-beads" data-beads="star:red,star:yellow,heart:red"></span>
        <span class="menu-name">Sort by Rule</span>
      </button>
      <button class="menu-card" type="button" data-activity="lace">
        <span class="menu-beads" data-beads="triangle:purple,circle:yellow,triangle:purple"></span>
        <span class="menu-name">Lace the Beads</span>
      </button>
      <button class="menu-card" type="button" data-activity="decode">
        <span class="menu-beads" data-beads="heart:blue,circle:red,star:green"></span>
        <span class="menu-name">Decode the Card</span>
      </button>
    </nav>
  </section>

  <!-- Activity (re-rendered per activity) -->
  <section id="activity" class="screen hidden" aria-label="Activity">
    <header class="topbar">
      <button id="home-btn" class="round-btn" type="button" aria-label="Back to menu">⌂</button>
      <h2 id="activity-title" class="title">Activity</h2>
      <div class="status-row">
        <div id="stars" class="stars" aria-label="Solved puzzles"></div>
      </div>
    </header>
    <div id="levels" class="levels" aria-label="Choose difficulty"></div>
    <div id="activity-body"></div>
  </section>

</main>
<script src="./js/pattern-core.js"></script>
<script src="./app.js"></script>
  <script>
  /* Pinch-zoom guard. iOS Safari ignores user-scalable=no (since iOS 10), so this is
     the only thing that stops two small hands zooming the page mid-play. gesturestart
     fires once per pinch; preventing it cancels the zoom and touches nothing else.
     Other browsers never fire it, so this is inert there. */
  document.addEventListener("gesturestart", function (e) { e.preventDefault(); }, { passive: false });
  </script>
  </body>
</html>
