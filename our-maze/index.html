<!doctype html>
<html lang="en">
<head>

<title>Our Maze</title>

<body>
<main id="app" aria-live="polite"><p class="loading">Building the maze…</p></main>

<script src="./js/maze-app.js"></script>
<script>
  /* Registered only when served over http(s): a file:// preview has no service worker
     scope and throws. */
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    addEventListener('load', function () { navigator.serviceWorker.register('./service-worker.js'); });
  }
</script>
