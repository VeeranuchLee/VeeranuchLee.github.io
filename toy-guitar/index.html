<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14161d">
  <meta name="description" content="Five toy guitars to pick, strum, drum and record. Every string and fret plays.">
  <title>Toy Guitar</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./fonts.css">
  <link rel="stylesheet" href="./styles.css">
  <link rel="icon" href="./assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./cg-back.css" />
  </head>
<body data-toy="first">
  <div id="app" class="app">
    <!-- The chrome: the only thing that does not change when the guitar
         changes. Back, the five-guitar ribbon, and two parent buttons. Same
         place, same size, whichever toy is on screen (Toy Keyboard's shell). -->
    <header id="topbar">
      <a id="hub" class="cg-back" href="https://veeranuchlee.github.io/children-apps/music.html" aria-label="Back to Music"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      <!-- Five physical guitars, always on screen: one tap changes toy. No picker, no menu. -->
      <nav id="ribbon" role="tablist" aria-label="Choose a guitar"></nav>
      <div class="parent">
        <button type="button" id="effects-toggle" aria-pressed="true"><span class="effects-word">Effects</span> <strong>ON</strong></button>
        <!-- The stop hand is drawn in the button's own ink — it flashes gold with
             the word — where an OS emoji would ignore the button's colour. -->
        <button type="button" class="mute" id="muteBtn" aria-label="Mute: stop all strings and drums"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.2 11.4V7.8"/><path d="M10.8 11V5.1"/><path d="M14.4 11V5.9"/><path d="M17.8 11.9V8.8"/><path d="M19 12.8v2.3a6.6 6.6 0 0 1-6.6 6.6h-1.1c-1.8 0-3-.5-4.2-1.7l-3.5-3.6a1.85 1.85 0 0 1 2.6-2.6l2 2v-3.2"/></svg><span class="mute-word">Mute</span></button>
      </div>
    </header>
    <!-- The toy. The guitar fills it; the toy's own controls and its four
         drum pads sit in the case compartments beside the neck. -->
    <main id="stage">
      <div id="toy" class="toy">
        <div id="play" class="play-surface" aria-label="Guitar"></div>
        <div id="railA" class="rail rail-a" role="group"></div>
        <div id="railB" class="rail rail-b" role="group"></div>
        <div id="sparkles" class="sparkles" aria-hidden="true"></div>
      </div>
    </main>
  </div>
  <script src="./tap-zoom-guard.js"></script>
  <script src="./js/audio-wake.js"></script>
  <script type="module" src="./app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./service-worker.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
