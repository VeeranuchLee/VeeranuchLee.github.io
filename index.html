<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Veeranuch Lee</title>
  <meta name="robots" content="noindex"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
      min-height:100svh;display:grid;place-items:center;
      padding:32px;background:#fbfbfd;color:#1e2430;
      line-height:1.5;
    }
    main{max-width:30rem;text-align:center}
    h1{font-size:1.5rem;font-weight:650;letter-spacing:-.01em}
    p{margin-top:.75rem;color:#5c6675;font-size:.98rem}
    a.go{
      display:inline-block;margin-top:1.75rem;
      padding:.7rem 1.35rem;border-radius:10px;
      background:#1e2430;color:#fff;text-decoration:none;
      font-weight:600;font-size:.95rem;
      transition:background .15s ease;
    }
    a.go:hover{background:#39424f}
    a.go:focus-visible{outline:3px solid #6f8cff;outline-offset:3px}
    @media (prefers-color-scheme:dark){
      body{background:#12151b;color:#e9ecf2}
      p{color:#a3adbb}
      a.go{background:#e9ecf2;color:#12151b}
      a.go:hover{background:#c9d0da}
    }
  </style>
</head>
<body>
  <main>
    <h1>Veeranuch Lee</h1>
    <p>This is a placeholder. The children's games live in their own corner of the site.</p>
    <a class="go" href="./children-apps/">Children apps →</a>
  </main>
</body>
</html>
<!-- Deliberately plain, and deliberately not the games.
     The root is reserved for professional use later; when that arrives it
     replaces this file and nothing the children use changes, because their
     address is /children-apps/ and has been from the start.

     No service worker here, and none should ever be added at this path: a
     worker registered from the root takes scope over every project site
     beneath it (/magic-math/, /flower-shooter/, …), each of which ships its
     own. The hub's worker is scoped to /children-apps/ for that reason. -->
