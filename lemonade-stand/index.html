<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6c54d"><title>Sell Lemonade</title>
  <link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="cg-back.css"><link rel="stylesheet" href="styles.css"><script src="tap-zoom-guard.js"></script>
</head>
<body><main id="app">
  <header><a class="cg-back" href="https://veeranuchlee.github.io/children-apps/maths.html" aria-label="Back to Math"><span data-icon="back"></span></a><span class="cg-back-slot" aria-hidden="true"></span><div class="brand"><span class="lemon-mark" aria-hidden="true"></span><h1>Sell Lemonade</h1></div><div class="header-actions"><button id="settings" class="icon-button" aria-label="Settings"><span data-icon="settings"></span></button><button id="sound" class="icon-button" aria-label="Mute sounds"><span data-icon="sound"></span></button></div></header>
  <div id="day-progress" class="day-progress" aria-label="Customer progress"></div>
  <section id="play" class="screen active" aria-live="polite">
    <div class="scene"><div id="decoration" class="decoration" aria-hidden="true"></div><img id="customer" class="customer-art" alt="Animal customer"><div id="bubble" class="bubble"></div></div>
    <div id="work-card" class="work-card"></div>
  </section>
  <section id="level-screen" class="screen panel-screen"><div class="panel"><h2>Choose a shop day</h2><div id="level-grid" class="level-grid"></div><div class="more-levels-card"><span aria-hidden="true"></span><strong>More levels coming soon</strong></div><button id="continue-day" class="primary">Start level 1</button></div></section>
  <section id="reward" class="screen panel-screen"><div class="panel reward-panel"><h2>Shop day complete!</h2><div id="reward-cast" class="reward-cast" aria-label="Five happy customers"></div><div id="score"></div><p id="learning-line"></p><div class="more-levels-card"><span aria-hidden="true"></span><strong>More levels coming soon</strong></div><h3>Choose a decoration</h3><div id="decorations" class="decoration-options"></div><button id="new-day" class="primary">New day</button></div></section>
  <dialog id="settings-dialog"><form method="dialog"><h2>Shop settings</h2><button type="button" class="mode selected" data-mode="cosy"><span data-icon="heart"></span><b>Cosy day</b><small>Take all the time you need</small></button><button type="button" class="mode" data-mode="sparkle"><span data-icon="sparkle"></span><b>Sparkle day</b><small>Be quick to win sparkles</small></button><button class="primary">Done</button></form></dialog>
  <p id="voice-note" class="sr-only">Every voice here is AI-generated. None is a recording of a real person.</p>
</main><script src="js/money-engine.js"></script><script src="js/audio-wake.js"></script><script src="js/voice-guide.js"></script><script src="app.js"></script><script src="cg-update.js"></script><script>if('serviceWorker' in navigator)navigator.serviceWorker.register('service-worker.js');</script></body></html>
