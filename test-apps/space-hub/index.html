<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Space</title>
  <link rel="manifest" href="./manifest.webmanifest"/>
  <link rel="stylesheet" href="./fonts.css"/>
  <meta name="theme-color" content="#2e2560"/>
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Space"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    /* A night sky, in the space violet proposed for the SPACE card on Children Games
       (HUB-SPEC.md §2) -- dark like Planets & Moons' deliberate night, so the two
       card colours below sit inside it rather than fighting it. */
    body{
      font-family:'Nunito',sans-serif;min-height:100vh;color:#fff;
      background:linear-gradient(170deg,#3b2e78 0%,#2e2560 55%,#1e1748 100%);
    }
    .wrap{
      position:relative;z-index:1;min-height:100vh;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:26px;padding:32px 20px;
    }
    h1{font-weight:900;font-size:clamp(1.8rem,6vw,3rem);text-shadow:0 4px 12px rgba(0,0,0,.5);text-align:center}
    /* The one word the SPACE card on Children Games will say, in the star-gold every
       dark front door in this family uses, so the page a child lands on says what the
       card they tapped said it would. */
    h1 span{color:#ffd54f}
    .sub{
      font-weight:800;font-size:clamp(1rem,3.4vw,1.3rem);opacity:.92;
      margin-top:-14px;text-align:center;text-shadow:0 2px 8px rgba(0,0,0,.5);
    }

    /* TWO CARDS, because the owner named two: "for now we can add ari and dot and
       planet game to the space hub" (2026-09-17). Space Trivia joins the day it is
       released, Stars & Sky and Spacecraft the day they exist, and none of those days
       is a redesign -- the grid is auto-fit, so a new app is a card added below and
       nothing else, exactly as Our Word Book grows. */
    .cards{
      display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:20px;width:100%;max-width:900px;
    }
    .card{
      display:flex;flex-direction:column;align-items:center;gap:12px;
      padding:26px 18px 22px;border-radius:28px;
      text-decoration:none;color:#fff;font-weight:900;font-size:1.2rem;text-align:center;
      transition:transform .15s ease,box-shadow .15s ease;
      text-shadow:0 2px 4px rgba(0,0,0,.35);
      -webkit-tap-highlight-color:transparent;
      /* 9.7" iPad portrait is 768px, so the two cards sit side by side and a child's
         finger gets a target well past 44px in both directions. Checked in pixels,
         not assumed. */
      min-height:190px;
    }
    .card:hover{transform:translateY(-6px) scale(1.03)}
    .card:active{transform:translateY(2px)}
    .card:focus-visible{outline:5px solid #ffd54f;outline-offset:4px}
    .card img{width:104px;height:104px;object-fit:contain;filter:drop-shadow(0 6px 12px rgba(0,0,0,.35))}
    .card small{font-weight:700;font-size:.82rem;opacity:.92;max-width:22ch}
    /* Planets & Moons only has a square app icon rather than a cut-out sprite.
       Rounding it makes it read as a deliberate tile instead of a pasted square --
       the same call the Children Games grid makes for the same file. */
    .card img.tile{border-radius:20px}

    /* EACH CARD KEEPS THE COLOUR ITS MAIN-HUB CARD WORE. Until the SPACE card
       replaces them on Children Games, Ari & Dot is indigo (.c-story) and Planets &
       Moons night-sky navy (.c-planets) there. A child who knew those two cards finds
       the same two colours here, one level down -- the cheapest possible way to say
       "they are not gone, they moved". The gradient ends and the 8px bases below are
       those cards' own --edge and --shadow hexes, unchanged. */
    .c-story  {background:linear-gradient(160deg,#9aa1e3,#5b64c9);box-shadow:0 8px 0 #3b429c,0 14px 28px rgba(59,66,156,.35)}
    .c-planets{background:linear-gradient(160deg,#515fae,#26306e);box-shadow:0 8px 0 #151c46,0 14px 28px rgba(21,28,70,.4)}

    footer{font-size:.8rem;font-weight:700;opacity:.72;text-align:center;max-width:44ch;line-height:1.5}

    /* ── Back to Children Games ──
       Top-left, 60px tall, arrow AND words -- the shape every app in this project uses,
       copied deliberately from word-book/index.html rather than reinvented. The arrow is
       for the child who cannot read yet and already knows what it does; the words are
       for the one who can and wants to know where it goes. */
    .hub-btn{
      position:fixed;z-index:9;
      top:calc(14px + env(safe-area-inset-top));
      left:calc(14px + env(safe-area-inset-left));
      display:inline-flex;align-items:center;gap:9px;
      min-height:60px;padding:0 20px 0 16px;
      border-radius:50px;
      background:linear-gradient(135deg,#fff,#ece9ff);
      border:2.5px solid #8f86d8;box-shadow:0 4px 0 #8f86d8;
      color:#4a3d8f;text-decoration:none;
      font-family:inherit;font-weight:900;font-size:1rem;line-height:1;
      white-space:nowrap;-webkit-tap-highlight-color:transparent;
      transition:transform .1s;
    }
    .hub-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8f86d8}
    .hub-btn:focus-visible{outline:4px solid #ffd54f;outline-offset:3px}
    .hub-btn svg{width:24px;height:24px;flex:none}
    /* Narrow phones get the arrow alone. The words are the first thing to go, not the
       target: the button keeps its height and the tap area with it. */
    @media (max-width:420px){
      .hub-btn{padding:0;width:60px;justify-content:center;gap:0}
      .hub-btn span{display:none}
    }
    /* The heading clears the button on a narrow screen, where they would otherwise
       share the top line. */
    .wrap{padding-top:max(32px,calc(86px + env(safe-area-inset-top)))}

    @media (prefers-reduced-motion:reduce){
      .card{transition:none}
      .card:hover{transform:none}
    }
  </style>
</head>
<body>

<!-- The URL is absolute for the same reason every app's arrow is: published, this page
     is a sibling of nothing in the source repo's site/ tree -- it goes to the shared
     Pages repo at /space/ -- so a relative link would work live and 404 in every local
     preview. -->
<a class="hub-btn" href="https://veeranuchlee.github.io/children-apps/" aria-label="Back to Children Games">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
    <path d="M15 5 8 12l7 7"/>
  </svg>
  <span>Children Games</span>
</a>

<div class="wrap">
  <h1><span>Space</span></h1>
  <p class="sub">Stories and planets to explore</p>

  <div class="cards">
    <!-- Both apps are their own published repositories, so their links are absolute
         for the same reason the back arrow's is. The art, name and small line are the
         ones each card wears on Children Games today, so the door a child knows and
         the door they land on agree. -->
    <a class="card c-story" href="https://veeranuchlee.github.io/solar-storybook-feedback/">
      <img src="assets/ari-and-dot.webp" alt="" width="104" height="104"/>
      Ari &amp; Dot
      <small>A story about the planets</small>
    </a>

    <a class="card c-planets" href="https://veeranuchlee.github.io/solar-system-game/">
      <img class="tile" src="assets/planets-and-moons.png" alt="" width="104" height="104"/>
      Planets &amp; Moons
      <small>Planets in order, moons at home, then the dwarf planets</small>
    </a>
  </div>

  <footer>Made with love for little learners</footer>
</div>
<script>
  /* Offline support. Registration is best-effort: opened straight from a file the
     browser refuses it, and the page must still open. */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      Promise.resolve() /* Test Hub staging: no service worker */.catch(function () {});
    });
  }
</script>
</body>
</html>
