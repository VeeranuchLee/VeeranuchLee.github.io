<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Flying Garden Test</title>
<style>
  *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#162f2d;display:grid;place-items:center}canvas{max-width:100vw;max-height:100svh;width:auto;height:auto;box-shadow:0 12px 50px #0007;touch-action:manipulation}.hint,.back{position:fixed;z-index:2;border-radius:24px;background:#102d;color:white;font:700 14px system-ui;backdrop-filter:blur(8px)}.hint{bottom:14px;padding:8px 14px;pointer-events:none}.back{left:14px;top:14px;padding:9px 14px;text-decoration:none}.back:focus-visible{outline:3px solid white;outline-offset:3px}
</style></head>
<body><a class="back" href="../">← Test Apps</a><canvas width="1448" height="1086" aria-label="A musical garden with clickable birds and a butterfly"></canvas><div class="hint">Tap a bird or butterfly to make it fly</div>
<img id="background" src="assets/background.png" hidden alt="">
<video id="brown" src="assets/brown-bird.mp4" muted playsinline preload="auto" hidden></video><video id="red" src="assets/red-bird.mp4" muted playsinline preload="auto" hidden></video><video id="blue" src="assets/blue-bird.mp4" muted playsinline preload="auto" hidden></video><video id="purple" src="assets/purple-butterfly.mp4" muted playsinline preload="auto" hidden></video><video id="cream" src="assets/cream-bird.mp4" muted playsinline preload="auto" hidden></video><video id="slim" src="assets/slim-blue-bird.mp4" muted playsinline preload="auto" hidden></video><video id="orange" src="assets/orange-bird.mp4" muted playsinline preload="auto" hidden></video><video id="white" src="assets/white-bird.mp4" muted playsinline preload="auto" hidden></video>
<script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),bg=document.querySelector('#background'),hint=document.querySelector('.hint');
const creatures=[
  {name:'brown bird',id:'brown',x:875,y:390,scale:.42,dir:1,rise:120,duration:4200},
  {name:'red bird',id:'red',x:420,y:555,scale:.34,dir:1,rise:95,duration:4500},
  {name:'blue bird',id:'blue',x:575,y:275,scale:.30,dir:1,rise:125,duration:4000},
  {name:'purple butterfly',id:'purple',x:1110,y:610,scale:.24,dir:1,rise:145,duration:4700},
  {name:'cream bird',id:'cream',x:1190,y:335,scale:.25,dir:-1,rise:100,duration:4400},
  {name:'slim blue bird',id:'slim',x:1030,y:245,scale:.23,dir:-1,rise:120,duration:4100},
  {name:'orange bird',id:'orange',x:1030,y:465,scale:.24,dir:-1,rise:90,duration:4300},
  {name:'white bird',id:'white',x:1240,y:510,scale:.23,dir:-1,rise:115,duration:4500}
];
for(const c of creatures){c.video=document.querySelector('#'+c.id);c.w=464*c.scale;c.h=688*c.scale;c.layer=document.createElement('canvas');c.layer.width=464;c.layer.height=688;c.lctx=c.layer.getContext('2d',{willReadFrequently:true});c.started=0;c.flying=false;c.cached=false}
function key(c){if(c.cached&&!c.flying)return;c.lctx.clearRect(0,0,464,688);c.lctx.drawImage(c.video,0,0,464,688);const frame=c.lctx.getImageData(0,0,464,688),d=frame.data;for(let i=0;i<d.length;i+=4){const r=d[i],g=d[i+1],b=d[i+2],green=g-Math.max(r,b);if(green>12){d[i+3]=Math.max(0,255-(green-12)*5.2);d[i+1]=Math.min(g,Math.max(r,b)+12)}}c.lctx.putImageData(frame,0,0);c.cached=true}
function draw(){ctx.drawImage(bg,0,0,canvas.width,canvas.height);for(const c of creatures){if(c.video.readyState<2)continue;key(c);let x=c.x,y=c.y;if(c.flying){const p=Math.min(1,(performance.now()-c.started)/c.duration),target=c.dir>0?canvas.width+c.w:-c.w;x=c.x+(target-c.x)*p;y=c.y-Math.sin(p*Math.PI)*c.rise;if(p>=1){c.flying=false;c.video.pause();c.video.currentTime=0;c.cached=false;hint.textContent='Tap a bird or butterfly to make it fly'}}ctx.drawImage(c.layer,x-c.w/2,y-c.h/2,c.w,c.h)}requestAnimationFrame(draw)}
function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}
function hit(p){return[...creatures].reverse().find(c=>!c.flying&&p.x>c.x-c.w/2&&p.x<c.x+c.w/2&&p.y>c.y-c.h/2&&p.y<c.y+c.h/2)}
function start(c){c.flying=true;c.cached=false;c.started=performance.now();hint.textContent=`The ${c.name} is flying…`;c.video.currentTime=0;c.video.play().catch(()=>{})}
Promise.all([new Promise(r=>bg.complete?r():bg.onload=r),...creatures.map(c=>new Promise(r=>c.video.readyState>=2?r():c.video.oncanplay=r))]).then(draw);
canvas.addEventListener('pointermove',e=>canvas.style.cursor=hit(point(e))?'pointer':'default');canvas.addEventListener('click',e=>{const c=hit(point(e));if(c)start(c)});
</script></body></html>
