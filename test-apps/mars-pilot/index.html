<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Mars pilot — tap a word</title>
<link rel="stylesheet" href="../../children-apps/fonts.css">
<!--
  THE MARS STORYBOOK PILOT (CG-087). Test Hub only. Not a shipping app.

  The owner's question is two questions, and the second is the hard one:
    "what happen if we tap on the word, will we get sound, will the sound come out right?"

  Anything can make a sound. This page exists to make the sound AUDITABLE, so:

  1. NOTHING IS SPOKEN BY THE DEVICE. `speechSynthesis.speak` is monkey-patched below,
     before any app code runs, into a function that counts the call and refuses it. That
     silent fallback is the defect under test -- it is how 37 lines of the math app ended
     up in the iPad's own voice without anyone noticing. Here, a word with no clip is
     marked in the text, named in the audit log, and SILENT. Silence is a finding; the
     wrong voice is not.

  2. RESOLUTION IS DECIDED AT BUILD TIME, not by asking for a file and seeing what
     happens. `tools/build-runtime.py` checked every clip against the encoded tree and
     wrote `ok` plus `renderedFrom` into app-data.json. This page only reads that verdict.

  3. THE PAGE SHOWS ITS OWN WORKINGS. The audit panel lists every word, the clip it
     resolves to, whether that clip is really there, and the exact text the clip was
     rendered from -- plus the eight alternate pronunciations rendered for A/B, which are
     the whole reason the risky proper nouns can be judged by ear rather than by faith.

  4. A GREEN LABEL MEANS ONE THING: THE OWNER SAID SO. Before CG-116, one green
     "resolved" flag sat beside every clip meaning only "a sound file exists and plays" --
     nothing had ever checked pronunciation, and a green flag next to "Sun" read as
     approval it never had (it renders ซุน). Now every clip carries THREE independent,
     separately-coloured labels, and only one of them can ever be green:

       sound file    -- present / missing.            Decided by this build script.
       pronunciation -- approved / rejected / unchecked. Decided ONLY by the owner, by
                        hand, in narration/pronunciation.json. No script writes "approved".
       ASR           -- check by ear (amber) / matches (neutral) / not run.
                        `tools/asr-check.py` runs macOS on-device speech recognition over
                        every clip at build time and records the transcript in
                        narration/asr-check.json. A match is NEVER painted green: matching
                        text is not proof of a good accent, and the machine approves
                        nothing. This page reads the recorded result; it never shells out
                        to a recogniser at load.

  `ok: true` is still only a claim about the build machine. So the page also believes its
  ears: a clip that 404s, errors, or plays without `currentTime` ever advancing is
  re-marked as broken IN THE TEXT, live. See markBroken() and the stall watchdog.

  TEXT ON THE PICTURE. No new art was made or generated for this pilot (CG-116); each
  page keeps the picture it already had. The words sit on a solid cream band and the
  picture fades into it through a soft CSS gradient -- drawn over the art by the app,
  never painted into it -- top by default, bottom where a page's own picture makes that
  the better fit (see tools/build-runtime.py's TEXT_POSITION for the per-page reasoning,
  and the .page rule below for why the art is framed in the part a child can see). The
  text itself stays real, tappable DOM the whole time; a picture of text would look
  identical at a glance and would silently kill tap-to-hear, which is the one failure
  mode a storybook page can least afford.

  A page can be opened directly: #p02, #p14, and #p14/audit to open the Audit on it.
-->
<style>
  *{box-sizing:border-box}
  :root{
    --ink:#24303b; --paper:#fdf9f3; --space:#10131c; --space-2:#1a1f2d;
    --pale:#e8eef7; --dim:#95a3b8; --accent:#ff8a4c; --accent-ink:#5a2a10;
    --bad:#e2483b; --good:#2f9e6b;
    --tap:48px;
  }
  html,body{margin:0;background:var(--space);color:var(--pale);
    font-family:Nunito,system-ui,-apple-system,sans-serif;overflow-x:hidden}
  /* height, not min-height: the book must fit the screen, so a long page makes the
     cream band scroll instead of pushing the Back/Next buttons off the bottom. */
  body{height:100svh;display:flex;flex-direction:column;
    padding:10px 14px calc(14px + env(safe-area-inset-bottom));
    width:min(768px,100%);margin:0 auto}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;
    touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

  /* ---------------------------------------------------------------- chrome */
  .bar{display:flex;align-items:center;gap:10px;min-height:var(--tap);flex:0 0 auto}
  .back{color:var(--dim);text-decoration:none;font-weight:700;font-size:.9rem;
    padding:12px 10px 12px 0;min-height:var(--tap);display:flex;align-items:center}
  .bar h1{flex:1;margin:0;font-size:1rem;font-weight:900;letter-spacing:.02em;
    color:var(--pale);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chip{min-height:var(--tap);padding:0 14px;border-radius:999px;font-weight:900;
    font-size:.82rem;background:var(--space-2);color:var(--pale);
    border:2px solid #2d3548;display:flex;align-items:center;gap:7px}
  .chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  /* Grey, not green, when nothing is wrong: a green dot beside "Audit" read as "the
     audit passed", which no machine on this page is entitled to say. */
  .chip .dot{width:9px;height:9px;border-radius:50%;background:#5f6c85}
  .chip.alarm{border-color:var(--bad);color:#ffd9d5}
  .chip.alarm .dot{background:var(--bad)}

  /* ------------------------------------------------------------------ book */
  main{flex:1 1 auto;display:flex;min-height:0}
  /* THE PAGE IS ONE PICTURE WITH A CREAM BAND FOR THE WORDS (CG-116).
     The band (`.wash`) is solid cream where the words are, and the art fades into it
     through a soft CSS gradient (`.art::after`) -- the "A World of Gems" look, drawn by
     the app, never painted into the image.

     WHY THE ART IS FRAMED ABOVE (OR BELOW) THE SOLID PART, NOT UNDER ALL OF IT. The
     solid cream hides whatever is beneath it completely, so drawing art under it only
     changes where `object-fit:cover` puts the crop -- and on p01 at iPad landscape that
     crop put the lower third of Mars under the words, with the title sitting in the
     half-transparent fade over black sky where it could hardly be read. Framing the art
     in the part a child can actually see means the subject is never under the words,
     at either orientation, and every word sits on solid cream. The fade still lies over
     the art, so the picture runs into the band with no hard edge.

     `.pos-top`/`.pos-bottom` is a per-page choice (app-data.json's textPosition, set in
     tools/build-runtime.py with the reasoning per page). The art's crop point is also
     per page (app-data.json's art.focus -> object-position), because what "the
     subject" is differs per picture. */
  .page{position:relative;width:100%;flex:1 1 auto;min-height:0;border-radius:20px;
    overflow:hidden;background:var(--paper);box-shadow:0 14px 40px #0009;
    display:flex;flex-direction:column;--fade:64px}
  .art{position:relative;flex:1 1 auto;min-height:200px;background:#000}
  .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .art::after{content:"";position:absolute;left:0;right:0;height:var(--fade);pointer-events:none}
  .page.pos-bottom .art::after{bottom:0;background:linear-gradient(to top,
    rgba(253,249,243,1) 0%,rgba(253,249,243,.88) 22%,rgba(253,249,243,.6) 48%,
    rgba(253,249,243,.25) 76%,rgba(253,249,243,0) 100%)}
  .page.pos-top .art::after{top:0;background:linear-gradient(to bottom,
    rgba(253,249,243,1) 0%,rgba(253,249,243,.88) 22%,rgba(253,249,243,.6) 48%,
    rgba(253,249,243,.25) 76%,rgba(253,249,243,0) 100%)}
  .page.pos-top .wash{order:-1}
  .wash{position:relative;flex:0 1 auto;min-height:0;background:var(--paper);color:var(--ink);
    padding:14px 16px 4px;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .page.pos-bottom .wash{padding:4px 16px 14px}
  .wash h2{margin:0 0 6px;font-size:1.25rem;font-weight:900;color:#1d2b36}

  .s{display:flex;align-items:flex-start;gap:4px;margin:0 0 2px}
  .say{flex:0 0 auto;width:var(--tap);height:var(--tap);border-radius:14px;
    display:grid;place-items:center;font-size:1.25rem;background:#eef2f6;color:#3d5668;
    margin-top:2px}
  .say:active,.say.on{background:var(--accent);color:var(--accent-ink)}
  .say.bad{background:#fdecea;color:var(--bad);box-shadow:inset 0 0 0 2px var(--bad)}
  .words{flex:1 1 auto;min-width:0}

  /* A word in running text has a glyph box far under 48px, so the TAP TARGET is the
     padding, not the letters: 40px of line-height plus 4px above and below is a 48px
     box, and min-width keeps "a" and "is" from being a sliver. */
  .w{display:inline-block;min-height:var(--tap);min-width:34px;line-height:40px;
    padding:4px 7px;margin:0 1px;border-radius:12px;font-size:1.45rem;font-weight:700;
    color:#24303b;text-align:center;border:2px solid transparent}
  .w:active{background:#ffe0cb}
  .w.on{background:var(--accent);color:var(--accent-ink)}
  .w.bad{color:var(--bad);border-color:var(--bad);border-style:dashed;
    background:#fdecea;text-decoration:line-through}
  .w.bad::after{content:"⚠";font-size:.7em;vertical-align:super;margin-left:2px}

  .alarm-strip{margin:8px 0 0;padding:10px 12px;border-radius:14px;background:#fdecea;
    color:#7a1c14;font-weight:700;font-size:.92rem;line-height:1.35;border:2px solid var(--bad)}
  .alarm-strip:empty{display:none}

  /* ------------------------------------------------------------------- nav */
  nav{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding-top:10px}
  .turn{flex:1 1 0;min-height:var(--tap);border-radius:16px;background:var(--space-2);
    border:2px solid #2d3548;font-weight:900;font-size:.95rem;padding:0 12px}
  .turn:disabled{opacity:.33}
  .turn:active:not(:disabled){background:var(--accent);color:var(--accent-ink)}
  .pips{display:flex;gap:7px;align-items:center}
  .pip{width:11px;height:11px;border-radius:50%;background:#3a4460}
  .pip.here{background:var(--accent);transform:scale(1.35)}

  /* ----------------------------------------------------------------- audit */
  #audit{position:fixed;top:0;bottom:0;right:auto;z-index:20;background:#0b0e15;color:var(--pale);
    overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px 40px;
    width:min(768px,100%);left:50%;transform:translateX(-50%)}
  #audit[hidden]{display:none}
  #audit h3{margin:20px 0 8px;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--dim);font-weight:900}
  #audit h3:first-of-type{margin-top:12px}
  .card{background:#141926;border:1px solid #232c40;border-radius:14px;padding:10px 12px;
    margin-bottom:8px}
  .kv{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.84rem;line-height:1.5}
  .kv b{color:var(--dim);font-weight:700}
  .tally{display:flex;flex-wrap:wrap;gap:8px}
  .tally > div{flex:1 1 120px;background:#141926;border:1px solid #232c40;border-radius:14px;
    padding:9px 11px}
  .tally .n{font-size:1.5rem;font-weight:900;line-height:1.1}
  .tally .l{font-size:.72rem;color:var(--dim);font-weight:700;text-transform:uppercase;
    letter-spacing:.07em}
  .tally .n.bad{color:var(--bad)} .tally .n.good{color:var(--good)} .tally .n.amber{color:#ffcf9a}

  .row{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid #1e2534;
    flex-wrap:wrap}
  .row:first-child{border-top:0}
  .row .grow{flex:1 1 150px;min-width:0}
  .word-of{font-weight:900;font-size:1rem}
  .meta{font-size:.76rem;color:var(--dim);line-height:1.45;word-break:break-word}
  .meta code{color:#bcd0ea;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.95em}
  .risk{color:#ffcf9a}
  .flag{display:inline-block;font-size:.68rem;font-weight:900;letter-spacing:.06em;
    padding:3px 7px;border-radius:7px;text-transform:uppercase;margin:0 4px 4px 0}
  /* Three independent labels, three independent colours. GREEN IS RESERVED: the only
     rule in this file that must never be broken is that green means the owner's own
     "approved" -- .pron-approved, and the approved count when it is above zero, are the
     only things allowed to use it. A present sound file, a matching ASR pass, a clean
     log line, a zero "blocked" count are all facts about a machine, not a verdict, so
     they get neutral colours. */
  .flag.sf-present{background:#17263a;color:#9fd0ff}
  .flag.sf-missing{background:#3a1512;color:#ff9c92}
  .flag.pron-approved{background:#12352a;color:#6fe0ab}
  .flag.pron-rejected{background:#3a1512;color:#ff9c92}
  .flag.pron-unchecked{background:#2a2636;color:#c9b8e6}
  .flag.asr-differs{background:#3a2c12;color:#ffcf9a}
  .flag.asr-match{background:#1c2333;color:#9fb0cf}
  .flag.asr-notrun{background:#1c2333;color:#6b7690}
  .mini{min-height:40px;min-width:44px;border-radius:11px;background:#212a3d;
    border:1px solid #303a52;font-size:.8rem;font-weight:900;padding:0 11px}
  .mini:active{background:var(--accent);color:var(--accent-ink)}
  .mini.alt{background:#2a2136;border-color:#413352}
  .wide{width:100%;min-height:var(--tap);border-radius:14px;background:#212a3d;
    border:1px solid #303a52;font-weight:900;margin-top:8px}
  #log{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.72rem;
    line-height:1.6;white-space:pre-wrap;word-break:break-word;max-height:40svh;
    overflow-y:auto;margin:0}
  #log .t{color:#5f6c85} #log .e{color:#ff9c92} #log .g{color:#9fb0cf} #log .w-{color:#ffcf9a}
  .note{font-size:.8rem;color:var(--dim);line-height:1.5;margin:6px 0 0}
  .fail{padding:18px;border-radius:16px;background:#3a1512;color:#ffd9d5;font-weight:700;
    line-height:1.5}
</style>
</head>
<body>

<div class="bar">
  <a class="back" href="../">← Test Apps</a>
  <h1>Mars pilot</h1>
  <button class="chip" id="audit-open" aria-pressed="false"><span class="dot"></span>Audit</button>
</div>

<main>
  <div class="page pos-top" id="page">
    <div class="art"><img id="art" alt="" src="" decoding="async"></div>
    <div class="wash" id="wash">
      <h2 id="page-title">Loading…</h2>
      <div id="sentences"></div>
      <p class="alarm-strip" id="page-alarm"></p>
    </div>
  </div>
</main>

<nav>
  <button class="turn" id="prev" disabled>← Back</button>
  <div class="pips" id="pips" aria-hidden="true"></div>
  <button class="turn" id="next" disabled>Next →</button>
</nav>

<aside id="audit" hidden aria-label="Audio audit"></aside>

<script>
/* ===================================================================== *
 * 1. THE DEVICE-VOICE GUARD. First code on the page, before anything can *
 *    call it. Counts and REFUSES; never delegates to the real speak().   *
 * ===================================================================== */
const LOG = [];
const guard = {blocked: 0};

function log(level, tag, text){
  const d = new Date();
  const t = d.toTimeString().slice(0,8) + '.' + String(d.getMilliseconds()).padStart(3,'0');
  LOG.unshift({t, level, tag, text});
  if (LOG.length > 400) LOG.length = 400;
  if (typeof paintLog === 'function') paintLog();
}

if (window.speechSynthesis && typeof window.speechSynthesis.speak === 'function') {
  window.speechSynthesis.speak = function(utterance){
    guard.blocked++;
    const said = utterance && utterance.text ? JSON.stringify(String(utterance.text)) : '(no text)';
    log('err', 'DEVICE VOICE BLOCKED',
        'speechSynthesis.speak(' + said + ') was called and REFUSED. This page only ever ' +
        'plays rendered clips; a line reaching the device voice is the defect under test.');
    if (typeof paintGuard === 'function') paintGuard();
  };
  log('ok', 'guard', 'speechSynthesis.speak is patched to refuse. Nothing on this page can ' +
                     'fall through to the iPad voice.');
} else {
  log('ok', 'guard', 'This browser exposes no speechSynthesis; nothing to guard.');
}

/* ===================================================================== *
 * 2. DATA                                                               *
 * ===================================================================== */
let DATA = null, pageIndex = 0;
const audioCache = new Map();   // clip id -> HTMLAudioElement
const broken = new Map();       // clip id -> why it failed at RUNTIME
let current = null;             // {el, audio, node}

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

fetch('app-data.json', {cache: 'no-store'})
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(d => { DATA = d; boot(); })
  .catch(err => {
    log('err', 'data', 'app-data.json did not load: ' + err.message);
    $('#wash').innerHTML =
      '<div class="fail">app-data.json did not load (' + esc(err.message) + ').<br><br>' +
      'If this is a <code>file://</code> URL, fetch is blocked by the browser, not by the ' +
      'data. Serve the folder over HTTP — <code>python3 -m http.server</code> from ' +
      '<code>site/</code> — and open <code>/test-apps/mars-pilot/</code>.</div>';
  });

function boot(){
  log('ok', 'data', 'app-data.json loaded: ' + DATA.pages.length + ' pages, voice "' +
      DATA.provenance.voiceName + '", rendered ' + DATA.provenance.renderedOn + '.');
  $('#pips').innerHTML = DATA.pages.map(() => '<span class="pip"></span>').join('');
  $('#prev').addEventListener('click', () => turn(-1));
  $('#next').addEventListener('click', () => turn(+1));
  $('#audit-open').addEventListener('click', toggleAudit);
  /* The address says which page is open -- #p02, #p14 -- so a reload stays on the page
     the owner was checking, and a page can be linked or screenshotted directly.
     #p14/audit (or just #audit) also opens the Audit. Anything unknown is ignored. */
  const parts = decodeURIComponent(location.hash.slice(1)).split('/');
  const at = DATA.pages.findIndex(pg => parts.indexOf(pg.id) !== -1);
  if (at > 0) pageIndex = at;
  render();
  if (parts.indexOf('audit') !== -1) toggleAudit();
}

/* ===================================================================== *
 * 3. PLAYBACK. One resolver, one code path, no fallback of any kind.     *
 * ===================================================================== */

/* A clip is playable only if the BUILD said it resolved and RUNTIME has not since
   caught it failing. Everything else is silence plus a visible mark. */
function playable(clip){
  return !!(clip && clip.ok && clip.src && !broken.has(clip.id));
}

function element(clip){
  let a = audioCache.get(clip.id);
  if (!a) {
    a = new Audio(clip.src);
    a.preload = 'auto';
    a.addEventListener('error', () => {
      const code = a.error ? a.error.code : '?';
      markBroken(clip, 'the browser could not load ' + clip.src + ' (media error ' + code + ')');
    });
    audioCache.set(clip.id, a);
  }
  return a;
}

/* The runtime half of the contract. `ok: true` was true on the machine that built the
   data; this is what happens when it is not true HERE. The word is re-marked in the
   text, so a clip that did not deploy looks like a clip that was never rendered. */
function markBroken(clip, why){
  if (broken.has(clip.id)) return;
  broken.set(clip.id, why);
  log('err', 'clip broken', clip.id + ': ' + why);
  render(true);
  paintAudit();
}

function stop(){
  if (!current) return;
  try { current.audio.pause(); current.audio.currentTime = 0; } catch (e) {}
  if (current.el) current.el.classList.remove('on');
  clearTimeout(current.watchdog);
  current = null;
}

/* label: what the owner sees in the log. el: the thing to light up while it plays. */
function play(clip, label, el){
  stop();
  if (!clip) {
    alarm(label + ' has no clip at all — nothing was played, and nothing was spoken.');
    log('err', 'no clip', label + ' resolves to no clip id in app-data.json.');
    return;
  }
  if (!playable(clip)) {
    const why = broken.get(clip.id) || clip.why || 'the build marked it unresolved';
    alarm('“' + label + '” has no sound: ' + why + '. It is SILENT on purpose — the device ' +
          'voice is never used here.');
    log('err', 'silent', clip.id + ' (' + label + ') — ' + why);
    return;
  }
  const a = element(clip);
  if (el) el.classList.add('on');
  const started = performance.now();
  const ticket = {audio: a, el: el, clip: clip, watchdog: 0};
  current = ticket;

  a.currentTime = 0;
  a.play().then(() => {
    log('ok', 'play', clip.id + ' ← ' + clip.src + '  (rendered from ' +
        JSON.stringify(clip.renderedFrom) + ')');
    /* `playing` is not proof of sound. Only currentTime moving is. If it has not moved
       after 1.2s the clip is stalled — a silent failure that would otherwise read as a
       successful tap. */
    ticket.watchdog = setTimeout(() => {
      if (a.currentTime === 0 && !a.paused) {
        log('warn', 'stalled', clip.id + ' is "playing" but currentTime never advanced. ' +
            'Nothing is coming out of the speaker.');
        alarm('“' + label + '” started but produced no sound (currentTime never moved). ' +
              'Check the device is not muted, then re-tap.');
      }
    }, 1200);
  }).catch(err => {
    if (el) el.classList.remove('on');
    log('err', 'play refused', clip.id + ': ' + err.name + ' — ' + err.message);
    alarm('The browser refused to play “' + label + '” (' + err.name + '). Nothing was ' +
          'spoken in its place.');
  });

  a.onended = () => {
    if (el) el.classList.remove('on');
    log('ok', 'ended', clip.id + ' played to the end (' +
        (a.duration ? a.duration.toFixed(2) + 's' : '?') + ', tap to end ' +
        Math.round(performance.now() - started) + 'ms)');
    clearTimeout(ticket.watchdog);
  };
}

/* Two clips back to back — the A/B the alternates were rendered for. */
function playPair(first, second, labelA, labelB){
  play(first, labelA, null);
  const a = playable(first) ? element(first) : null;
  const after = () => setTimeout(() => play(second, labelB, null), 380);
  if (a) { a.addEventListener('ended', after, {once: true}); }
  else { after(); }
}

function alarm(msg){
  const strip = $('#page-alarm');
  if (!strip) return;
  strip.textContent = msg;
  clearTimeout(alarm.t);
  alarm.t = setTimeout(() => { strip.textContent = ''; }, 9000);
}

/* ===================================================================== *
 * 4. THE BOOK                                                           *
 * ===================================================================== */
function turn(step){
  const n = pageIndex + step;
  if (n < 0 || n >= DATA.pages.length) return;
  stop();
  pageIndex = n;
  $('#page-alarm').textContent = '';
  log('ok', 'page', 'turned to ' + DATA.pages[n].id + ' — ' + DATA.pages[n].title);
  try { history.replaceState(null, '', '#' + DATA.pages[n].id); } catch (e) {}
  render();
  paintAudit();
}

function render(keepScroll){
  const p = DATA.pages[pageIndex];
  const art = $('#art');
  if (art.getAttribute('src') !== p.art.src) {
    art.src = p.art.src;
    art.alt = p.title;
  }
  /* Top by default; bottom only where app-data.json says this page's own picture
     suits it better (see tools/build-runtime.py's TEXT_POSITION). The crop point keeps
     the page's subject in view at both iPad orientations (ART's `focus`). */
  const page = $('#page');
  page.classList.toggle('pos-bottom', p.textPosition === 'bottom');
  page.classList.toggle('pos-top', p.textPosition !== 'bottom');
  art.style.objectPosition = p.art.focus || '';
  $('#page-title').textContent = p.title;

  $('#sentences').innerHTML = p.sentences.map((s, si) => {
    const words = s.words.map((w, wi) => {
      const bad = !playable(w.clip);
      return '<button type="button" class="w' + (bad ? ' bad' : '') + '"' +
             ' data-s="' + si + '" data-w="' + wi + '"' +
             ' aria-label="' + esc(w.display) + (bad ? ' — no sound' : '') + '">' +
             esc(w.display) + '</button>';
    }).join('');
    const sbad = !playable(s.clip);
    return '<p class="s">' +
      '<button type="button" class="say' + (sbad ? ' bad' : '') + '" data-s="' + si + '"' +
      ' aria-label="Play sentence ' + (si + 1) + '">' + (sbad ? '⚠' : '🔊') + '</button>' +
      '<span class="words">' + words + '</span></p>';
  }).join('');

  $('#sentences').querySelectorAll('.w').forEach(el => {
    el.addEventListener('click', () => {
      const w = p.sentences[+el.dataset.s].words[+el.dataset.w];
      play(w.clip, w.display, el);
    });
  });
  $('#sentences').querySelectorAll('.say').forEach(el => {
    el.addEventListener('click', () => {
      const s = p.sentences[+el.dataset.s];
      play(s.clip, s.text, el);
    });
  });

  $('#prev').disabled = pageIndex === 0;
  $('#next').disabled = pageIndex === DATA.pages.length - 1;
  $('#pips').querySelectorAll('.pip').forEach((el, i) =>
    el.classList.toggle('here', i === pageIndex));

  /* A page that carries an unresolved word says so without being asked. The owner
     should not have to open the audit panel to learn that a word is mute. */
  const mute = [];
  p.sentences.forEach(s => {
    if (!playable(s.clip)) mute.push('sentence ' + s.n);
    s.words.forEach(w => { if (!playable(w.clip)) mute.push('“' + w.display + '”'); });
  });
  if (mute.length && !keepScroll) {
    $('#page-alarm').textContent = mute.length + ' thing(s) on this page have no sound: ' +
      mute.join(', ') + '. They are marked and silent — open Audit for the reason.';
  }
  paintGuard();
}

/* ===================================================================== *
 * 5. THE AUDIT PANEL — the page showing its own workings                *
 * ===================================================================== */
function toggleAudit(){
  const a = $('#audit'), b = $('#audit-open');
  const show = a.hasAttribute('hidden');
  if (show) { paintAudit(); a.removeAttribute('hidden'); a.scrollTop = 0; }
  else a.setAttribute('hidden', '');
  b.setAttribute('aria-pressed', String(show));
}

function paintGuard(){
  const b = $('#audit-open');
  if (!b) return;
  b.classList.toggle('alarm', guard.blocked > 0 || broken.size > 0);
  b.lastChild.textContent = guard.blocked > 0 ? 'Audit · ' + guard.blocked + ' blocked'
                          : broken.size > 0   ? 'Audit · ' + broken.size + ' broken'
                          : 'Audit';
}

/* The owner's verdict and the build's ASR pass both live in ONE place, keyed by clip
   id, in app-data.json's clipVerdicts -- not copied into every occurrence of a clip
   (the same clip id appears on several pages). A clip with no entry is unchecked /
   not run; that is the honest default, not an omission. */
function verdictFor(id){
  const v = (DATA.clipVerdicts && DATA.clipVerdicts[id]) || {};
  return {
    pronunciation: v.pronunciation || {verdict: 'unchecked'},
    asr: v.asr || {status: 'not run'}
  };
}

function soundFlag(clip){
  if (!clip) return '<span class="flag sf-missing">sound file: missing</span>';
  if (broken.has(clip.id)) return '<span class="flag sf-missing">sound file: missing (runtime)</span>';
  return clip.ok ? '<span class="flag sf-present">sound file: present</span>'
                 : '<span class="flag sf-missing">sound file: missing</span>';
}

/* GREEN COMES FROM ONLY ONE PLACE: the owner's own verdict, written by hand into
   narration/pronunciation.json. Nothing else in this file is allowed to return the
   pron-approved class. */
function pronFlag(clip){
  if (!clip) return '';
  const v = verdictFor(clip.id).pronunciation.verdict;
  if (v === 'approved') return '<span class="flag pron-approved">pronunciation: approved</span>';
  if (v === 'rejected') return '<span class="flag pron-rejected">pronunciation: rejected</span>';
  return '<span class="flag pron-unchecked">pronunciation: unchecked</span>';
}

/* The build's speech-recognition pass. A match is NEUTRAL, never green -- matching
   text is not proof of a good accent, and no machine signs a clip off here. */
function asrFlag(clip){
  if (!clip) return '';
  const a = verdictFor(clip.id).asr;
  /* The recogniser failing on a clip is not a pass: the clip still needs an ear. */
  if (a.status === 'error')
    return '<span class="flag asr-differs">ASR: failed — check by ear</span>';
  if (a.status === 'not run' || a.match == null)
    return '<span class="flag asr-notrun">ASR: not run</span>';
  return a.match
    ? '<span class="flag asr-match">ASR: matches (not an approval)</span>'
    : '<span class="flag asr-differs">ASR: check by ear</span>';
}

function badges(clip){
  return soundFlag(clip) + pronFlag(clip) + asrFlag(clip);
}

function clipMeta(clip){
  if (!clip) return '<div class="meta">No clip id. Nothing can play.</div>';
  const v = verdictFor(clip.id);
  let m = '<div class="meta"><code>' + esc(clip.id) + '</code>';
  if (clip.renderedFrom != null)
    m += ' · rendered from <code>' + esc(JSON.stringify(clip.renderedFrom)) + '</code>';
  if (clip.src) m += '<br>' + esc(clip.src);
  if (clip.ledger != null && clip.ledger !== clip.renderedFrom)
    m += '<br><span class="risk">LEDGER MISMATCH — the master beside it was rendered from ' +
         esc(JSON.stringify(clip.ledger)) + '</span>';
  if (clip.why) m += '<br><span class="risk">' + esc(clip.why) + '</span>';
  if (broken.has(clip.id))
    m += '<br><span class="risk">RUNTIME: ' + esc(broken.get(clip.id)) + '</span>';
  if (clip.risk) m += '<br><span class="risk">RISK: ' + esc(clip.risk) + '</span>';
  if (v.pronunciation.note) m += '<br><span class="risk">OWNER: ' + esc(v.pronunciation.note) + '</span>';
  if (v.asr.heard === '')
    m += '<br>ASR heard <b>nothing at all</b> — differs from the intended text.';
  else if (v.asr.heard != null)
    m += '<br>ASR heard <code>' + esc(v.asr.heard) + '</code>' +
         (v.asr.match ? ' — matches the intended text.' : ' — differs from the intended text.');
  if (v.asr.status === 'error')
    m += '<br><span class="risk">ASR could not read this clip: ' + esc(v.asr.detail) + '</span>';
  return m + '</div>';
}

/* Every distinct clip id in the whole pilot, deduped -- the same clip id can appear on
   several pages, and the owner's verdict is about the CLIP, not about any one page it
   happens to sit on. */
function everyClipId(){
  const ids = new Set();
  DATA.pages.forEach(p => p.sentences.forEach(s => {
    if (s.clip) ids.add(s.clip.id);
    s.words.forEach(w => {
      if (w.clip) ids.add(w.clip.id);
      if (w.alt) ids.add(w.alt.id);
    });
  }));
  return ids;
}

function ownerTally(){
  let approved = 0, rejected = 0, unchecked = 0;
  everyClipId().forEach(id => {
    const v = verdictFor(id).pronunciation.verdict;
    if (v === 'approved') approved++;
    else if (v === 'rejected') rejected++;
    else unchecked++;
  });
  return {approved, rejected, unchecked};
}

/* The build's ASR pass over every clip, and the clips it says need an ear first.
   Kept apart from ownerTally() on purpose: these counts are the machine's, not the
   owner's, and none of them can make anything green. */
function asrTally(){
  const t = {differs: [], match: 0, notRun: 0};
  Array.from(everyClipId()).sort().forEach(id => {
    const a = verdictFor(id).asr;
    if (a.status === 'error' || a.match === false) t.differs.push(id);
    else if (a.match === true) t.match++;
    else t.notRun++;
  });
  return t;
}

function paintAudit(){
  const a = $('#audit');
  if (!a || !DATA) return;
  const p = DATA.pages[pageIndex];

  const allWords = [], allClips = new Set();
  p.sentences.forEach(s => s.words.forEach(w => {
    allWords.push(w);
    if (w.clip && w.clip.id) allClips.add(w.clip.id);
  }));
  const unresolved = allWords.filter(w => !playable(w.clip)).length;
  const tally = ownerTally();
  const asrT = asrTally();

  /* The alternates. app-data.json hangs each one off the word it belongs to, so the
     A/B list is built from the words rather than from a hand-typed list of names. */
  const alts = [];
  const seen = new Set();
  DATA.pages.forEach(pg => pg.sentences.forEach(s => s.words.forEach(w => {
    if (w.alt && !seen.has(w.alt.id)) { seen.add(w.alt.id); alts.push(w); }
  })));

  a.innerHTML =
  '<div class="bar"><h1>Audit</h1>' +
    '<button class="chip" id="audit-close">Close ✕</button></div>' +

  '<h3>Owner sign-off — every clip in the pilot</h3>' +
  '<div class="tally">' +
    '<div><div class="n' + (tally.approved ? ' good' : '') + '">' + tally.approved + '</div>' +
      '<div class="l">approved</div></div>' +
    '<div><div class="n' + (tally.rejected ? ' bad' : '') + '">' + tally.rejected + '</div>' +
      '<div class="l">flagged</div></div>' +
    '<div><div class="n">' + tally.unchecked + '</div><div class="l">unchecked</div></div>' +
  '</div>' +
  '<p class="note">These three counts are the only ones on this page that mean anything about ' +
  'pronunciation. They come only from narration/pronunciation.json, written by hand by the owner. ' +
  'A sound file that plays, or an ASR pass that matches, never turns a clip green here.</p>' +

  '<h3>Speech recognition — where to listen first</h3>' +
  '<div class="tally">' +
    '<div><div class="n' + (asrT.differs.length ? ' amber' : '') + '">' + asrT.differs.length +
      '</div><div class="l">check by ear</div></div>' +
    '<div><div class="n">' + asrT.match + '</div><div class="l">ASR matches</div></div>' +
    '<div><div class="n">' + asrT.notRun + '</div><div class="l">ASR not run</div></div>' +
  '</div>' +
  '<p class="note">The build ran on-device speech recognition over every clip ' +
  '(tools/asr-check.py). It is a machine, so it approves nothing: a match means it heard the ' +
  'right words, not that they were said the right way. The clips below are where it heard ' +
  'something else — listen to these first. Some will be the recogniser’s mistake, not the ' +
  'voice’s (“its” can only ever be heard as “it’s”).</p>' +
  (asrT.differs.length ? '<div class="card">' + asrT.differs.map(id => {
    const c = findClip(id);
    return '<div class="row"><div class="grow"><span class="word-of">' + esc(c.label) + '</span> ' +
      badges(c.clip) + clipMeta(c.clip) + '</div>' +
      '<button class="mini" data-play-clip="' + esc(id) + '">play</button></div>';
  }).join('') + '</div>' : '') +

  '<h3>This page — ' + esc(p.id) + ' ' + esc(p.title) + '</h3>' +
  '<div class="tally">' +
    '<div><div class="n">' + allWords.length + '</div><div class="l">words</div></div>' +
    '<div><div class="n">' + (allWords.length - unresolved) + '</div>' +
      '<div class="l">with sound</div></div>' +
    '<div><div class="n' + (unresolved ? ' bad' : '') + '">' + unresolved + '</div>' +
      '<div class="l">silent</div></div>' +
    '<div><div class="n">' + allClips.size + '</div><div class="l">distinct clips</div></div>' +
    '<div><div class="n' + (guard.blocked ? ' bad' : '') + '">' + guard.blocked + '</div>' +
      '<div class="l">device-voice calls blocked</div></div>' +
  '</div>' +
  '<p class="note">A word is counted as having sound only if the build resolved it <em>and</em> ' +
  'this browser has not since failed to load it. “Device-voice calls blocked” must stay at 0: ' +
  'it counts every attempt to reach <code>speechSynthesis</code>, which this page refuses.</p>' +

  '<h3>Pronunciation A/B — the risky words</h3>' +
  '<p class="note">Each row plays the clip the book actually uses, then the bare lower-cased ' +
  'alternate rendered only for this comparison. The book never plays the alternate; it is here ' +
  'so “will the sound come out right?” can be answered by ear. <b>Sun</b> is the proven failure: ' +
  'a bare “Sun” shipped as “soon” on 2026-09-15.</p>' +
  '<div class="card">' + alts.map(w =>
    '<div class="row"><div class="grow"><span class="word-of">' + esc(w.display) + '</span> ' +
      badges(w.clip) +
      '<div class="meta">book <code>' + esc(w.clip.id) + '</code> ' +
        esc(JSON.stringify(w.clip.renderedFrom)) +
      ' · alt <code>' + esc(w.alt.id) + '</code> ' +
        esc(JSON.stringify(w.alt.renderedFrom)) +
      (w.clip.risk ? '<br><span class="risk">' + esc(w.clip.risk) + '</span>' : '') + '</div></div>' +
    '<button class="mini" data-play-clip="' + esc(w.clip.id) + '">book</button>' +
    '<button class="mini alt" data-play-clip="' + esc(w.alt.id) + '">alt</button>' +
    '<button class="mini" data-play-pair="' + esc(w.clip.id) + '|' + esc(w.alt.id) + '">both</button>' +
    '</div>').join('') + '</div>' +

  '<h3>Sentences on this page</h3>' +
  '<div class="card">' + p.sentences.map(s =>
    '<div class="row"><div class="grow"><span class="word-of">' + esc(s.text) + '</span> ' +
      badges(s.clip) + clipMeta(s.clip) + '</div>' +
    '<button class="mini" data-play-clip="' + esc(s.clip.id) + '">play</button></div>').join('') +
  '</div>' +

  '<h3>Every word on this page</h3>' +
  '<div class="card">' + allWords.map((w, i) =>
    '<div class="row"><div class="grow"><span class="word-of">' + esc(w.display) + '</span> ' +
      '<span class="meta">key <code>' + esc(w.word) + '</code></span> ' + badges(w.clip) +
      clipMeta(w.clip) + '</div>' +
    '<button class="mini" data-play-clip="' + esc(w.clip.id) + '">play</button>' +
    (w.alt ? '<button class="mini alt" data-play-clip="' + esc(w.alt.id) + '">alt</button>' : '') +
    '</div>').join('') + '</div>' +
  '<button class="wide" id="probe">Check every clip on this page really downloads</button>' +
  '<p class="note">The “sound file” labels above were decided when the data was built. This button ' +
  'asks the server for each file right now, so a clip that was rendered but never deployed shows ' +
  'up as a 404 instead of as silence on a tap.</p>' +

  '<h3>Where the audio came from</h3>' +
  '<div class="card"><div class="kv">' +
    '<span><b>set</b> ' + esc(DATA.set) + '</span>' +
    '<span><b>tool</b> ' + esc(DATA.provenance.tool) + '</span>' +
    '<span><b>model</b> ' + esc(DATA.provenance.model) + '</span>' +
    '<span><b>voice</b> ' + esc(DATA.provenance.voiceName) + '</span>' +
    '<span><b>voice id</b> <code>' + esc(DATA.provenance.voiceId) + '</code></span>' +
    '<span><b>rendered</b> ' + esc(DATA.provenance.renderedOn) + '</span>' +
    '<span><b>text from</b> ' + esc(DATA.builtFrom) + '</span>' +
  '</div></div>' +

  '<h3>Log — every tap, in order</h3>' +
  '<div class="card"><p id="log"></p>' +
  '<button class="wide" id="copy-log">Copy the log</button></div>';

  a.querySelector('#audit-close').addEventListener('click', toggleAudit);
  a.querySelectorAll('[data-play-clip]').forEach(b => b.addEventListener('click', () => {
    const c = findClip(b.dataset.playClip);
    play(c.clip, c.label, b);
  }));
  a.querySelectorAll('[data-play-pair]').forEach(b => b.addEventListener('click', () => {
    const ids = b.dataset.playPair.split('|');
    const A = findClip(ids[0]), B = findClip(ids[1]);
    log('ok', 'A/B', 'comparing ' + ids[0] + ' against ' + ids[1]);
    playPair(A.clip, B.clip, A.label, B.label);
  }));
  a.querySelector('#probe').addEventListener('click', probe);
  a.querySelector('#copy-log').addEventListener('click', copyLog);
  paintLog();
}

/* Find a clip record by id anywhere in the data — words, sentences and alternates. */
function findClip(id){
  let found = null;
  DATA.pages.forEach(p => p.sentences.forEach(s => {
    if (s.clip && s.clip.id === id) found = found || {clip: s.clip, label: s.text};
    s.words.forEach(w => {
      if (w.clip && w.clip.id === id) found = found || {clip: w.clip, label: w.display};
      if (w.alt && w.alt.id === id)
        found = found || {clip: w.alt, label: w.display + ' (alternate)'};
    });
  }));
  return found || {clip: null, label: id};
}

function paintLog(){
  const el = document.getElementById('log');
  if (!el) return;
  el.innerHTML = LOG.map(r =>
    '<span class="t">' + r.t + '</span> ' +
    '<span class="' + (r.level === 'err' ? 'e' : r.level === 'warn' ? 'w-' : 'g') + '">' +
    esc(r.tag) + '</span>  ' + esc(r.text)).join('\n');
}

function copyLog(){
  const text = LOG.slice().reverse()
    .map(r => r.t + '  [' + r.level + '] ' + r.tag + '  ' + r.text).join('\n');
  const done = () => log('ok', 'log', 'copied ' + LOG.length + ' lines to the clipboard.');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done,
      () => log('err', 'log', 'the browser refused clipboard access.'));
  } else {
    log('err', 'log', 'this browser exposes no clipboard API.');
  }
}

/* Ask the server for each file on this page. A HEAD is enough and costs no bandwidth;
   some static hosts answer it oddly, so a non-2xx HEAD is re-checked with a 1-byte
   ranged GET before it is called a failure. */
function probe(){
  const p = DATA.pages[pageIndex];
  const srcs = new Map();
  p.sentences.forEach(s => {
    if (s.clip && s.clip.src) srcs.set(s.clip.src, s.clip);
    s.words.forEach(w => {
      if (w.clip && w.clip.src) srcs.set(w.clip.src, w.clip);
      if (w.alt && w.alt.src) srcs.set(w.alt.src, w.alt);
    });
  });
  log('ok', 'probe', 'asking the server for ' + srcs.size + ' files…');
  let ok = 0, bad = 0, left = srcs.size;
  srcs.forEach((clip, src) => {
    fetch(src, {method: 'HEAD', cache: 'no-store'})
      .then(r => r.ok ? r : fetch(src, {headers: {Range: 'bytes=0-0'}, cache: 'no-store'}))
      .then(r => {
        if (r.ok || r.status === 206) { ok++; }
        else { bad++; markBroken(clip, 'the server answered HTTP ' + r.status + ' for ' + src); }
      })
      .catch(e => { bad++; markBroken(clip, 'the request for ' + src + ' failed: ' + e.message); })
      .finally(() => {
        if (--left === 0)
          log(bad ? 'err' : 'ok', 'probe',
              'done: ' + ok + ' present, ' + bad + ' missing or unreachable.');
      });
  });
}
