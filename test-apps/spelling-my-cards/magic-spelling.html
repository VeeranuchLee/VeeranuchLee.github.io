  <style>
    *{box-sizing:border-box;margin:0;padding:0;touch-action:manipulation}
    body{font-family:'Nunito',sans-serif;min-height:100vh;overflow-x:hidden;background:#fce4ec}

    /* ── BG ── */
    .app-bg{position:fixed;inset:0;z-index:0;pointer-events:none;
      background-image:
        radial-gradient(1.8px 1.8px at 30px 40px,rgba(255,255,255,.95),transparent 55%),
        radial-gradient(1.4px 1.4px at 150px 110px,rgba(255,213,79,.8),transparent 55%),
        radial-gradient(1.2px 1.2px at 90px 180px,rgba(255,255,255,.7),transparent 55%),
        radial-gradient(ellipse 130% 55% at 50% 118%,rgba(206,147,216,.5),transparent 65%),
        linear-gradient(180deg,#ffe3ef 0%,#fdd0e2 45%,#e8d4f5 100%);
      background-size:240px 210px,240px 210px,240px 210px,cover,cover;
      background-repeat:repeat,repeat,repeat,no-repeat,no-repeat}
    @keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-8px)}}
    @keyframes float{from{transform:translateY(0)}to{transform:translateY(-9px)}}
    @media (prefers-reduced-motion: reduce){
      *{animation-duration:.001s!important}
    }

    /* ── LAYOUT ── */
    .screen{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px 12px 140px;gap:12px}

    /* ── HOME ── */
    .home-title{font-size:clamp(1.9rem,7.5vw,3.3rem);font-weight:900;text-align:center;display:flex;flex-wrap:wrap;justify-content:center;gap:2px;filter:drop-shadow(0 4px 8px rgba(173,20,87,.25));margin-top:6px}
    .home-title span{display:inline-block;animation:bounce 1.2s infinite alternate}
    .home-sub{font-size:1rem;font-weight:900;color:#ad1457;text-shadow:0 1px 0 #fff;letter-spacing:.5px}
    .home-crown-row{display:flex;gap:80px;align-items:center;justify-content:center;min-height:64px;margin-bottom:-6px}
    .home-crown{font-size:52px;line-height:1;filter:drop-shadow(0 5px 10px rgba(173,20,87,.25))}
    .mode-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;width:100%;max-width:640px}
    .mode-card{flex:1;min-width:140px;max-width:190px;border-radius:26px;padding:18px 12px 14px;cursor:pointer;border:none;display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .15s;font-family:inherit}
    .mode-card:active{transform:translateY(5px) scale(.96)}
    .mc-pink  {background:linear-gradient(160deg,#f48fb1,#e91e63);box-shadow:0 7px 0 #ad1457,0 10px 20px rgba(233,30,99,.3)}
    .mc-purple{background:linear-gradient(160deg,#ce93d8,#7b1fa2);box-shadow:0 7px 0 #4a148c,0 10px 20px rgba(123,31,162,.3)}
    .mc-gold  {background:linear-gradient(160deg,#ffe082,#f9a825);box-shadow:0 7px 0 #e65100,0 10px 20px rgba(249,168,37,.35)}
    .mode-card-art{font-size:56px;line-height:1;height:64px;display:flex;align-items:center;justify-content:center}
    .mode-card-label{font-size:.95rem;font-weight:900;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.3)}
    .mode-card-sub{font-size:.68rem;font-weight:900;color:rgba(255,255,255,.92);text-shadow:0 1px 3px rgba(0,0,0,.25);margin-top:-4px}
    .trophy-line{font-size:.9rem;font-weight:900;color:#7b1fa2;background:rgba(255,255,255,.7);border-radius:50px;padding:5px 14px}

    /* ── TOP BAR / SHARED ── */
    .top-bar{width:100%;max-width:640px;display:flex;align-items:center;justify-content:space-between;gap:8px}
    .round-btn{width:46px;height:46px;border-radius:50%;border:none;background:#fff;color:#e91e63;font-size:1.3rem;font-weight:900;cursor:pointer;box-shadow:0 4px 0 #f48fb1;display:flex;align-items:center;justify-content:center;font-family:inherit}
    .round-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #f48fb1}
    /* Owner, 2026-08-27: *"need to make sure ALL games has back icon to the hub"* --
       a 4-year-old could not get out of this app. Fixed rather than in the top bar,
       because Home has no top bar to sit in, and top-left is where the same arrow
       lives in Space Math and Unicorn Math. z-index clears the drifting petals. */
    .hub-btn{position:fixed;top:12px;left:12px;z-index:20;text-decoration:none}
    .bar-label{font-size:.8rem;font-weight:900;color:#9c27b0;background:rgba(255,255,255,.7);border-radius:50px;padding:4px 12px}

    /* ── PACK GRID ── */
    .pack-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px;width:100%;max-width:640px}
    .pack-card{border:none;border-radius:20px;padding:12px 6px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:inherit;min-height:100px}
    .pack-card:active{transform:translateY(4px) scale(.97)}
    .pack-num{font-size:1.7rem;font-weight:900;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.3);line-height:1.1}
    .pack-word{font-size:.62rem;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,.85);text-shadow:0 1px 2px rgba(0,0,0,.25)}
    .pack-stars{font-size:.95rem;letter-spacing:2px;line-height:1;margin-top:2px}
    .star-on {color:#fff59d;text-shadow:0 1px 3px rgba(0,0,0,.35)}
    .star-off{color:rgba(255,255,255,.38)}

    /* ── GAME AREA ── */
    .prompt-bubble{background:linear-gradient(135deg,#fff,#fce4ec);border:2.5px solid #f48fb1;border-radius:20px;padding:10px 18px;box-shadow:0 4px 0 #f48fb1;font-size:clamp(1rem,4vw,1.4rem);font-weight:900;color:#333;text-align:center;display:flex;align-items:center;gap:10px}
    /* THE ROBOT IS THE BUTTON. This was a bare 🔊 on a purple pill, and the emoji is drawn
       by the operating system -- a grey metal speaker on macOS, something else again on the
       iPad -- so it was chrome pretending to be art. It also asked a pre-reader to
       know that a speaker glyph means "press me and I will say it", which is exactly the
       kind of reading this game exists to teach. A face that opens its mouth when you tap
       it needs no such decoding. Sized well past the 44px tap minimum, both because the
       target must stay generous and because the ABC on his chin has to read at all. */
    /* THE ROBOT STANDS OUTSIDE THE BUBBLE, and the bubble points at him. Inside it he was
       58px of button glyph -- at that size the ABC on his chin is a smudge and he reads as
       decoration on a control. Out here at 88px he is a character who is saying the thing
       in the bubble, which is what a speech bubble has always meant. */
    .read-row{display:flex;align-items:center;gap:12px;max-width:min(94vw,640px)}
    .speak-btn{border:none;background:none;padding:0;width:88px;height:88px;cursor:pointer;flex-shrink:0;display:grid;place-items:center;-webkit-tap-highlight-color:transparent}
    .speak-btn:active{transform:translateY(2px)}
    .read-row .prompt-bubble{position:relative}
    .read-row .prompt-bubble::before{content:'';position:absolute;left:-11px;top:50%;transform:translateY(-50%);border:9px solid transparent;border-right-color:#f48fb1;border-left:0}
    .read-row .prompt-bubble::after{content:'';position:absolute;left:-7px;top:50%;transform:translateY(-50%);border:8px solid transparent;border-right-color:#fff;border-left:0}
    .rb-robot{width:88px;display:grid;place-items:center}
    /* Both frames share one grid cell so the swap cannot shift the bubble by a pixel, and
       both are in the DOM from the start so the first word never waits for a decode. An
       animated WebP cannot be paused, so the idle robot is simply the still one with the
       animation running unseen underneath. At 58px that costs nothing. */
    .rb-robot img{width:100%;height:auto;display:block;grid-area:1/1;transition:opacity .18s linear}
    .rb-robot .rb-talk{opacity:0}
    .rb-robot.talking .rb-still{opacity:0}
    .rb-robot.talking .rb-talk{opacity:1}
    @media (prefers-reduced-motion: reduce){
      .rb-robot .rb-talk{display:none}
      .rb-robot .rb-still{opacity:1 !important}
      /* Movement is refused, so "who is speaking" falls back to light on the still face --
         the child still has to know the robot is the one talking. */
      .rb-robot.talking{animation:rbPulse 1.4s ease-in-out infinite}
    }
    @keyframes rbPulse{0%,100%{filter:none}50%{filter:brightness(1.12) drop-shadow(0 0 9px rgba(233,30,99,.7))}}
    .icon-svg{width:22px;height:22px;display:block}

    /* THE SLOTS ARE LOWERCASE NOW, and that is the point. The old game showed CAT in
       capitals because it was teaching letter recognition; this game teaches children to
       write real words, and a Grade 3 child writes "because", not "BECAUSE". Capitals
       appear exactly where the written form has them -- the I in I'll, the M in Mrs. --
       so the tiles a child taps are the characters they would put on paper. */
    .slot-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
    .slot{width:52px;height:58px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.7rem;font-weight:900;background:rgba(255,255,255,.55);border:3px dashed #f06292;color:#ad1457}
    .slot.filled{background:linear-gradient(160deg,#fff,#fce4ec);border:3px solid #e91e63;animation:popIn .3s cubic-bezier(.34,1.56,.64,1)}
    .slot-row.long{gap:5px}
    .slot-row.long .slot{width:38px;height:46px;font-size:1.2rem;border-radius:10px;border-width:2.5px}
    @keyframes popIn{from{transform:scale(0) rotate(-10deg)}to{transform:scale(1)}}

    .tile-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;max-width:560px}
    .tile{width:60px;height:64px;border-radius:16px;border:none;font-family:inherit;font-size:1.8rem;font-weight:900;color:#fff;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.25);transition:transform .1s}
    .tile:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
    .tile.t0{background:linear-gradient(160deg,#f48fb1,#e91e63);box-shadow:0 5px 0 #ad1457}
    .tile.t1{background:linear-gradient(160deg,#ce93d8,#8e24aa);box-shadow:0 5px 0 #4a148c}
    .tile.t2{background:linear-gradient(160deg,#ffd54f,#f9a825);box-shadow:0 5px 0 #e65100}
    .tile.t3{background:linear-gradient(160deg,#80cbc4,#00897b);box-shadow:0 5px 0 #004d40}
    .tile.used{opacity:.25;pointer-events:none;transform:scale(.9)}
    .tile.wrong{animation:wrongShake .35s ease}
    .tile.right{animation:correctPop .5s ease}
    /* THE HINT GLOWS THE TILES THAT COULD BE NEXT, and never fills the slot for the child
       until the third miss. It is help that still asks for a tap -- the child keeps the
       agency of choosing, which is the whole difference between help and the game
       playing itself. */
    .tile.hint{animation:hintGlow 1s ease-in-out infinite alternate}
    @keyframes hintGlow{from{outline:0 solid rgba(255,213,79,0)}to{outline:5px solid rgba(255,213,79,.9)}}
    .tile-row.dense{gap:7px;max-width:600px}
    .tile-row.dense .tile{width:46px;height:50px;font-size:1.3rem;border-radius:12px}
    @keyframes correctPop{0%{transform:scale(1)}40%{transform:scale(1.4) rotate(-8deg)}70%{transform:scale(1.2) rotate(8deg)}100%{transform:scale(1)}}
    @keyframes wrongShake{0%,100%{transform:translateX(0)}25%,75%{transform:translateX(-8px)}50%{transform:translateX(8px)}}

    .praise-banner{font-size:1.3rem;font-weight:900;color:#e91e63;text-shadow:0 1px 0 #fff;animation:popIn .35s cubic-bezier(.34,1.56,.64,1);min-height:1.6em;text-align:center}

    /* ── PACK COMPLETE ── */
    .complete-overlay{position:fixed;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;background:rgba(255,240,247,.94);backdrop-filter:blur(4px)}
    .complete-stars{font-size:clamp(56px,16vw,84px);display:flex;gap:12px;line-height:1}
    .complete-stars span{display:inline-block;animation:popIn .55s cubic-bezier(.34,1.56,.64,1) both}
    .complete-stars .off{filter:grayscale(1);opacity:.3}
    .complete-title{font-size:clamp(1.4rem,6vw,2rem);font-weight:900;color:#ad1457;text-shadow:0 1px 0 #fff;text-align:center}
    .complete-sub{font-size:1rem;font-weight:900;color:#880e4f}
    .complete-btn-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:8px}
    .big-btn{border:none;border-radius:50px;padding:14px 26px;font-family:inherit;font-size:1rem;font-weight:900;color:#fff;cursor:pointer;background:linear-gradient(160deg,#f06292,#c2185b);box-shadow:0 5px 0 #880e4f}
    .big-btn.alt{background:linear-gradient(160deg,#ce93d8,#7b1fa2);box-shadow:0 5px 0 #4a148c}
    .big-btn:active{transform:translateY(4px);box-shadow:0 1px 0 #880e4f}

    /* ── SCORE / GARDEN ── */
    .score-row{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.55);backdrop-filter:blur(6px);border-top:2px solid rgba(244,143,177,.5)}
    .score-badge{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.85);border:2px solid #f8bbd0;border-radius:50px;padding:5px 12px;font-weight:900;color:#ad1457;font-size:.95rem}
    .flower-garden{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;padding:6px 8px;background:rgba(255,255,255,.84);border:2px solid #f8bbd0;border-radius:16px;max-width:300px;flex:1}
    .flower-slot{width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:17px;line-height:1}
    .flower-slot.empty{opacity:.18;filter:grayscale(.45)}
    .flower-slot.filled{animation:popIn .35s cubic-bezier(.34,1.56,.64,1);filter:drop-shadow(0 2px 3px rgba(123,31,162,.25))}
    .garden-full-badge{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:linear-gradient(160deg,#ffd54f,#f9a825);color:#7b1fa2;font-weight:900;padding:8px 18px;border-radius:50px;box-shadow:0 5px 0 #e65100;z-index:6;animation:popIn .35s}

    /* ── MASCOT ── */
    .mascot-corner{position:fixed;left:18px;bottom:76px;width:104px;height:104px;z-index:6;pointer-events:none;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 7px 14px rgba(123,31,162,.32))}
    .mascot-corner::before{content:'';position:absolute;left:50%;bottom:2px;width:96%;height:82%;transform:translateX(-50%);border-radius:999px;background:radial-gradient(circle at 50% 54%,rgba(255,255,255,.96) 0 46%,rgba(255,245,253,.82) 58%,rgba(244,143,177,.38) 75%,rgba(244,143,177,0) 100%);box-shadow:0 0 0 3px rgba(255,255,255,.62),0 8px 22px rgba(123,31,162,.22)}
    .mascot-emoji{position:relative;font-size:58px;line-height:1;animation:float 2.3s ease-in-out infinite alternate;transform-origin:center bottom}
    .mascot-corner.happy .mascot-emoji{animation:correctPop 1s cubic-bezier(.34,1.56,.64,1)}
    .mascot-corner.oops .mascot-emoji{animation:wrongShake .4s ease}
    @media (max-width:560px){
      .mascot-corner{width:76px;height:76px;left:8px;bottom:70px}
      .mascot-emoji{font-size:44px}
      .flower-garden{max-width:240px}
      .flower-slot{width:20px;height:20px;font-size:14px}
      .slot{width:44px;height:50px;font-size:1.4rem}
      .tile{width:52px;height:56px;font-size:1.5rem}
      .slot-row.long{gap:3px}
      .slot-row.long .slot{width:29px;height:36px;font-size:.95rem;border-width:2px}
      .tile-row.dense{gap:5px}
      .tile-row.dense .tile{width:41px;height:45px;font-size:1.05rem}
    }

    /* ── CONFETTI ── */
    .confetti-container{position:fixed;inset:0;pointer-events:none;z-index:9;overflow:hidden}
    .confetti-piece{position:absolute;top:-24px;animation:confettiFall linear forwards}
    @keyframes confettiFall{to{transform:translateY(110vh) rotate(560deg)}}

    /* Enchanted Spelling Workshop — live controls over dedicated art plates. */
    :root{--ink:#2b1626;--plum:#4a2340;--violet:#7c3aed;--lavender:#a78bfa;--gold:#ffd54f;--cream:#fff5d6}
    html,body,#root{min-height:100%;touch-action:manipulation}
    body{background:var(--ink);color:var(--cream);overflow:hidden}
    button,a{font:inherit}
    button:focus-visible,a:focus-visible{outline:5px solid var(--gold);outline-offset:4px}
    .app-bg{display:none}
    .screen{min-height:100svh;padding:max(12px,env(safe-area-inset-top)) 14px calc(92px + env(safe-area-inset-bottom));gap:10px;background-position:center;background-size:cover;overflow:hidden}
    .workshop-screen{background-image:linear-gradient(rgba(43,22,38,.12),rgba(43,22,38,.2)),url('assets-runtime/spelling/workshop/grade-room-landscape.webp')}
    .shelf-screen{background-image:linear-gradient(rgba(43,22,38,.16),rgba(43,22,38,.18)),url('assets-runtime/spelling/workshop/pack-shelf-landscape.webp')}
    .desk-screen{background-image:url('assets-runtime/spelling/workshop/desk-landscape.webp');--paper-left:26.2vw;--paper-top:30.5vh;--paper-width:59.8vw;--paper-height:20.5vh;--read-top:31.1vh;--read-height:9.8vh;--praise-top:40.3vh;--slot-left:28.9vw;--slot-top:42.8vh;--slot-width:54.4vw;--tray-left:5.5vw;--tray-top:55.5vh;--tray-width:89vw}
    .complete-screen{background-image:url('assets-runtime/spelling/workshop/complete-landscape.webp')}
    .top-bar{max-width:960px;z-index:3}.round-btn{width:54px;height:54px;background:rgba(58,30,51,.94);color:var(--gold);box-shadow:0 4px 0 #1c0d19;border:2px solid rgba(255,213,79,.65)}
    .bar-label{font-size:clamp(.78rem,2.2vw,1rem);color:var(--cream);background:rgba(43,22,38,.9);border:2px solid rgba(255,213,79,.55);padding:7px 14px}
    .hub-btn{top:max(12px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left))}.workshop-mute{position:fixed;top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));z-index:20}
    .workshop-title{font-family:'Fredoka One',sans-serif;font-size:clamp(1.55rem,5vw,2.8rem);color:var(--cream);text-align:center;text-shadow:0 3px 10px #1c0d19;margin-top:2px}
    .station-grid{width:min(96vw,1050px);margin:auto 0 4px;display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(10px,2.5vw,28px);align-items:end}
    .station-card{min-height:190px;border:3px solid rgba(255,213,79,.75);border-radius:26px;padding:12px;background:linear-gradient(180deg,rgba(58,30,51,.15),rgba(43,22,38,.92));color:#fff;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;text-align:center;cursor:pointer;box-shadow:0 8px 22px rgba(20,8,18,.45);transition:transform .2s,filter .2s}
    .station-card:active{transform:translateY(4px) scale(.98)}.station-name{font-family:'Fredoka One';font-size:clamp(1.05rem,2.6vw,1.55rem);color:var(--gold)}.station-grade{font-weight:900;font-size:1rem}.station-progress{font-size:.78rem;font-weight:800;margin-top:5px;line-height:1.25}
    .continue-btn{min-height:58px;border:3px solid var(--gold);border-radius:999px;padding:10px 28px;background:linear-gradient(#8b5cf6,#5b21b6);color:white;font-weight:900;font-size:1.05rem;box-shadow:0 5px 0 #35106d;cursor:pointer}.continue-btn:active{transform:translateY(4px);box-shadow:0 1px 0 #35106d}.continue-btn[disabled]{opacity:.7}
    .drawer-summary{background:rgba(43,22,38,.92);border:2px solid rgba(255,213,79,.65);border-radius:18px;padding:7px 14px;font-weight:900;color:var(--cream)}

/* ══ SOUND ══ */
const Sound=(()=>{ 
  let _ctx=null,_muted=false;
  const ctx=()=>{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;if(!_ctx)_ctx=new AC();if(_ctx.state==='suspended')_ctx.resume();return _ctx;};
  if (typeof AudioWake !== "undefined") AudioWake.attach(()=>_ctx,()=>{_ctx=null});
  const tone=(c,freq,type,t,dur,vol,fe)=>{try{const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type=type;o.frequency.setValueAtTime(freq,t);if(fe)o.frequency.exponentialRampToValueAtTime(fe,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.start(t);o.stop(t+dur);}catch(e){}};
  return{
    setMuted(m){_muted=m;},
    tap(){if(_muted)return;const c=ctx();if(!c)return;const n=c.currentTime;tone(c,880,'sine',n,.08,.12);tone(c,1320,'sine',n+.04,.06,.08);},
    ding(){if(_muted)return;const c=ctx();if(!c)return;const n=c.currentTime;[[523,0],[659,.06],[784,.12],[1047,.22]].forEach(([f,t])=>tone(c,f,'sine',n+t,.45,.16));},
    wrong(){if(_muted)return;const c=ctx();if(!c)return;const n=c.currentTime;tone(c,220,'sawtooth',n,.28,.09,100);},
    celebrate(){if(_muted)return;const c=ctx();if(!c)return;const n=c.currentTime;[[523,0],[659,.1],[784,.2],[1047,.32],[784,.46],[1047,.58],[1319,.68],[1047,.82]].forEach(([f,t])=>tone(c,f,'sine',n+t,.2,.18));},
    fanfare(){if(_muted)return;const c=ctx();if(!c)return;const n=c.currentTime;[523,659,784,1047,1319,1568,2093,1568,1319,1047].forEach((f,i)=>tone(c,f,'sine',n+i*.1,.2,.22));}
  };
})();

/* ══ VOICE ══ */
let _voiceMuted=false;
const Voice={
  setMuted(m){_voiceMuted=m; if(m&&window.speechSynthesis)window.speechSynthesis.cancel();},
  say(text,rate=0.85,on){
    const off=()=>{try{on&&on(false);}catch(e){}};
    if(_voiceMuted){off();return;}
    try{
      const s=window.speechSynthesis; if(!s){off();return;}
      s.cancel();
      const u=new SpeechSynthesisUtterance(text);
      u.rate=rate; u.pitch=1.15; u.lang='en-US';
      u.onstart=()=>{try{on&&on(true);}catch(e){}};
      u.onend=off; u.onerror=off;
      s.speak(u);
    }catch(e){off();}
  }
};

/* ══ NARRATION CLIPS ══
   Rendered speech for the whole game -- every word, the praise and the pack-complete
   lines -- replacing the browser's adult robot voice, which was never a decision for
   this game, just what it always had (2026-08-27 open item, closed by the owner
   2026-08-29: render it). Same resolver idea as Space Math's Clips: the game asks for
   a line by its exact text and neither knows nor cares whether a file exists, so a
   missing clip falls back to speechSynthesis line by line rather than breaking the
   game. One set, exact strings only -- there are no patterns here because every spoken
   line in this game is one of a fixed handful of strings plus the words themselves,
   which is exactly what made the render affordable. The index is fetched, not guessed:
   without clips.json the only way to discover a missing clip is a 404 the child hears
   as silence before the engine picks the word up. */
const Clips=(()=>{
  const ROOT='assets-runtime/narration/spelling/';
  let texts=null,tried=false;
  const load=()=>{ if(tried)return; tried=true;
    try{ fetch(ROOT+'clips.json').then(r=>r.ok?r.json():null).then(j=>{ if(j&&j.texts)texts=j.texts; }).catch(()=>{}); }catch(e){}
  };
  return { url(text){ load(); const s=String(text).trim(); return (texts&&texts[s])?ROOT+texts[s]+'.m4a':null; } };
})();
/* One Audio at a time, so a rapid robot tap cannot stack two words on top of each
   other, and so the mute button can stop a clip that is already playing. */
let _lineAudio=null;
const speakLine=(text,rate=0.95)=>{
  try{_lineAudio&&_lineAudio.pause();}catch(e){}
  _lineAudio=null;
  const u=Clips.url(text);
  if(u){
    const a=new Audio(u); _lineAudio=a;
    a.onended=()=>{_lineAudio=null;}; a.onerror=()=>{_lineAudio=null;Voice.say(text,rate);};
    a.play().catch(()=>{_lineAudio=null;Voice.say(text,rate);});
  } else Voice.say(text,rate);
};

const CARDS_BY_SENSE=new Map(CARD_ENTRIES.map(e=>[e.s,e]));
/* Absolute on purpose -- published, /magic-math/ and /word-book/ are siblings, but in
   this repo the Word Book is a separate top-level folder, so a relative path would
   work live and 404 in every local and Test Hub preview. Same literal the exit arrow
   in Home uses. */
const WORD_BOOK_BASE='https://veeranuchlee.github.io/word-book/';
const cardPic=e=>WORD_BOOK_BASE+e.pic;
const cardAud=e=>WORD_BOOK_BASE+e.aud;
/* The tray's save goes through the SAME test-hub split as the progress store, so a
   Test Hub slot can never touch a child's live tray. Only {w,s} is persisted: the
   sense id is the card's stable handle and everything else is re-resolved from the
   snapshot, so a card whose sense left the dictionary drops out of the tray by itself
   instead of half-rendering. */
const LIVE_CARDS_KEY='magicSpelling.myCards.v1';
const CARDS_KEY=storageKeyForPath(window.location.pathname).replace(LIVE_STORE_KEY,LIVE_CARDS_KEY);
function loadMyCards(){
  try{
    const raw=JSON.parse(localStorage.getItem(CARDS_KEY));
    if(!Array.isArray(raw))return[];
    const seen=new Set(),out=[];
    for(const x of raw){
      if(out.length>=CARDS_CAP)break;
      if(!x||typeof x.s!=='string'||seen.has(x.s)||!CARDS_BY_SENSE.has(x.s))continue;
      seen.add(x.s);out.push(CARDS_BY_SENSE.get(x.s));
    }
    return out;
  }catch(e){return[];}
}
/* One picture fetch per card, fire and forget: not a preload (nothing shown waits on
   it), but the worker's runtime cache being filled while the network is up, so the
   card is offline from the moment it is chosen. */
function warmCardFetch(entries){
  entries.forEach(e=>{try{fetch(cardPic(e)).catch(()=>{});}catch(err){}});
}
/* Tap a card, hear its word: the Word Book's rendered clip, with this app's existing
   speech-engine net underneath. Shares _lineAudio with the robot so two voices can
   never talk over each other. */
function sayCardWord(entry){
  Sound.tap();
  try{_lineAudio&&_lineAudio.pause();}catch(e){}
  _lineAudio=null;
  const a=new Audio(cardAud(entry));
  _lineAudio=a;
  a.onended=()=>{if(_lineAudio===a)_lineAudio=null;};
  a.onerror=()=>{if(_lineAudio===a)_lineAudio=null;Voice.say(entry.w,0.85);};
  a.play().catch(()=>{if(_lineAudio===a)_lineAudio=null;Voice.say(entry.w,0.85);});
}

/* ══ SPELLING PRIMITIVES (shared, pure) ══
   Everything deterministic about the game engine, with the randomness injected as an
   `rng` argument so tools/test-spelling-game.js can replay it from a seed and test the
   engine the page actually ships -- the same discipline as the maths primitives block
   in space-math.html. Nothing in this block touches React, the DOM or the word data. */
const DECOY_ALPHABET='abcdefghijklmnopqrstuvwxyz';
function mulberry32(seed){
  let a=seed>>>0;
  return function(){
    a|=0; a=(a+0x6D2B79F5)|0;
    let t=Math.imul(a^(a>>>15),1|a);
    t=(t+Math.imul(t^(t>>>7),61|t))^t;
    return ((t^(t>>>14))>>>0)/4294967296;
  };
}
function randR(rng,a,b){return Math.floor(rng()*(b-a+1))+a;}
function shuffleR(rng,arr){
  const x=arr.slice();
  for(let i=x.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[x[i],x[j]]=[x[j],x[i]];}
  return x;
}

/* Map a rectangle measured on a source plate through CSS `background-size:cover`.
   The intersection is intentional: on a viewport narrower than the selected portrait
   plate (or shorter than the landscape plate), controls follow the visible part of the
   painted surface instead of following coordinates that have been cropped away. */
const DESK_ART={
  landscape:{width:1448,height:1086,paper:{x:.262,y:.305,w:.598,h:.205},tray:{x:.055,y:.555,w:.89,h:.30}},
  portrait:{width:1086,height:1448,paper:{x:.145,y:.279,w:.72,h:.215},tray:{x:.05,y:.535,w:.90,h:.30}},
};
function coverRect(viewWidth,viewHeight,sourceWidth,sourceHeight,rect,inset=8){
  const scale=Math.max(viewWidth/sourceWidth,viewHeight/sourceHeight);
  const offsetX=(viewWidth-sourceWidth*scale)/2;
  const offsetY=(viewHeight-sourceHeight*scale)/2;
  const left=Math.max(inset,offsetX+rect.x*sourceWidth*scale);
  const top=Math.max(0,offsetY+rect.y*sourceHeight*scale);
  const right=Math.min(viewWidth-inset,offsetX+(rect.x+rect.w)*sourceWidth*scale);
  const bottom=Math.min(viewHeight,offsetY+(rect.y+rect.h)*sourceHeight*scale);
  return{left,top,width:Math.max(0,right-left),height:Math.max(0,bottom-top)};
}
function deskArtLayout(viewWidth,viewHeight){
  const orientation=viewWidth>=viewHeight?'landscape':'portrait';
  const art=DESK_ART[orientation];
  return{orientation,paper:coverRect(viewWidth,viewHeight,art.width,art.height,art.paper),tray:coverRect(viewWidth,viewHeight,art.width,art.height,art.tray)};
}
/* Decoy letters scale with word length: two for the short words a beginner meets, four
   for the eight-and-up words where the tile bank is already big. The count is small on
   purpose -- every extra decoy makes "guess by elimination" easier than spelling. */
function decoyCount(len){return len<=4?2:len<=7?3:4;}
function makeTiles(word,rng){
  const inWord=new Set(word.toLowerCase().split(''));
  const decoys=[];
  while(decoys.length<decoyCount(word.length)){
    const c=DECOY_ALPHABET[randR(rng,0,25)];
    if(!inWord.has(c)&&!decoys.includes(c))decoys.push(c);
  }
  /* A capital in the word (the I of I'll) still gets its capital tile; decoys are
     always lowercase, so a capital tile is always a real letter of the word. */
  return shuffleR(rng,word.split('').concat(decoys)).map((c,i)=>({c,id:i}));
}
/* The robot says the bare word, except for the words English cannot disambiguate by
   ear -- "two" sounds exactly like "too", so those carry a context line that names
   which spelling is meant without ever showing it. */
function lineFor(word,homophones){
  const h=homophones&&homophones[word];
  return h?word+'. '+h:word;
}
/* Stars measure independence, not just completion: three stars means every word in the
   pack was spelled with no wrong tap at all; two means wrong taps but never the
   auto-fill ladder; one means the game had to fill letters in. A child who needs the
   ladder still finishes the pack -- the stars simply tell the truth about how much
   help it took. */
function starsFor(pass1){
  if(pass1.wrongTaps===0)return 3;
  if(pass1.autoFills===0)return 2;
  return 1;
}
function packId(grade,packIdx){return 'G'+grade+'-'+String(packIdx+1).padStart(2,'0');}
function defaultState(){return {version:2,stars:{},bouquets:0,words:{},rewardedWords:{},bouquetAwards:{},attempts:{},active:{global:null,grades:{}}};}
function recordPack(state,id,stars){
  const prev=(state.stars&&state.stars[id])||0;
  return {...state,stars:{...state.stars,[id]:Math.max(prev,stars)}};
}
function addBouquet(state){return {...state,bouquets:(state.bouquets||0)+1};}

/* Word progress is additive to the v1 star/bouquet store. A stable word id is derived
   from the curriculum position, never the display order, so shuffling or wording does
   not strand a save. A v1 pack with stars was already completed; migration therefore
   marks all its words complete and rewarded without paying anything again. */
function wordId(grade,packIdx,wordIdx){return packId(grade,packIdx)+':W'+String(wordIdx+1).padStart(2,'0');}
function migrateState(raw,universe){
  const base=defaultState(), old=raw&&typeof raw==='object'?raw:{};
  const next={...base,...old,version:2,stars:{...(old.stars||{})},words:{...(old.words||{})},
    rewardedWords:{...(old.rewardedWords||{})},bouquetAwards:{...(old.bouquetAwards||{})},attempts:{...(old.attempts||{})},
    active:{global:null,grades:{},...(old.active||{}),grades:{...((old.active&&old.active.grades)||{})}}};
  for(const gs of ['1','2','3']) universe.grades[gs].forEach((pack,pi)=>{
    const pid=packId(Number(gs),pi);
    if((next.stars[pid]||0)>0) pack.forEach((_,wi)=>{
      const wid=wordId(Number(gs),pi,wi); next.words[wid]=true; next.rewardedWords[wid]=true;
    });
    if((next.stars[pid]||0)===3)next.bouquetAwards[pid]=true;
  });
  return next;
}
function packProgress(state,universe,grade,packIdx){
  const pack=universe.grades[String(grade)][packIdx];
  const done=pack.reduce((n,_,wi)=>n+(state.words&&state.words[wordId(grade,packIdx,wi)]?1:0),0);
  return {done,total:pack.length,status:done===0?'Not Started':done===pack.length?'Completed':'In Progress'};
}
function firstUnfinishedWord(state,universe,grade,packIdx){
  const pack=universe.grades[String(grade)][packIdx];
  const wi=pack.findIndex((_,i)=>!(state.words&&state.words[wordId(grade,packIdx,i)]));
  return wi<0?0:wi;
}
function sessionWordIndices(state,universe,grade,packIdx){
  const pack=universe.grades[String(grade)][packIdx];
  const pending=pack.map((_,i)=>i).filter(i=>!(state.words&&state.words[wordId(grade,packIdx,i)]));
  return pending.length?pending:pack.map((_,i)=>i);
}
function isUnfinishedPack(state,universe,grade,packIdx){return packProgress(state,universe,grade,packIdx).status!=='Completed';}
function chooseContinue(state,universe,grade){
  const grades=grade?[Number(grade)]:[1,2,3];
  const active=grade?(state.active&&state.active.grades&&state.active.grades[String(grade)]):(state.active&&state.active.global);
  if(active&&grades.includes(Number(active.g))&&isUnfinishedPack(state,universe,active.g,active.p))
    return {g:Number(active.g),p:active.p,w:firstUnfinishedWord(state,universe,active.g,active.p)};
  if(active&&grades.includes(Number(active.g))){const after=nextUnfinishedAfter(state,universe,Number(active.g),active.p);if(after)return after;}
  for(const g of grades) for(let p=0;p<universe.grades[String(g)].length;p++)
    if(isUnfinishedPack(state,universe,g,p))return {g,p,w:firstUnfinishedWord(state,universe,g,p)};
  return null;
}
function nextUnfinishedAfter(state,universe,grade,packIdx){
  const n=universe.grades[String(grade)].length;
  for(let step=1;step<=n;step++){const p=(packIdx+step)%n;if(isUnfinishedPack(state,universe,grade,p))return {g:Number(grade),p,w:firstUnfinishedWord(state,universe,grade,p)};}
  return null;
}
function markActive(state,grade,packIdx){
  const ref={g:Number(grade),p:packIdx};
  return {...state,active:{global:ref,grades:{...((state.active&&state.active.grades)||{}),[String(grade)]:ref}}};
}
function completeWord(state,grade,packIdx,wordIdx){
  const wid=wordId(grade,packIdx,wordIdx),first=!(state.words&&state.words[wid]);
  return {state:{...state,words:{...(state.words||{}),[wid]:true}},first,wid};
}
function awardWordOnce(state,wid){
  if(state.rewardedWords&&state.rewardedWords[wid])return {state,award:false};
  return {state:{...state,rewardedWords:{...(state.rewardedWords||{}),[wid]:true}},award:true};
}
function awardBouquetOnce(state,pid){
  if(state.bouquetAwards&&state.bouquetAwards[pid])return state;
  return {...addBouquet(state),bouquetAwards:{...(state.bouquetAwards||{}),[pid]:true}};
}
function recordAttempt(state,pid,kind){
  const prev=(state.attempts&&state.attempts[pid])||{wrongTaps:0,autoFills:0};
  const next={...prev,wrongTaps:prev.wrongTaps+1,autoFills:prev.autoFills+(kind==='autofill'?1:0)};
  return {...state,attempts:{...(state.attempts||{}),[pid]:next}};
}
function clearAttempt(state,pid){const attempts={...(state.attempts||{})};delete attempts[pid];return {...state,attempts};}

/* ── THE SESSION ENGINE ──
   One pack = a first pass over every word, then as many "practice again" passes over
   the words that needed the auto-fill ladder as it takes to clear one with none. Words
   a child self-corrects (one or two wrong taps, then the right tile) are NOT re-asked:
   re-queuing every imperfect word would double a nine-word pack for one slip, and the
   stars already record the slip. */
function initSession(words,rng){
  const q=shuffleR(rng,words.slice());
  return {passNo:1,q,qi:0,word:q[0],filled:0,used:[],tiles:makeTiles(q[0],rng),
    posMisses:0,hint:false,wordWrong:0,wordAuto:false,
    pass1:{wrongTaps:0,autoFills:0},relearn:[],stars:0,
    celebrating:false,relearnPulse:false,complete:false};
}
/* THE HELP LADDER, three rungs and never a dead end:
     miss 1  -- shake and buzz, try again;
     miss 2  -- every tile that could fill this slot glows (still the child's choice);
     miss 3  -- the game fills the letter in, the word is marked as helped, and it will
                come back in the practice pass at the end of the pack.
   The engine never blocks, and the child can always finish by tapping glowing tiles. */
function applyTap(s,tileId){
  if(s.celebrating||s.complete)return {s,fx:null};
  const t=s.tiles.find(x=>x.id===tileId);
  if(!t||s.used.includes(tileId))return {s,fx:null};
  if(t.c===s.word[s.filled]){
    const used=[...s.used,tileId];
    const filled=s.filled+1;
    if(filled>=s.word.length){
      return {s:{...s,used,filled,celebrating:true,
        relearn:s.wordAuto?[...s.relearn,s.word]:s.relearn},
        fx:{tile:tileId,kind:'right'}};
    }
    return {s:{...s,used,filled,posMisses:0,hint:false},fx:{tile:tileId,kind:'right'}};
  }
  const misses=s.posMisses+1;
  const wordWrong=s.wordWrong+1;
  let pass1=s.pass1;
  if(s.passNo===1)pass1={...pass1,wrongTaps:pass1.wrongTaps+1};
  if(misses>=3){
    /* Auto-fill: consume an unused tile carrying the needed letter so the bank stays
       honest -- every letter that lands in a slot comes from a tile the child can see. */
    const need=s.word[s.filled];
    const tile=s.tiles.find(x=>x.c===need&&!s.used.includes(x.id));
    const used=tile?[...s.used,tile.id]:s.used;
    const filled=s.filled+1;
    let p1=pass1;
    if(s.passNo===1)p1={...p1,autoFills:p1.autoFills+1};
    const base={...s,used,filled,posMisses:0,hint:false,wordWrong,wordAuto:true,pass1:p1};
    if(filled>=s.word.length){
      return {s:{...base,celebrating:true,relearn:[...s.relearn,s.word]},
        fx:{tile:tile?tile.id:null,kind:'autofill'}};
    }
    return {s:base,fx:{tile:tile?tile.id:null,kind:'autofill'}};
  }
  return {s:{...s,posMisses:misses,hint:misses>=2,wordWrong,pass1},fx:{tile:tileId,kind:'wrong'}};
}
function nextWord(s,rng){
  if(!s.celebrating)return s;
  const ni=s.qi+1;
  const fresh=w=>({word:w,filled:0,used:[],tiles:makeTiles(w,rng),posMisses:0,hint:false,wordWrong:0,wordAuto:false});
  if(ni<s.q.length){
    return {...s,qi:ni,...fresh(s.q[ni]),celebrating:false,relearnPulse:false};
  }
  const stars=s.passNo===1?starsFor(s.pass1):s.stars;
  if(s.relearn.length){
    const q2=shuffleR(rng,s.relearn.slice());
    return {...s,passNo:s.passNo+1,q:q2,qi:0,...fresh(q2[0]),relearn:[],stars,
      celebrating:false,relearnPulse:true};
  }
  return {...s,celebrating:false,complete:true,stars};
}

/* The owner-selected purple book belongs to this workshop only. Other Magic Math games
   retain their robots. Each state uses a cut from the supplied pose sheet, never a CSS
   distortion or a regenerated approximation. */
function BookMascot({pose,feedback=false}){
  return(
    <img className={`book-mascot ${pose==='listening'?'listening':''} ${feedback?'feedback':''}`}
      src={`assets-runtime/spelling/mascot/${pose}.webp`} alt="" aria-hidden="true"/>
  );
}
/* ONE TOKEN PER TAP, and only the current tap may stop the mouth. `speechSynthesis.cancel()`
   fires `end` on the utterance it is cancelling, so without this the SECOND tap starts the
   animation and is then killed a tick later by the FIRST tap's end event -- the robot moved
   once per session and never again, which is the opposite of how a child uses him. */
function useReader(){
  const [speaking,setSpeaking]=useState(false);
  const t=useRef(0);
  const gen=useRef(0);
  const audio=useRef(null);
  useEffect(()=>()=>{clearTimeout(t.current);try{audio.current&&audio.current.pause();}catch(e){}},[]);
  const stop=useCallback(()=>{clearTimeout(t.current);setSpeaking(false);},[]);
  /* THE MOUTH STARTS ON THE TAP, NOT ON THE ENGINE'S `onstart`. Driving it from onstart
     reads better on paper and fails in practice: Chrome never fires it while the document
     is hidden (the utterance sits queued with speaking===true), and iOS Safari drops
     utterances outright. A robot that stays still when a child taps him reads as broken,
     which is far worse than one who mouths a beat past the voice. With a rendered clip
     the audio's own `ended` stops him early; the timeout stays as the net under both.
     The optional `clip` is a My-cards word's Word Book recording -- a dictionary import
     the narration bank never rendered -- and it takes precedence over the bank lookup
     while keeping the same fallback chain underneath. */
  const say=useCallback((text,clip)=>{
    const mine=++gen.current;
    Sound.tap();
    clearTimeout(t.current);
    try{audio.current&&audio.current.pause();}catch(e){}
    const stopMine=()=>{if(gen.current===mine)stop();};
    setSpeaking(true);
    t.current=setTimeout(stopMine,Math.max(2400,text.length*110+900));
    const fallback=()=>Voice.say(text,0.85,on=>{if(!on)stopMine();});
    const u=clip||Clips.url(text);
    if(u){
      const a=new Audio(u); audio.current=a;
      a.onended=stopMine; a.onerror=()=>{stopMine();fallback();};
      a.play().catch(fallback);
    } else fallback();
  },[stop]);
  return{speaking,say};
}

function gradeStars(store,grade){

/* THE PICKER SHOWS THE DICTIONARY IN SLICES, not all two-odd thousand cards at once.
   lazy loading is an optimisation this app's Safari floor feels free to ignore, and a
   grid that size would ask for every picture on the network before the owner had
   scrolled a screen. The sentinel loads the next slice as it nears the bottom of the
   grid, and it is also a real button, so a browser where the observer fails still
   gets more cards on a tap. */
function CardPicker({selected,onDone,onClose}){
  const [draft,setDraft]=useState(()=>new Map(selected.map(e=>[e.s,e])));
  const [q,setQ]=useState('');
  const [group,setGroup]=useState(null);
  const [note,setNote]=useState('');
  const [limit,setLimit]=useState(60);
  const gridRef=useRef(null);
  const sentinelRef=useRef(null);
  const query=q.trim().toLowerCase();
  const list=useMemo(()=>CARD_ENTRIES.filter(e=>
    (!group||(e.g||[]).includes(group))&&(!query||e.w.toLowerCase().includes(query))
  ),[group,query]);
  useEffect(()=>{setLimit(60);},[group,query]);
  useEffect(()=>{
    const n=sentinelRef.current;
    if(!n||!('IntersectionObserver' in window))return;
    const io=new IntersectionObserver(entries=>{
      entries.forEach(x=>{if(x.isIntersecting)setLimit(l=>l+60);});
    },{root:gridRef.current,rootMargin:'320px'});
    io.observe(n);
    return()=>io.disconnect();
  },[limit<list.length]);
  const toggle=(e)=>{
    if(draft.has(e.s)){
      Sound.tap();
      setDraft(m=>{const next=new Map(m);next.delete(e.s);return next;});
      setNote('');
    }else if(draft.size>=CARDS_CAP){
      Sound.wrong();
      setNote(`The tray holds ${CARDS_CAP} cards -- tap a chosen card to remove it first`);
    }else{
      Sound.ding();
      setDraft(m=>new Map(m).set(e.s,e));
      setNote('');
    }
  };
  return(
    <div className="picker-overlay" role="dialog" aria-modal="true" aria-label="Import cards from the dictionary">
      <div className="picker-panel">
        <div className="picker-head">
          <span className="picker-title">Import cards</span>
          <span className="mycards-count" aria-label={`${draft.size} of ${CARDS_CAP} cards chosen`}>{draft.size}/{CARDS_CAP}</span>
          <button className="round-btn picker-close" aria-label="Close the picker" onClick={()=>{Sound.tap();onClose();}}>←</button>
        </div>
        <input className="picker-search" type="search" placeholder="Search the dictionary" value={q}
          aria-label="Search the dictionary" onChange={ev=>setQ(ev.target.value)}/>
        <div className="chip-row" role="group" aria-label="Word groups">
          <button className={`chip ${group===null?'on':''}`} aria-pressed={group===null} onClick={()=>{Sound.tap();setGroup(null);}}>All words</button>
          {CARD_GROUPS.map(g=>(
            <button key={g.id} className={`chip ${group===g.id?'on':''}`} aria-pressed={group===g.id}
              onClick={()=>{Sound.tap();setGroup(g.id);}}>{g.label}</button>))}
        </div>
        <div className="picker-grid" ref={gridRef}>
          {list.slice(0,limit).map(e=>{const on=draft.has(e.s);return(
            <button key={e.s} className={`dict-card ${on?'on':''}`} aria-pressed={on} aria-label={`${e.w}${on?', added':''}`}
              onClick={()=>toggle(e)}>
              <img src={cardPic(e)} alt="" loading="lazy"/>
              <span>{e.w}</span>
              {on&&<span className="check-badge" aria-hidden="true"><CheckIcon/></span>}
            </button>);})}
          {limit<list.length&&(
            <button ref={sentinelRef} className="chip more-chip" onClick={()=>{Sound.tap();setLimit(l=>l+60);}}>Show more cards</button>)}
          {!list.length&&<div className="mycards-hint">No cards match. Try another word or group.</div>}
        </div>
        <div className="picker-foot">
          <span className="picker-count">{draft.size} of {CARDS_CAP} cards</span>
          {note&&<span className="picker-note" role="status">{note}</span>}
          <button className="big-btn picker-done" onClick={()=>{Sound.ding();onDone([...draft.values()]);}}>Done</button>
        </div>
      </div>
    </div>
  );
}

/* ══ THE SPELL GAME ══ */
/* A MY-CARDS SESSION IS FREE PLAY and must not touch the curriculum economy: stars,
   word completion, attempts and the active-pack pointer are all keyed by
   packId/wordId, and a bouquet the flower drawer paid out for imported cards would be
   a bouquet the Grade 1 shelf never earned. So `my` runs the same engine over the
   tray's words and writes nothing -- no stars, no word completion, no attempts, no
   flowers, no score row. */
function SpellGame({nav,grade,packIdx,shared,my,cards}){
  const screenRef=useRef(null);
  const words=my?cards.map(e=>e.w):UNIVERSE.grades[String(grade)][packIdx];
  /* The tray's own rendered clips, keyed by word: the Word Book recorded these and the
     narration bank did not, so the robot says an imported word in the voice the
     dictionary already plays it in. A homophone line outranks the clip -- "two" has to
     be asked with its context line, never as the bare sound two spellings share. */
  const myAudio=useMemo(()=>my?new Map(cards.map(e=>[e.w,cardAud(e)])):null,[my,cards]);
  const myCard=useMemo(()=>my?new Map(cards.map(e=>[e.w,e])):null,[my,cards]);
  const [sessionIndices]=useState(()=>my?words.map((_,i)=>i):sessionWordIndices(shared.store,UNIVERSE,grade,packIdx));
  const sessionWords=sessionIndices.map(i=>words[i]);
  const [st,setSt]=useState(()=>initSession(sessionWords,Math.random));
  const [fx,setFx]=useState({});
  const [banner,setBanner]=useState('');
  const [confetti,setConfetti]=useState(false);
  const [finalStars,setFinalStars]=useState(null);
  const reader=useReader();
  const mascot=useMascot();
  const stRef=useRef(st); stRef.current=st;
  const pid=my?null:packId(grade,packIdx);
  const earnedStars=starsFor((!my&&shared.store.attempts&&shared.store.attempts[pid])||st.pass1);
  const displayStars=finalStars==null?earnedStars:finalStars;
  const askWord=()=>{const line=lineFor(st.word,UNIVERSE.homophones);reader.say(line,(my&&line===st.word&&myAudio&&myAudio.get(st.word))||null);};
  useEffect(()=>{
    const place=()=>{
      const node=screenRef.current;
      if(!node)return;
      const box=node.getBoundingClientRect();
      const layout=deskArtLayout(box.width,box.height);
      const compact=layout.orientation==='landscape'&&box.height<=520;
      const paper=layout.paper;
      const values={
        '--paper-left':paper.left,'--paper-top':paper.top,
        '--paper-width':paper.width,'--paper-height':paper.height,
        '--read-top':paper.top+paper.height*.03,'--read-height':paper.height*(compact?.50:.48),
        '--praise-top':paper.top+paper.height*(compact?.44:.48),
        '--slot-left':paper.left+paper.width*.045,'--slot-top':paper.top+paper.height*(compact?.57:.60),
        '--slot-width':paper.width*.91,
        '--tray-left':layout.tray.left,'--tray-top':layout.tray.top,'--tray-width':layout.tray.width,
      };
      Object.keys(values).forEach(name=>node.style.setProperty(name,`${values[name]}px`));
    };
    place();
    window.addEventListener('resize',place);
    window.visualViewport&&window.visualViewport.addEventListener('resize',place);
    return()=>{
      window.removeEventListener('resize',place);
      window.visualViewport&&window.visualViewport.removeEventListener('resize',place);
    };
  },[]);
  useEffect(()=>{if(!my)shared.setStore(s=>markActive(packProgress(s,UNIVERSE,grade,packIdx).status==='Completed'?clearAttempt(s,pid):s,grade,packIdx));},[]);

  /* Speak each new word once it lands -- the robot, so his mouth moves. The delay keeps
     the previous word's praise from colliding with the new question. */
  useEffect(()=>{
    if(st.celebrating||st.complete)return;
    const id=setTimeout(()=>askWord(),350);
    return ()=>clearTimeout(id);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  },[st.word,st.passNo,st.qi]);

  /* The word is solved: the filled slots ARE the reveal, then praise, a flower, and the
     next word. Stars are recorded when the FIRST pass ends; practice passes only re-ask.
     None of the recording happens for a My-cards session -- free play pays no flowers. */
  useEffect(()=>{
    if(!st.celebrating)return;
    Sound.celebrate();
    const msg=praise();
    setBanner(msg);
    speakLine(msg,1);
    mascot.happy();
    setConfetti(true);
    if(!my){
      const canonicalIndex=words.indexOf(st.word),wid=wordId(grade,packIdx,canonicalIndex);
      const first=!(shared.store.words&&shared.store.words[wid]);
      shared.setStore(prev=>{
        const completed=completeWord(prev,grade,packIdx,canonicalIndex).state;
        return awardWordOnce(completed,wid).state;
      });
      if(first){shared.reward();shared.setScore(s=>s+1);}
    }
    const id=setTimeout(()=>{setConfetti(false);setBanner('');setSt(s=>nextWord(s,Math.random));},1900);
    return ()=>clearTimeout(id);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  },[st.celebrating,st.qi,st.word]);

  /* A practice pass just started: say so, in words and in voice. */
  useEffect(()=>{
    if(!st.relearnPulse)return;
    setBanner(PRACTICE_LINE);
    speakLine(PRACTICE_LINE,1);
    const id=setTimeout(()=>setBanner(''),2200);
    return ()=>clearTimeout(id);
  },[st.relearnPulse]);

  /* The pack is finished: stars land in the store, three stars pay a bonus bouquet,
     the fanfare and the star line play. A My-cards finish keeps the fanfare and the
     line and records nothing. */
  useEffect(()=>{
    if(!st.complete)return;
    Sound.fanfare();
    speakLine(my?MY_CARDS_LINE:(STAR_LINES[earnedStars]||STAR_LINES[1]),1);
    mascot.happy();
    if(!my){
      setFinalStars(earnedStars);
      shared.setStore(prev=>{
        const stars=starsFor((prev.attempts&&prev.attempts[pid])||st.pass1);
        let next=recordPack(prev,pid,stars);
        if(stars===3)next=awardBouquetOnce(next,pid);
        return clearAttempt(next,pid);
      });
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  },[st.complete]);

  const tap=(tileId)=>{
    const {s,fx:f}=applyTap(stRef.current,tileId);
    if(!f)return;
    if(f.kind==='right'){
      Sound.tap();
      setSt(s);
      setFx({[f.tile]:'right'});
    }else if(f.kind==='autofill'){
      Sound.ding();
      if(!my&&stRef.current.passNo===1)shared.setStore(x=>recordAttempt(x,pid,'autofill'));
      setSt(s);
      setFx({});
    }else{
      Sound.wrong();
      if(!my&&stRef.current.passNo===1)shared.setStore(x=>recordAttempt(x,pid,'wrong'));
      mascot.oops();
      setSt(s);
      setFx({[f.tile]:'wrong'});
      setTimeout(()=>setFx({}),400);
    }
  };

  if(st.complete){
    const next=my?null:nextUnfinishedAfter(shared.store,UNIVERSE,grade,packIdx);
    return(
      <div className="screen complete-screen">
        <Confetti active/>
        <div className="complete-panel"><div className="complete-overlay" role="dialog" aria-label={my?'My cards complete':'Pack complete'}>
          <BookMascot pose="cheering" feedback/>
          {my?null:(
            <div className="complete-stars">
              {[1,2,3].map(i=>(
                <span key={i} className={i<=displayStars?'':'off'} style={{animationDelay:`${i*0.18}s`}}>
                  {i<=displayStars?'★':'☆'}
                </span>))}
            </div>)}
          <div className="complete-title">{my?'My cards complete!':`Pack ${packIdx+1} complete!`}</div>
          <div className="complete-sub">{my?'Every card spelled!':GRADE_META[grade].label+' · '+(displayStars===3?'Perfect spelling!':displayStars===2?'Almost perfect!':'You did it!')}</div>
          <div className="complete-btn-row">
            {my?(
              <button className="big-btn" onClick={()=>{Sound.tap();nav({s:'game',my:true,r:Date.now()});}}>Play again</button>
            ):next&&<button className="big-btn" onClick={()=>{Sound.tap();nav({s:'game',...next});}}>Next Pack</button>}
            {my?null:<button className="big-btn alt" onClick={()=>{Sound.tap();nav({s:'game',g:grade,p:packIdx,r:Date.now()});}}>Replay</button>}
            {my&&<button className="big-btn alt" onClick={()=>{Sound.tap();nav({s:'home'});shared.openPicker();}}>My cards</button>}
            {my?null:<button className="big-btn alt" onClick={()=>{Sound.tap();nav({s:'packs',g:grade});}}>Bookshelf</button>}
            <button className="big-btn alt" onClick={()=>{Sound.tap();nav({s:'home'});}}>Workshop</button>
          </div>
        </div></div>
        {my?null:<ScoreRow {...shared.scoreProps}/>}
      </div>
    );
  }

  const need=st.word[st.filled];
  const bookPose=reader.speaking?'listening':st.hint?'giving-hint':mascot.pose;
  return(
    <div className="screen desk-screen" ref={screenRef}>
      <TopBar onBack={()=>nav(my?{s:'home'}:{s:'packs',g:grade})} label={my?`My cards · ${words.length} ${words.length===1?'word':'words'}`:`${GRADE_META[grade].label} · ${GRADE_META[grade].sub} · Pack ${packIdx+1} · ${packProgress(shared.store,UNIVERSE,grade,packIdx).done}/${words.length}`} muted={shared.muted} onToggleMute={shared.toggleMute}/>
      <div className="desk-panel">
      <div className="read-row">
        <button className="speak-btn" aria-label="Say the word again" onClick={askWord}><BookMascot key={`${bookPose}-${mascot.stamp}`} pose={bookPose} feedback={bookPose!=='teaching'&&bookPose!=='listening'}/></button>
        <div className="prompt-bubble">
          {my&&myCard&&myCard.get(st.word)&&<img className="card-prompt-image" src={cardPic(myCard.get(st.word))} alt="Picture clue"/>}
          <span>Spell the word!</span>
        </div>
      </div>
      <div className={`slot-row ${st.word.length>=8?'long':''}`} aria-label="Word so far">
        {st.word.split('').map((c,i)=>(
          <div key={i} className={`slot ${i<st.filled?'filled':''}`}>{i<st.filled?st.word[i]:''}</div>))}
      </div>
      <div className="praise-banner">{banner}</div>
      <div className="tile-tray"><div className={`tile-row ${st.tiles.length>=12?'dense':''}`}>
        {st.tiles.map((t,i)=>(
          <button key={t.id} className={`tile t${i%4} ${st.used.includes(t.id)?'used':''} ${fx[t.id]||''} ${st.hint&&t.c===need&&!st.used.includes(t.id)?'hint':''}`}
            aria-label={`letter ${t.c}`}
            onClick={()=>tap(t.id)}>{t.c}</button>))}
      </div></div>
      </div>
      <Confetti active={confetti}/>
      {my?null:<ScoreRow {...shared.scoreProps}/>}
    </div>
  );
}

/* ══ APP ══ */
function App(){
  const [nav,setNav]=useState({s:'home'});
  const [score,setScore]=useState(0);
  const [flowers,setFlowers]=useState(0);
  const [gardenFull,setGardenFull]=useState(false);
  const [muted,setMuted]=useState(false);
  const [cards,setCards]=useState(loadMyCards);
  const [picker,setPicker]=useState(false);
  const [store,setStore]=useState(()=>{
    try{const raw=JSON.parse(localStorage.getItem(STORE_KEY));return migrateState(raw,UNIVERSE);}catch(e){}
    return defaultState();
  });
  /* Progress survives the app being closed: pack stars and bouquets are the long game,
     while score, flowers and the garden reset per session, as they always did. The
     my-cards tray persists too, as {w,s} pairs the loader re-resolves against the
     page's own dictionary snapshot. */
  useEffect(()=>{try{localStorage.setItem(STORE_KEY,JSON.stringify(store));}catch(e){}},[store]);
  useEffect(()=>{try{localStorage.setItem(CARDS_KEY,JSON.stringify(cards.map(e=>({w:e.w,s:e.s}))));}catch(e){}},[cards]);

  const addBouquet=useCallback(()=>setStore(s=>({...s,bouquets:(s.bouquets||0)+1})),[]);
  const reward=useFlowerReward(setFlowers,setGardenFull,addBouquet);
  const toggleMute=()=>{
    setMuted(m=>{const nm=!m;Sound.setMuted(nm);Voice.setMuted(nm);try{_lineAudio&&_lineAudio.pause();}catch(e){}if(!nm)Sound.tap();return nm;});
  };

  const shared={
    reward,setScore,setStore,store,muted,toggleMute,
    openPicker:()=>setPicker(true),
    scoreProps:{score,flowers,bouquets:store.bouquets||0,gardenFull},
  };

  return(
    <React.Fragment>
      <div className="app-bg"/>
      {nav.s==='home'&&<Home go={setNav} store={store} muted={muted} onToggleMute={toggleMute} cards={cards} onOpenPicker={()=>setPicker(true)}/>}
      {nav.s==='packs'&&<Packs nav={setNav} grade={nav.g} store={store} muted={muted} onToggleMute={toggleMute}/>}
      {nav.s==='game'&&<SpellGame key={(nav.my?'cards':nav.g+'-'+nav.p)+'-'+(nav.r||0)} nav={setNav} grade={nav.g} packIdx={nav.p} shared={shared} my={nav.my} cards={cards}/>}
      {picker&&<CardPicker selected={cards} onClose={()=>setPicker(false)} onDone={(list)=>{setCards(list);warmCardFetch(list);setPicker(false);}}/>}
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>
  /* Offline support. Registration is best-effort: opened straight from a file
     the browser refuses it, and the games must still run. */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      Promise.resolve() /* Test Hub staging: no service worker */.catch(function () {});
    });
  }
</script>
  </body>
</html>
