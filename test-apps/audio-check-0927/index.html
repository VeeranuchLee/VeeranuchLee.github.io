<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Narration ear check</title>
  <style>
    :root { color-scheme: light; font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif; background: #f4f1ff; color: #28233d; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; }
    button, textarea { font: inherit; }
    .top { position: sticky; top: 0; z-index: 5; padding: max(12px, env(safe-area-inset-top)) 16px 12px; background: rgba(45, 38, 77, .97); color: white; box-shadow: 0 3px 12px #281f4b44; }
    .top-inner { max-width: 760px; margin: auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    h1 { margin: 0; font-size: 24px; flex: 1 1 230px; }
    #counts { font-size: 16px; font-weight: 700; }
    #copy { min-height: 48px; border: 0; border-radius: 14px; padding: 0 18px; background: #ffd65a; color: #342b08; font-weight: 800; }
    main { max-width: 760px; margin: auto; padding: 16px 14px 42px; }
    h2 { margin: 24px 2px 10px; font-size: 25px; }
    .row { display: grid; grid-template-columns: 72px minmax(130px, 1fr) minmax(315px, 1.55fr); gap: 12px; align-items: center; margin: 10px 0; padding: 13px; background: white; border: 2px solid #ded8f4; border-radius: 18px; box-shadow: 0 2px 6px #33275d13; }
    .play { width: 64px; height: 64px; border: 0; border-radius: 50%; background: #5d47d6; color: white; font-size: 29px; line-height: 1; box-shadow: 0 4px 0 #3f2cae; }
    .play.playing { background: #e14979; box-shadow: 0 4px 0 #ad2852; }
    .word { font-size: 30px; font-weight: 850; line-height: 1.05; overflow-wrap: anywhere; }
    .app { margin-top: 5px; color: #756d8d; font-size: 14px; }
    .choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .choice { min-height: 54px; border: 2px solid #c8c0df; border-radius: 13px; background: #faf9ff; color: #37304d; font-weight: 800; font-size: 18px; }
    .choice[aria-pressed="true"][data-verdict="Good"] { background: #c9f3d6; border-color: #258b4a; color: #14532d; }
    .choice[aria-pressed="true"][data-verdict="Wrong"] { background: #ffd0d5; border-color: #c43f50; color: #781f2a; }
    .choice[aria-pressed="true"][data-verdict="Unsure"] { background: #fff0b5; border-color: #b98709; color: #6f5100; }
    #results { width: 100%; min-height: 150px; margin-top: 18px; padding: 12px; border: 2px solid #bbb1d7; border-radius: 14px; background: white; font-family: ui-monospace, monospace; font-size: 16px; }
    .hint { margin: 8px 2px 0; color: #665e78; }
    button:focus-visible, textarea:focus-visible { outline: 4px solid #40a9ff; outline-offset: 2px; }
    @media (max-width: 680px) {
      .row { grid-template-columns: 64px 1fr; }
      .choices { grid-column: 1 / -1; }
      .word { font-size: 27px; }
    }
  </style>
</head>
<body>
  <header class="top"><div class="top-inner">
    <h1>Narration ear check</h1>
    <div id="counts" aria-live="polite"></div>
    <button id="copy" type="button">Copy results</button>
  </div></header>
  <main>
    <div id="list"></div>
    <p class="hint">If clipboard access is blocked, select and copy the list below.</p>
    <textarea id="results" readonly aria-label="Plain-text results"></textarea>
  </main>
  <script>
  (() => {
    'use strict';
    const clips = [
      {"app":"writing-book","clip":"are.m4a","intended":"Are."},
      {"app":"writing-book","clip":"at.m4a","intended":"At."},
      {"app":"writing-book","clip":"ball.m4a","intended":"Ball."},
      {"app":"writing-book","clip":"big.m4a","intended":"Big."},
      {"app":"writing-book","clip":"box.m4a","intended":"Box."},
      {"app":"writing-book","clip":"f.m4a","intended":"F."},
      {"app":"writing-book","clip":"h.m4a","intended":"Aitch."},
      {"app":"writing-book","clip":"hop.m4a","intended":"Hop."},
      {"app":"writing-book","clip":"q.m4a","intended":"Q."},
      {"app":"writing-book","clip":"sun.m4a","intended":"Sun."},
      {"app":"writing-book","clip":"z.m4a","intended":"Z."},
      {"app":"math-app","clip":"sh-l-one-eighth.m4a","intended":"one eighth."},
      {"app":"math-app","clip":"sh-l-one-hundred.m4a","intended":"One hundred."},
      {"app":"math-app","clip":"sp-w-a.m4a","intended":"a"},
      {"app":"math-app","clip":"sp-w-ago.m4a","intended":"ago"},
      {"app":"math-app","clip":"sp-w-ate.m4a","intended":"ate"},
      {"app":"math-app","clip":"sp-w-ball.m4a","intended":"ball"},
      {"app":"math-app","clip":"sp-w-base.m4a","intended":"base"},
      {"app":"math-app","clip":"sp-w-bat.m4a","intended":"bat"},
      {"app":"math-app","clip":"sp-w-bed.m4a","intended":"bed"},
      {"app":"math-app","clip":"sp-w-born.m4a","intended":"born"},
      {"app":"math-app","clip":"sp-w-call.m4a","intended":"call"},
      {"app":"math-app","clip":"sp-w-come.m4a","intended":"come"},
      {"app":"math-app","clip":"sp-w-face.m4a","intended":"face"},
      {"app":"math-app","clip":"sp-w-fall.m4a","intended":"fall"},
      {"app":"math-app","clip":"sp-w-farm.m4a","intended":"farm"},
      {"app":"math-app","clip":"sp-w-gas.m4a","intended":"gas"},
      {"app":"math-app","clip":"sp-w-girl.m4a","intended":"girl"},
      {"app":"math-app","clip":"sp-w-hat.m4a","intended":"hat"},
      {"app":"math-app","clip":"sp-w-hello.m4a","intended":"hello"},
      {"app":"math-app","clip":"sp-w-hen.m4a","intended":"hen"},
      {"app":"math-app","clip":"sp-w-ice.m4a","intended":"ice"},
      {"app":"math-app","clip":"sp-w-inch.m4a","intended":"inch"},
      {"app":"math-app","clip":"sp-w-keep.m4a","intended":"keep"},
      {"app":"math-app","clip":"sp-w-mrs.m4a","intended":"Mrs."},
      {"app":"math-app","clip":"sp-w-or.m4a","intended":"or"},
      {"app":"math-app","clip":"sp-w-our.m4a","intended":"our"},
      {"app":"math-app","clip":"sp-w-part.m4a","intended":"part"},
      {"app":"math-app","clip":"sp-w-person.m4a","intended":"person"},
      {"app":"math-app","clip":"sp-w-pet.m4a","intended":"pet"},
      {"app":"math-app","clip":"sp-w-poor.m4a","intended":"poor"},
      {"app":"math-app","clip":"sp-w-rat.m4a","intended":"rat"},
      {"app":"math-app","clip":"sp-w-sang.m4a","intended":"sang"},
      {"app":"math-app","clip":"sp-w-six.m4a","intended":"six"},
      {"app":"math-app","clip":"sp-w-tall.m4a","intended":"tall"},
      {"app":"math-app","clip":"sp-w-thank.m4a","intended":"thank"},
      {"app":"math-app","clip":"sp-w-turn.m4a","intended":"turn"},
      {"app":"math-app","clip":"sp-w-us.m4a","intended":"us"},
      {"app":"math-app","clip":"tt-praise-4.m4a","intended":"Stellar!"}
    ];
    const key = 'audio-check-0927-verdicts-v1';
    const verdicts = {};
    try { Object.assign(verdicts, JSON.parse(localStorage.getItem(key) || '{}')); } catch (_) {}
    const list = document.querySelector('#list');
    const counts = document.querySelector('#counts');
    const output = document.querySelector('#results');
    let currentAudio = null;
    let currentButton = null;

    function save() { try { localStorage.setItem(key, JSON.stringify(verdicts)); } catch (_) {} }
    function update() {
      const totals = { Good: 0, Wrong: 0, Unsure: 0 };
      clips.forEach(item => { if (totals[verdicts[item.app + '/' + item.clip]] !== undefined) totals[verdicts[item.app + '/' + item.clip]]++; });
      const done = totals.Good + totals.Wrong + totals.Unsure;
      counts.textContent = `${done}/${clips.length} · Good ${totals.Good} · Wrong ${totals.Wrong} · Unsure ${totals.Unsure}`;
      output.value = clips.map(item => `${item.app}/${item.clip}: ${verdicts[item.app + '/' + item.clip] || 'none'}`).join('\n');
      document.querySelectorAll('.choice').forEach(button => {
        button.setAttribute('aria-pressed', String(verdicts[button.dataset.id] === button.dataset.verdict));
      });
    }
    function stopAudio() {
      if (currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; }
      if (currentButton) { currentButton.classList.remove('playing'); currentButton.textContent = '▶'; }
      currentAudio = null; currentButton = null;
    }
    function addGroup(app) {
      const heading = document.createElement('h2');
      heading.textContent = app;
      list.appendChild(heading);
      clips.filter(item => item.app === app).forEach(item => {
        const id = `${item.app}/${item.clip}`;
        const row = document.createElement('section');
        row.className = 'row';
        const play = document.createElement('button');
        play.className = 'play'; play.type = 'button'; play.textContent = '▶';
        play.setAttribute('aria-label', `Play ${item.intended}`);
        play.addEventListener('click', () => {
          if (currentButton === play) { stopAudio(); return; }
          stopAudio();
          const audio = new Audio(`clips/${item.app}/${item.clip}`);
          currentAudio = audio; currentButton = play; play.classList.add('playing'); play.textContent = '■';
          audio.addEventListener('ended', stopAudio, { once: true });
          audio.addEventListener('error', stopAudio, { once: true });
          audio.play().catch(stopAudio);
        });
        const label = document.createElement('div');
        label.innerHTML = `<div class="word"></div><div class="app"></div>`;
        label.querySelector('.word').textContent = item.intended;
        label.querySelector('.app').textContent = item.app;
        const choices = document.createElement('div'); choices.className = 'choices';
        ['Good', 'Wrong', 'Unsure'].forEach(verdict => {
          const button = document.createElement('button');
          button.type = 'button'; button.className = 'choice'; button.textContent = verdict;
          button.dataset.id = id; button.dataset.verdict = verdict;
          button.addEventListener('click', () => {
            verdicts[id] = verdicts[id] === verdict ? undefined : verdict;
            if (!verdicts[id]) delete verdicts[id];
            save(); update();
          });
          choices.appendChild(button);
        });
        row.append(play, label, choices); list.appendChild(row);
      });
    }
    ['writing-book', 'math-app'].forEach(addGroup);
    document.querySelector('#copy').addEventListener('click', async event => {
      output.focus(); output.select();
      try {
        await navigator.clipboard.writeText(output.value);
        event.currentTarget.textContent = 'Copied!';
        setTimeout(() => { event.currentTarget.textContent = 'Copy results'; }, 1400);
      } catch (_) {}
    });
    update();
  })();
  </script>
</body>
</html>
