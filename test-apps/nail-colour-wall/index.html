<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffd9e8">
  <title>Nail Salon</title>
  <link rel="stylesheet" href="./styles.css?v=91bfdc549-20261020155638">
</head>
<body>
  <main class="app" aria-label="Nail Salon">
    <header class="topbar">
      <div class="logo" aria-label="Nail Salon"><img src="./assets/icons/polish-bottle.webp?v=91bfdc549-20261020155638" alt=""><b>Nail</b><em>Salon</em></div>
      <div class="actions" aria-label="Nail actions">
        <button id="musicToggle" class="action gold" type="button" aria-label="Salon music off"><span aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 17.5V5.2l10-2v11.6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><ellipse cx="6.4" cy="17.6" rx="3.4" ry="2.7" fill="currentColor"/><ellipse cx="16.4" cy="15" rx="3.4" ry="2.7" fill="currentColor"/></svg></span><small>Off</small></button>
        <button id="saveDesign" class="action mint" type="button" aria-label="Save this design to My nails"><span aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 20.2C5.5 16.3 2.5 13.1 2.5 9.2 2.5 6.4 4.6 4.3 7.2 4.3c1.6 0 3 .8 3.8 2.1.8-1.3 2.2-2.1 3.8-2.1 2.6 0 4.7 2.1 4.7 4.9" fill="currentColor"/><circle cx="17.5" cy="16.5" r="5.2" fill="currentColor"/><path d="M17.5 13.6v5.8M14.6 16.5h5.8" stroke="#2ea58e" stroke-width="2" stroke-linecap="round"/></svg></span><small>Save</small></button>
        <button id="applyAll" class="action pink" aria-label="Apply this nail design to all nails"><span aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 2.5l1.9 5.6 5.6 1.9-5.6 1.9L10 17.5l-1.9-5.6L2.5 10l5.6-1.9z" fill="currentColor"/><path d="M18.5 13.5l.9 2.6 2.6.9-2.6.9-.9 2.6-.9-2.6-2.6-.9 2.6-.9z" fill="currentColor"/></svg></span><small>All</small></button>
        <button id="undo" class="action purple" aria-label="Undo"><span aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5L4 10l5 5" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.5 10H14a5.5 5.5 0 010 11h-3" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/></svg></span></button>
        <button id="reset" class="action blue" aria-label="Reset selected nail"><span aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 12a7.5 7.5 0 11-2.2-5.3" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/><path d="M18.2 2.8v4.6h-4.6" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button>
        <button id="clearAll" class="action clear" type="button" aria-label="Clear all designs"><span aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 2.5l-7 8.2" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M10.2 9.4l4.4 3.7-1.6 2.2c-1.6 2.3-4.2 4.8-8.8 6.2 1-2.2 1.2-4 1.4-5.6.3-2.6 1.9-4.6 4.6-6.5z" fill="currentColor"/><path d="M6.6 16.4l2.4 2M8.7 13.9l2.6 2.2" stroke="#e8579a" stroke-width="1.2" stroke-linecap="round"/></svg></span><small>Clear all</small></button>
      </div>
    </header>

    <section class="salon-stage" aria-label="Choose a nail on the hand">
      <div class="sparkles" aria-hidden="true">✦　·　✧</div>
      <svg id="handSvg" viewBox="0 -28 620 690" role="img" aria-label="A hand with five nails to decorate">
        <defs>
          <linearGradient id="skin" x1="0" x2="1"><stop stop-color="#eaa77e"/><stop offset=".48" stop-color="#f5bf97"/><stop offset="1" stop-color="#e8a176"/></linearGradient>
          <filter id="softShadow"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#a44b73" flood-opacity=".23"/></filter>
          <pattern id="glitter" width="18" height="18" patternUnits="userSpaceOnUse"><rect width="18" height="18" fill="#ef8fc4"/><circle cx="4" cy="4" r="2" fill="#fff"/><circle cx="13" cy="10" r="2.6" fill="#ffd75f"/><circle cx="6" cy="15" r="1.5" fill="#9ef4ec"/></pattern>
          <linearGradient id="shimmer" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#86dfe5"/><stop offset=".5" stop-color="#fff1fa"/><stop offset="1" stop-color="#d993ec"/></linearGradient>
          <pattern id="glitterTopcoat" width="13" height="13" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r=".75" fill="#fff" opacity=".95"/><circle cx="8" cy="3" r="1.15" fill="#fff5c7" opacity=".85"/>
            <circle cx="5" cy="8" r=".55" fill="#fff" opacity=".65"/><circle cx="11" cy="10" r=".9" fill="#dffcff" opacity=".9"/>
            <circle cx="1" cy="11" r=".45" fill="#fff" opacity=".55"/><circle cx="11" cy="6" r=".4" fill="#fff" opacity=".6"/>
          </pattern>
          <radialGradient id="glintGlow"><stop stop-color="#fff" stop-opacity=".95"/><stop offset=".2" stop-color="#fff" stop-opacity=".65"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
          <linearGradient id="shineBand" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".35" stop-color="#fff" stop-opacity=".14"/><stop offset=".5" stop-color="#fff" stop-opacity=".72"/><stop offset=".65" stop-color="#fff" stop-opacity=".14"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
          <linearGradient id="holoTopcoat" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff7fc2" stop-opacity=".18"/><stop offset=".18" stop-color="#fff0a6" stop-opacity=".3"/><stop offset=".38" stop-color="#8bffe2" stop-opacity=".28"/><stop offset=".58" stop-color="#8ed8ff" stop-opacity=".32"/><stop offset=".78" stop-color="#c5a0ff" stop-opacity=".3"/><stop offset="1" stop-color="#ff9bd5" stop-opacity=".18"/></linearGradient>
          <linearGradient id="chrome" x1="0" x2="1"><stop stop-color="#796b98"/><stop offset=".22" stop-color="#fff"/><stop offset=".45" stop-color="#9ca7c5"/><stop offset=".72" stop-color="#fff"/><stop offset="1" stop-color="#776b91"/></linearGradient>
          <linearGradient id="polishGradient" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#ff4f9e"/><stop offset="1" stop-color="#8d72ff"/></linearGradient>
        </defs>
        <defs>
          <mask id="handSkinMask" maskUnits="userSpaceOnUse" x="100" y="0" width="420" height="621">
            <image href="./assets/art/hand.webp" x="100" y="0" width="420" height="621" preserveAspectRatio="none"/>
          </mask>
        </defs>
        <g id="accessoryBackLayer" class="accessory-layer" aria-hidden="true"></g>
        <image class="painted-hand" href="./assets/art/hand.webp" x="100" y="0" width="420" height="621" preserveAspectRatio="none"/>
        <g id="nails"></g>
        <g id="accessoryLayer" class="accessory-layer" aria-hidden="true"></g>
      </svg>
      <div id="tapBurst" class="tap-burst" aria-hidden="true">✦</div>
    </section>

    <section class="studio" aria-label="Nail design choices">
      <nav id="tabs" class="tabs" aria-label="Design categories"></nav>
      <div id="trayWrap" class="tray-wrap">
        <div id="tray" class="tray" aria-live="polite"></div>
        <button class="tray-more tray-more-left" data-dir="left" type="button" aria-label="Show earlier choices"><span aria-hidden="true">‹</span></button>
        <button class="tray-more tray-more-right" data-dir="right" type="button" aria-label="Show more choices"><span aria-hidden="true">›</span></button>
      </div>
    </section>
  </main>
  <audio id="clearVoice" src="./assets/audio/clear-confirmation.m4a" preload="auto" hidden></audio>
  <script src="./tap-zoom-guard.js?v=91bfdc549-20261020155638"></script>
  <script src="./state-core.js?v=91bfdc549-20261020155638"></script>
  <script src="./colour-wall.js?v=91bfdc549-20261020155638"></script>
  <script src="./app.js?v=91bfdc549-20261020155638"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
      addEventListener('load', () => Promise.resolve() /* Test Hub staging: no service worker */);
    }
  </script>
</body>
</html>
