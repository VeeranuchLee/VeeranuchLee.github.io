<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Listening: 12 re-recorded words</title>
  <style>
    * { box-sizing: border-box; }
    html, body { touch-action: manipulation; }
    body {
      margin: 0;
      min-height: 100svh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #25343b;
      background: radial-gradient(circle at 80% 0%, #fff4d6 0 10%, transparent 30%),
                  linear-gradient(145deg, #e8f6f2, #ede9ff 55%, #fff0e1);
      padding: clamp(16px, 3vw, 40px);
    }
    main { width: min(1000px, 100%); margin: 0 auto; }
    header { margin-bottom: 22px; }
    h1 { margin: 0 0 8px; font-size: clamp(1.8rem, 5vw, 2.8rem); color: #243d52; line-height: 1.05; }
    header p { margin: 0; color: #506269; font-size: 1.05rem; line-height: 1.45; }
    .words { display: grid; grid-template-columns: 1fr; gap: 18px; }
    @media (min-width: 760px) and (orientation: landscape) {
      .words { grid-template-columns: 1fr 1fr; }
    }
    .word {
      background: rgba(255,255,255,0.78);
      border: 3px solid rgba(255,255,255,0.9);
      border-radius: 22px;
      padding: 18px;
      box-shadow: 0 10px 28px rgba(69,86,108,0.1);
      display: grid;
      gap: 14px;
      align-content: start;
    }
    .word-name {
      font-size: clamp(2.4rem, 7vw, 4rem);
      font-weight: 900;
      color: #243d52;
      text-align: center;
      line-height: 1;
      margin: 0;
    }
    .play-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    button {
      appearance: none;
      border: 0;
      border-radius: 16px;
      font-size: 1.2rem;
      font-weight: 800;
      min-height: 64px;
      cursor: pointer;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform .08s, filter .08s;
    }
    button:active { transform: scale(0.97); }
    .old { background: linear-gradient(145deg, #7b9aa8, #5e7d8b); }
    .new { background: linear-gradient(145deg, #6dbf7e, #4aa05d); }
    .verdict-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .verdict {
      background: #f1f5f7;
      color: #506269;
      border: 3px solid transparent;
    }
    .verdict.selected.good { background: #d6f5dc; color: #276334; border-color: #9be0a8; }
    .verdict.selected.wrong { background: #ffe0e0; color: #7a2b2b; border-color: #f0a8a8; }
    summary { margin-top: 26px; }
    summary h2 { margin: 0 0 12px; font-size: 1.3rem; color: #243d52; }
    textarea {
      width: 100%;
      min-height: 170px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 1.05rem;
      padding: 16px;
      border: 3px solid rgba(255,255,255,0.9);
      border-radius: 18px;
      background: rgba(255,255,255,0.85);
      resize: vertical;
    }
    .hint { color: #63747a; font-size: 0.92rem; margin-top: 10px; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Listening: 12 re-recorded words</h1>
      <p>Tap <strong>Old</strong> then <strong>New</strong> to hear the difference. Tap <strong>Good</strong> or <strong>Wrong</strong> for each word. Your choices are saved on this device and copied into the summary below.</p>
    </header>
    <div class="words" id="words"></div>
    <summary>
      <h2>Summary</h2>
      <textarea id="summary" readonly></textarea>
      <p class="hint">Copy the summary and paste it into your message.</p>
    </summary>
  </main>
  <script>
    const WORDS = ['sun','ago','ate','base','come','face','hello','hen','our','pet','rat','thank'];
    const STORAGE_KEY = 'audio-check-0928-verdicts';
    const audioCache = {};
    const verdicts = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');

    function play(word, which) {
      const key = word + '/' + which;
      let a = audioCache[key];
      if (!a) {
        a = new Audio(which + '/' + word + '.m4a');
        audioCache[key] = a;
      }
      a.currentTime = 0;
      a.play().catch(function(){});
    }

    function setVerdict(word, value) {
      verdicts[word] = value;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(verdicts));
      updateUI(word);
      updateSummary();
    }

    function updateUI(word) {
      const good = document.getElementById('good-' + word);
      const wrong = document.getElementById('wrong-' + word);
      const v = verdicts[word];
      good.classList.toggle('selected', v === 'Good');
      wrong.classList.toggle('selected', v === 'Wrong');
    }

    function updateSummary() {
      const lines = WORDS.map(function(w) {
        return w + ': ' + (verdicts[w] || '—');
      });
      document.getElementById('summary').value = lines.join('\n');
    }

    function render() {
      const container = document.getElementById('words');
      WORDS.forEach(function(word) {
        const el = document.createElement('div');
        el.className = 'word';
        el.innerHTML =
          '<h2 class="word-name">' + word + '</h2>' +
          '<div class="play-row">' +
            '<button class="old" type="button" aria-label="Play old ' + word + '">Old</button>' +
            '<button class="new" type="button" aria-label="Play new ' + word + '">New</button>' +
          '</div>' +
          '<div class="verdict-row">' +
            '<button class="verdict good" id="good-' + word + '" type="button">Good</button>' +
            '<button class="verdict wrong" id="wrong-' + word + '" type="button">Wrong</button>' +
          '</div>';
        el.querySelector('.old').addEventListener('click', function() { play(word, 'old'); });
        el.querySelector('.new').addEventListener('click', function() { play(word, 'new'); });
        el.querySelector('.good').addEventListener('click', function() { setVerdict(word, 'Good'); });
        el.querySelector('.wrong').addEventListener('click', function() { setVerdict(word, 'Wrong'); });
        container.appendChild(el);
        updateUI(word);
      });
      updateSummary();
    }

    render();
  </script>
</body>
</html>
