<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Our Dictionary</title>
  <link rel="manifest" href="./manifest.webmanifest"/>
  <link rel="stylesheet" href="./fonts.css"/>
  <meta name="theme-color" content="#3a1e33"/>
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Our Dictionary"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'Nunito',sans-serif;min-height:100vh;color:#3a1e33;
      background:#fdf6ff;
      -webkit-text-size-adjust:100%;
    }

    /* ── The header, stuck as ONE piece ──
       The bar and the A-Z strip used to be sticky separately, both at top:0. The bar won
       on z-index, so the moment the page scrolled it painted straight over the strip and
       a child lost the only fast way to move through the dictionary.

       They stick together now, from this one wrapper, because the bar's height is not a
       number anyone can write down: it wraps at narrow widths (79px at 768px, 183px at
       400px) and its top padding carries env(safe-area-inset-top), which differs by
       device. Any `.az{top:<px>}` would be right on one screen and wrong on the next.
       Gluing them means nothing has to be measured at all. */
    .topbar{position:sticky;top:0;z-index:20}

    /* Back to OUR WORD BOOK, not to Children Games. That is the navigation the owner
       asked for -- Children Hub -> Our Word Book -> activity -> back to Our Word Book --
       and it is the one thing a promotion like this gets wrong: moving a card without
       moving the arrow leaves a child two taps from a page nobody meant them to see.
       Relative, because this page and the front door are the same app. */
    .bar{
      display:flex;align-items:center;gap:12px;flex-wrap:wrap;
      padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
      background:rgba(253,246,255,.94);backdrop-filter:blur(8px);
      border-bottom:3px solid #f0dcea;
    }
    .back{
      display:inline-flex;align-items:center;gap:8px;
      min-height:56px;padding:0 18px 0 14px;border-radius:50px;
      background:linear-gradient(135deg,#fff,#ffe9f1);
      border:2.5px solid #e59bbb;box-shadow:0 4px 0 #e59bbb;
      color:#a8386a;text-decoration:none;
      font-weight:900;font-size:1rem;line-height:1;white-space:nowrap;
      -webkit-tap-highlight-color:transparent;transition:transform .1s;
    }
    .back:active{transform:translateY(3px);box-shadow:0 1px 0 #e59bbb}
    .back:focus-visible{outline:4px solid #ffd54f;outline-offset:3px}
    .back svg{width:22px;height:22px;flex:none}

    h1{font-weight:900;font-size:1.35rem;color:#a8386a;margin-right:auto}

    .find{
      flex:1 1 220px;min-width:200px;
      display:flex;align-items:center;gap:8px;
      background:#fff;border:3px solid #f0dcea;border-radius:50px;
      padding:0 14px;min-height:56px;
    }
    .find:focus-within{border-color:#e59bbb}
    .find svg{width:22px;height:22px;flex:none;color:#c98aa8}
    .find input{
      flex:1;border:0;outline:0;background:transparent;
      font-family:inherit;font-weight:800;font-size:1.05rem;color:#3a1e33;min-width:0;
    }
    .find input::placeholder{color:#c9a8bb}
    .clear{
      border:0;background:#f6e6ef;color:#a8386a;border-radius:50%;
      width:34px;height:34px;flex:none;font:inherit;font-weight:900;font-size:1.1rem;
      cursor:pointer;line-height:1;
    }
    .clear[hidden]{display:none!important}

    /* ── A to Z ──
       The whole alphabet, always visible, because a child who can find "S" does not need
       to be taught a menu. 52px tall so it clears a finger on the 9.7" iPad this is built
       for, and it scrolls sideways rather than wrapping into a block that pushes the words
       off the screen. Not sticky itself -- .topbar above carries it. */
    .az{
      display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;
      padding:10px 14px;background:#fdf6ff;
      border-bottom:3px solid #f0dcea;
      scrollbar-width:none;
    }
    .az::-webkit-scrollbar{display:none}
    .az button{
      flex:none;min-width:52px;height:52px;border-radius:16px;
      border:2.5px solid #f0dcea;background:#fff;
      font-family:inherit;font-weight:900;font-size:1.1rem;text-transform:uppercase;
      color:#8a5c76;cursor:pointer;-webkit-tap-highlight-color:transparent;
    }
    .az button[aria-pressed="true"]{
      background:linear-gradient(160deg,#d4739a,#a8386a);color:#fff;border-color:#a8386a;
    }
    .az button:focus-visible{outline:4px solid #ffd54f;outline-offset:2px}

    main{padding:16px 14px 40px;max-width:1100px;margin:0 auto}

    /* Three cards across at 768px, which is the target device in portrait. */
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}

    .card{
      background:#fff;border:3px solid #f0dcea;border-radius:22px;
      overflow:hidden;display:flex;flex-direction:column;
    }
    .pic{
      aspect-ratio:4/3;background:#faf0f6;
      display:flex;align-items:center;justify-content:center;overflow:hidden;
    }
    .pic img{width:100%;height:100%;object-fit:cover;display:block}
    /* A concept whose picture has not been drawn yet. This state NEVER SHIPS -- the owner
       decided on 2026-09-09 that Our Dictionary does not publish until all 2,098 concepts
       are illustrated, and check-word-data.py prints the remaining count every run. It
       exists so the corpus can be reviewed now, and it says nothing to a child because no
       child will see it. */
    .pic.todo{background:repeating-linear-gradient(45deg,#faf0f6,#faf0f6 10px,#f4e4ee 10px,#f4e4ee 20px)}
    .pic.todo span{font-weight:900;font-size:.72rem;color:#c9a8bb;letter-spacing:.04em}

    .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px}
    .word{font-family:'Fredoka One',Nunito,sans-serif;font-size:1.5rem;line-height:1.1;color:#3a1e33}
    /* Thai sits DIRECTLY under the English, which is where a reader who can already read
       Thai looks for it -- animal-book/DECISIONS.md 3, applied here. Its own font stack
       because the self-hosted Nunito is latin and latin-ext only and has no Thai glyphs;
       Thonburi is the one the iPad supplies. Printed, never spoken: there is no Thai audio
       anywhere in this project and none is planned (AUDIO-DIRECTION.md 4). */
    .thai{
      font-family:"Noto Sans Thai","Thonburi",ui-rounded,system-ui,sans-serif;
      font-size:1.05rem;font-weight:700;color:#a8386a;line-height:1.35;
    }
    /* An example, not a definition. The owner's brief: "example sentences instead of
       formal definitions". */
    .eg{font-size:.9rem;font-weight:700;color:#6b5260;line-height:1.4;margin-top:2px}

    /* ── Hear it ──
       Every card that has a clip carries one round speaker beside its word. 52px, the
       same size as the A-Z buttons, so it clears the 44pt iPad floor with room. Beside
       the WORD, not under the sentence: the clip says the headword, and a child who
       cannot read the sentence yet can still find the thing that speaks. Tapping while
       it speaks starts the word again from the top -- repeating a word is what a child
       practising it wants.
       Two states a child can see: `.speaking` (filled, while the word plays) and
       `.missed` (the clip did not load -- offline and never heard before, or a file
       gone). A missed tap shakes the button and swaps the sound waves for a cross, and
       the button stays live so the next tap tries again. It never goes quiet, and it
       never dims into something that looks tappable and does nothing.
       A card listed in word-audio.js UNRENDERED has no speaker at all -- a speaker that
       can only fail is a dead tap. That table is empty since 2026-09-22 (the eight
       homograph senses were rendered), so every card speaks its word. */
    .head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
    .head .word{flex:1;min-width:0;overflow-wrap:anywhere;padding-top:12px}
    .speak{
      flex:none;width:52px;height:52px;border-radius:50%;cursor:pointer;
      display:inline-flex;align-items:center;justify-content:center;padding:0;
      border:2.5px solid #e59bbb;background:linear-gradient(135deg,#fff,#ffe9f1);
      color:#a8386a;box-shadow:0 4px 0 #e59bbb;
      -webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:transform .1s;
    }
    .speak:active{transform:translateY(3px);box-shadow:0 1px 0 #e59bbb}
    .speak:focus-visible{outline:4px solid #ffd54f;outline-offset:3px}
    .speak svg{width:26px;height:26px;flex:none;pointer-events:none}
    .speak .no{display:none}
    .speak.speaking{background:linear-gradient(160deg,#d4739a,#a8386a);color:#fff;border-color:#a8386a}
    .speak.missed{color:#9b7a8a;border-color:#d9c3cf;box-shadow:0 4px 0 #d9c3cf;animation:nope .45s}
    .speak.missed .waves{display:none}
    .speak.missed .no{display:inline}
    @keyframes nope{
      0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)}
      60%{transform:translateX(-4px)} 80%{transform:translateX(4px)}
    }
    @media (prefers-reduced-motion:reduce){.speak.missed{animation:none}}

    /* ── Hear the sentence ──
       The example sentence's own speaker (owner spec, 2026-09-22): a second, independent
       clip, audio/sentences/<sense>.m4a, resolved by sentence-audio.js. It must never be
       mistaken for the word speaker, so it differs in every way a child sees: it sits
       BESIDE THE SENTENCE (not the word), it is a rounded SQUARE in the soft card colours
       (not the round pink button), and its icon is a SPEECH BUBBLE with lines of talk
       (not a loudspeaker). 48px square, clear of the 44pt iPad floor.
       It shares the one voice and every state with the word speaker -- `.speaking`,
       `.missed`, shake, cross, retry -- because it IS a .speak button: tapping the
       sentence stops the word and tapping the word stops the sentence.
       A card whose sentence has no clip, or whose clip says an older wording, shows no
       sentence speaker at all (sentence-audio.js clipFor() is null): a speaker that
       could only fail is a dead tap. None is rendered yet, so none shows yet. */
    .egline{display:flex;align-items:flex-start;gap:8px;margin-top:2px}
    .egline .eg{flex:1;min-width:0;margin-top:0;padding-top:4px}
    .speak.eg-speak{
      width:48px;height:48px;border-radius:14px;
      border-color:#d9bfd0;background:#f7eef4;color:#8a5c76;box-shadow:0 3px 0 #d9bfd0;
    }
    .speak.eg-speak:active{box-shadow:0 1px 0 #d9bfd0}
    .speak.eg-speak svg{width:28px;height:28px}
    .speak.eg-speak.speaking{background:linear-gradient(160deg,#b98aa5,#8a5c76);color:#fff;border-color:#8a5c76}

    /* ── One word, several senses (a merged card; data `groups`) ──
       Each sense sits under the headword as its own block: a part-of-speech tag, then the
       same Thai line and sentence (with its own sentence speaker) a one-sense card has. A
       dashed rule between blocks, so two sentences never read as one paragraph. The tag is
       a quiet pill, not a button -- nothing about it is tappable, so nothing about it may
       look tappable. */
    .senses{list-style:none;display:flex;flex-direction:column;gap:10px;margin-top:2px}
    .sense{display:flex;flex-direction:column;gap:4px}
    .sense + .sense{padding-top:10px;border-top:2px dashed #f0dcea}
    .pos{
      align-self:flex-start;padding:2px 10px;border-radius:50px;
      background:#f7eef4;color:#8a5c76;border:2px solid #efdce8;
      font-weight:900;font-size:.78rem;letter-spacing:.03em;line-height:1.3;
    }

    .none{
      grid-column:1/-1;text-align:center;padding:50px 20px;
      font-weight:900;font-size:1.1rem;color:#a8386a;
    }
    .count{
      margin:0 0 12px;font-weight:800;font-size:.85rem;color:#8a5c76;
    }

    @media (max-width:560px){
      h1{font-size:1.1rem;width:100%;order:3;margin:0}
      .find{order:4;flex-basis:100%}
    }
  </style>
</head>
<body>

<div class="topbar">
<div class="bar">
  <a class="back" href="index.html" aria-label="Back to Our Word Book">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      <path d="M15 5 8 12l7 7"/>
    </svg>
    <span>Our Word Book</span>
  </a>
  <h1>Our Dictionary</h1>
  <label class="find">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true" focusable="false">
      <circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/>
    </svg>
    <input id="q" type="search" placeholder="Find a word" autocomplete="off"
           enterkeyhint="search" aria-label="Find a word"/>
    <button class="clear" id="clear" type="button" hidden aria-label="Clear">✕</button>
  </label>
</div>

<nav class="az" id="az" aria-label="Choose a letter"></nav>
</div>

<main>
  <p class="count" id="count"></p>
  <div class="grid" id="grid"></div>
</main>

<script src="word-audio.js"></script>
<script src="sentence-audio.js"></script>
<script>
(function () {
  'use strict';

  var ALL_LETTERS = 'abcdefghijklmnopqrstuvwxyz'.split('');
  var enabledLetters = null;
  var cards = [], letter = null, query = '';

  function lettersFor() { return enabledLetters || ALL_LETTERS; }
  function firstLetter(word) { return String(word).charAt(0).toLowerCase(); }

  function loadLetters() {
    return fetch('data/letters.json')
      .then(function (r) { return r.json(); })
      .then(function (cfg) {
        var list = (cfg && cfg.enabled) || [];
        enabledLetters = list.map(function (l) { return String(l).toLowerCase(); });
        if (!enabledLetters.length) enabledLetters = ALL_LETTERS;
      })
      .catch(function () {
        // Fallback: if letters.json is missing or unreadable, show every letter. This keeps a
        // fresh checkout or a build without the gate file usable, and it is the pre-gate behaviour.
        enabledLetters = ALL_LETTERS;
      });
  }

  function filterData(d) {
    var allowed = {};
    lettersFor().forEach(function (l) { allowed[l] = true; });
    d.rows = (d.rows || []).filter(function (r) { return allowed[firstLetter(r[0])]; });
    d.groups = (d.groups || []).filter(function (g) { return allowed[firstLetter(g.word)]; });
  }
  var grid = document.getElementById('grid');
  var count = document.getElementById('count');
  var az = document.getElementById('az');
  var q = document.getElementById('q');
  var clear = document.getElementById('clear');

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* ONE CARD PER CONCEPT, not per spelling. The corpus keeps 72 groups of words that
     share a spelling as separate cards -- `bat` the animal and `bat` you hit a ball
     with are two concepts with two Thai translations and two pictures. Two cards
     reading "bat" is correct here, and the Thai line underneath is what tells them
     apart, which is why it is never optional. The one exception is a word the owner
     merged (data `groups`, see buildCards below): its senses share one card and each
     keeps its own Thai line underneath. */
  /* The clip each card speaks comes from word-audio.js (window.WordAudio), THE one
     resolver -- tools/check-audio-coverage.mjs require()s the same file to prove every
     card resolves to exactly one clip on disk or a documented exception. Nothing on this
     page knows how a filename is made. If that file ever failed to load, cards simply
     carry no speaker; they never carry one that cannot work. */
  var WA = window.WordAudio || null;
  /* The sentence clip comes from sentence-audio.js (window.SentenceAudio) and the record
     of what each clip says, audio/sentences/rendered.json (`ledger`, loaded with the
     data). A clip plays only when that record says EXACTLY the sentence this card shows;
     otherwise -- not rendered, or rendered from an older wording -- the card has no
     sentence speaker. tools/check-sentence-audio.mjs require()s the same resolver. If the
     resolver or the ledger fails to load, cards carry no sentence speaker; never one
     that cannot work, and never an OS voice in its place. */
  var SA = window.SentenceAudio || null, ledger = null;
  var BUBBLE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" ' +
    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' +
    '<path d="M4 5.5h16a1.5 1.5 0 0 1 1.5 1.5v8.5a1.5 1.5 0 0 1-1.5 1.5H10l-4.5 3.5V17H4a1.5 1.5 0 0 1-1.5-1.5V7A1.5 1.5 0 0 1 4 5.5z"/>' +
    '<g class="waves"><path d="M7 9.5h10M7 13h6.5"/></g>' +
    '<g class="no"><path d="M9.5 8.5l5 5M14.5 8.5l-5 5"/></g></svg>';
  var SPEAKER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" ' +
    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' +
    '<path d="M11 5 6 9H3v6h3l5 4V5z" fill="currentColor"/>' +
    '<g class="waves"><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></g>' +
    '<g class="no"><path d="M16 9.5l5 5M21 9.5l-5 5"/></g></svg>';

  /* ONE WORD, SEVERAL SENSES, ONE CARD -- only where the owner said so (data `groups`,
     built from shared-data/dictionary/card-groups.json; `answer` on 2026-09-23: "merge
     the two answer cards. Keep both POS senses underneath.", then `brush`: "these too
     -> same as 'answer'", then `clean`, then the
     whole class (a) list in word-book/qa/2026-09-23-multi-card-words.md: "yes approved"). Every sense is still its
     own row with its own id, Thai, sentence and sentence clip; a group only draws those
     rows on one card, in the group's order, under the group's HERO picture, with each
     sense's part of speech. A word not in `groups` gets one card per sense, exactly as
     before. The one word speaker is safe because check-audio-coverage.mjs refuses a
     group whose senses would say different clips (bow/close/tear/wind never merge). */
  function buildCards(d) {
    var inGroup = {};
    (d.groups || []).forEach(function (g) {
      g.senses.forEach(function (s, i) { inGroup[s[0]] = { g: g, i: i }; });
    });
    var out = [], open = {};
    d.rows.forEach(function (r) {
      var m = inGroup[r[1]];
      if (!m) { out.push({ rows: [r], pos: null, pic: r[4] }); return; }
      var c = open[m.g.word];
      if (!c) { c = open[m.g.word] = { rows: [], pos: [], pic: null }; out.push(c); }
      c.rows[m.i] = r;
      c.pos[m.i] = m.g.senses[m.i][1];
      if (r[1] === m.g.hero) c.pic = r[4];
    });
    out.forEach(function (c) {
      if (!c.pos) return;
      /* A sense named by the group but absent from the rows leaves a hole: close it. */
      var rs = [], ps = [];
      c.rows.forEach(function (r, i) { if (r) { rs.push(r); ps.push(c.pos[i]); } });
      c.rows = rs; c.pos = ps;
      /* A hero not drawn yet (data `hero_pending`: its picture is on a branch still to
         merge) falls back to the group's first drawn sense, never to an empty well. */
      if (!c.pic) rs.some(function (r) { return (c.pic = r[4]); });
    });
    return out;
  }

  /* A TO Z, WHATEVER ORDER THE DATA ARRIVES IN (owner, 2026-09-23: "also, need to arrange
     it alphabetically."). data/dictionary.json keeps the order its layers were built in:
     the 2,000-word source A to Z, then new-cards.json APPENDED after `zookeeper` -- so
     letter C read cabbage ... cut, cylinder, cabin, cage, camp. The page sorts the cards
     once, here, so the letter grid and search results (both filter this one list) are A to
     Z, and a rebuild of the data can never undo it.
     The key is the headword lowercased, compared character by character: `Saturday` sits
     between `satellite` and `Saturn`, and a space or hyphen comes before any letter, so
     `ice` < `ice cream` < `iceberg` and `T-shirt` < `table` -- the source's own order,
     unchanged. A merged card sorts by its word. Cards that share a word (`bat` the animal,
     `bat` for a ball; `may` and `May`) keep the order their rows have in the data: the
     tie-break is each card's place in that list, so it holds on any browser's sort. */
  function alphabetical(list) {
    return list.map(function (c, i) { return { c: c, k: c.rows[0][0].toLowerCase(), i: i }; })
      .sort(function (a, b) { return a.k < b.k ? -1 : a.k > b.k ? 1 : a.i - b.i; })
      .map(function (x) { return x.c; });
  }

  /* What one sense says: its Thai, then its sentence with the sentence's own speaker. */
  function says(r) {
    var sense = r[1], thai = r[2], eg = r[3];
    var egClip = SA ? SA.clipFor(sense, eg, ledger) : null;
    return '<p class="thai" lang="th">' + esc(thai) + '</p>' +
      (egClip
        ? '<div class="egline"><p class="eg">' + esc(eg) + '</p>' +
          '<button type="button" class="speak eg-speak" data-clip="' + esc(egClip) +
          '" aria-label="Hear the sentence">' + BUBBLE + '</button></div>'
        : '<p class="eg">' + esc(eg) + '</p>');
  }

  function card(c) {
    var r = c.rows[0];
    var word = r[0], sense = r[1], eg = r[3], pic = c.pic;
    var clip = WA ? WA.clipFor(word, sense) : null;
    var art = pic
      ? '<div class="pic"><img src="' + esc(pic) + '" alt="" loading="lazy" decoding="async" draggable="false"></div>'
      : '<div class="pic todo"><span>picture to come</span></div>';
    var speak = clip
      ? '<button type="button" class="speak" data-clip="' + esc(clip) + '" aria-label="Hear ' +
        esc(word) + '">' + SPEAKER + '</button>'
      : '';
    var senses = c.pos
      ? '<ol class="senses">' + c.rows.map(function (s, i) {
          return '<li class="sense" data-sense="' + esc(s[1]) + '">' +
            '<p class="pos">' + esc(c.pos[i]) + '</p>' + says(s) + '</li>';
        }).join('') + '</ol>'
      : says(r);
    return '<article class="card' + (c.pos ? ' merged' : '') + '">' + art +
      '<div class="body">' +
      '<div class="head"><p class="word">' + esc(word) + '</p>' + speak + '</div>' +
      senses +
      '</div></article>';
  }

  /* A card matches when ANY of its senses does, so a merged card is found by either
     sense's Thai or sentence and is still shown whole. */
  function matches() {
    if (query) {
      var n = query.toLowerCase();
      var hit = function (r) {
        return r[0].toLowerCase().indexOf(n) > -1 ||
               r[2].indexOf(query) > -1 ||
               r[3].toLowerCase().indexOf(n) > -1;
      };
      return cards.filter(function (c) { return c.rows.some(hit); });
    }
    return cards.filter(function (c) { return c.rows[0][0].charAt(0).toLowerCase() === letter; });
  }

  function render() {
    hush();
    var found = matches();
    if (!found.length) {
      grid.innerHTML = '<p class="none">No words here yet. Try another letter.</p>';
      count.textContent = '';
      return;
    }
    /* Built as one string and assigned once. 283 cards is the biggest letter, and
       appending them one at a time re-lays out the page 283 times. */
    grid.innerHTML = found.map(card).join('');
    count.textContent = found.length === 1 ? '1 word' : found.length + ' words';
  }

  function buildAZ() {
    az.innerHTML = lettersFor().map(function (l) {
      return '<button type="button" data-l="' + l + '" aria-pressed="' +
             (l === letter) + '">' + l + '</button>';
    }).join('');
    az.addEventListener('click', function (e) {
      var b = e.target.closest('button[data-l]');
      if (!b) return;
      letter = b.dataset.l;
      query = '';
      q.value = '';
      clear.hidden = true;
      syncAZ();
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  }

  function syncAZ() {
    Array.prototype.forEach.call(az.querySelectorAll('button'), function (b) {
      b.setAttribute('aria-pressed', String(!query && b.dataset.l === letter));
    });
  }

  q.addEventListener('input', function () {
    query = q.value.trim();
    clear.hidden = !query;
    syncAZ();
    render();
  });
  clear.addEventListener('click', function () {
    query = ''; q.value = ''; clear.hidden = true; q.focus(); syncAZ(); render();
  });

  /* ONE shared voice for the whole page, created on the first tap and never before:
     nothing is fetched or played on load. A child taps word after word, and the
     previous word stops the moment the next one starts, because it is the same
     element being given a new src -- there is nothing to stack. Tapping the word that
     is already speaking rewinds it to the top.
     voiceBtn is the button the voice is serving now. Every late event (ended, error, a
     rejected play) is checked against it, so a slow failure from an earlier word can
     never mark the button a child has since moved on to. */
  var voice = null, voiceBtn = null;
  function missed(btn) {
    if (!btn || btn !== voiceBtn) return;
    btn.classList.remove('speaking');
    btn.classList.remove('missed');
    void btn.offsetWidth;            /* restart the shake on every failed tap */
    btn.classList.add('missed');
  }
  function hush() {
    if (voice) { try { voice.pause(); } catch (e) {} }
    if (voiceBtn) voiceBtn.classList.remove('speaking');
    voiceBtn = null;
  }
  function say(btn) {
    var clip = btn.getAttribute('data-clip');
    if (!voice) {
      voice = new Audio();
      voice.addEventListener('ended', function () {
        if (voiceBtn) voiceBtn.classList.remove('speaking');
      });
      voice.addEventListener('error', function () { missed(voiceBtn); });
    }
    if (voiceBtn && voiceBtn !== btn) voiceBtn.classList.remove('speaking');
    voiceBtn = btn;
    btn.classList.remove('missed');
    btn.classList.add('speaking');
    try {
      /* A new word, or a retry after a failure, loads the file; the same word again
         only rewinds, so a repeated tap never re-downloads anything. */
      if (voice.getAttribute('src') !== clip || voice.error) voice.src = clip;
      else voice.currentTime = 0;
      var p = voice.play();
      if (p && typeof p.then === 'function') {
        p.then(null, function (err) {
          /* AbortError means a newer tap replaced this one: not a failure. */
          if (err && err.name === 'AbortError') return;
          missed(btn);
        });
      }
    } catch (e) { missed(btn); }
  }
  grid.addEventListener('click', function (e) {
    var b = e.target.closest('button.speak');
    if (b) say(b);
  });

  count.textContent = 'Opening the book…';

  /* The sentence ledger is fetched beside the data and is allowed to fail: without it the
     book still opens, with word speakers only. */
  var ledgerLoad = SA
    ? fetch(SA.LEDGER).then(function (r) { return r.json(); }).then(null, function () { return null; })
    : Promise.resolve(null);

  loadLetters().then(function () {
    if (letter === null) letter = lettersFor()[0];
    return Promise.all([
      fetch('data/dictionary.json').then(function (r) { return r.json(); }),
      ledgerLoad
    ]);
  }).then(function (values) {
    var d = values[0];
    ledger = values[1];
    filterData(d);
    cards = alphabetical(buildCards(d));
    buildAZ();
    render();
  }).catch(function () {
    /* Says what a child can do about it, and does not explain itself. */
    grid.innerHTML = '<p class="none">The book did not open. Try again in a moment.</p>';
    count.textContent = '';
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      Promise.resolve() /* Test Hub staging: no service worker */.catch(function () {});
    });
  }
})();
</script>
</body>
</html>
