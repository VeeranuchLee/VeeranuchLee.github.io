    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Avenir Next",Avenir,"Trebuchet MS",sans-serif;color:var(--ink);background:#dcebf0;touch-action:manipulation}button{font:inherit;color:inherit}.app{position:fixed;inset:0;width:100vw;max-width:none;height:100vh;height:100dvh;overflow:hidden;padding:8px max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:8px}.top{display:flex;align-items:center;gap:10px;min-height:56px;flex:0 0 56px}.back{width:56px;height:56px;flex:0 0 56px;border:3px solid #fff;border-radius:18px;background:#527aa1;color:#fff;box-shadow:0 4px 0 #335777;display:grid;place-items:center}.back svg{width:30px}.title{line-height:1}.title h1{font-size:clamp(1.35rem,3vw,1.9rem);margin:0}.title p{margin:4px 0 0;color:#53617a;font-weight:700}.voice{display:none}

    .main{display:block;width:100%;height:100%;min-height:0;flex:1;overflow:hidden}.solving .main{display:grid;grid-template-columns:minmax(0,1fr) minmax(270px,31%);gap:8px}.notebook{position:relative;width:100%;height:100%;border:3px solid #7392a6;border-radius:20px;padding:10px;min-height:0;background-color:var(--paper);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:32px 32px;box-shadow:0 5px 0 #718a99;overflow:auto;overscroll-behavior:contain;scroll-padding:52px 0 68px}.welcome{max-width:560px;margin:clamp(24px,10vh,70px) auto;text-align:center;background:#fffdf4ee;border:2px solid #a7c4d0;border-radius:22px;padding:22px}.welcome h2{font-size:1.65rem;margin:0 0 8px}.welcome p{font-weight:700;line-height:1.45}.problem-head{display:none}.new-question{min-height:48px;border:2px solid #7693a6;border-radius:14px;background:#fff;padding:6px 14px;font-weight:900}.vertical{--cell:50px;--cell-h:54px;--row-h:57px;width:max-content;min-width:300px;margin:0 auto;padding:5px 10px 10px;background:#fffdf4dc;border-left:2px solid #dc6e74}.vertical.compact{--cell:44px;--cell-h:46px;--row-h:49px}.vertical.dense{--cell:40px;--cell-h:42px;--row-h:44px}.math-row{display:grid;grid-template-columns:34px repeat(var(--cols),calc(var(--cell) + 5px));align-items:center;justify-content:end;min-height:var(--row-h)}.math-row.work-row{min-height:var(--row-h)}.math-row.divider{border-bottom:4px solid #35405a}.row-label{text-align:center;font:900 1.35rem ui-rounded,sans-serif}.given{grid-column:2/-1;text-align:right;padding-right:5px;font:900 calc(var(--cell) * .78)/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:calc(var(--cell) * .35)}.division-given{grid-column:2/-1;display:flex;align-items:center;justify-content:flex-end;font:900 calc(var(--cell) * .7) ui-monospace,monospace}.division-given .divisor{padding:6px;border-right:4px solid var(--ink)}.division-given .dividend{padding:6px;border-top:4px solid var(--ink);letter-spacing:calc(var(--cell) * .25)}.cell{width:var(--cell);height:var(--cell-h);margin:2px;border:3px solid #8397ad;border-radius:10px;background:#fff;text-align:center;font:900 calc(var(--cell) * .76)/1 ui-monospace,monospace;caret-color:transparent;padding:0}.cell.carry,.cell.borrow{height:max(40px,calc(var(--cell-h) - 6px));color:var(--purple);border-color:#927bb0;background:#f6f0ff;font-size:calc(var(--cell) * .62)}.cell.partial{color:#446b93}.cell.remainder,.cell.final-remainder{color:#9b6722}.cell.selected{outline:4px solid #edbc3f;outline-offset:1px}.cell.wrong{border-color:#c74854;background:#fff0f1;animation:shake .22s}.cell.correct{border-color:#4d9a78;background:#effaf4}.cell.guide{box-shadow:0 0 0 4px #badff4}.step-note{position:sticky;bottom:0;z-index:3;max-width:680px;margin:7px auto 0;padding:9px 12px;border:2px solid #9bb7c8;border-radius:14px;background:#fff;font-weight:800;min-height:44px}.step-note.teach{border-color:#9a75bd;background:#faf2ff}.step-note.good{border-color:#4b9977;background:#effaf4}.swap{display:flex;flex-direction:column;align-items:center;gap:12px;margin:40px auto;background:#fff;padding:22px;border-radius:20px;max-width:520px;text-align:center}.swap button{min-height:56px;border:2px solid #4c876e;border-radius:16px;background:#e9f8ef;font-weight:900;padding:8px 18px}
    .side{display:none;min-height:0;overflow:hidden}.solving .side{display:flex;flex-direction:column;gap:7px}.helpbar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.help{min-height:64px;border:3px solid #8196ad;border-radius:15px;background:#fff;box-shadow:0 3px 0 #8196ad;padding:5px;display:flex;align-items:center;justify-content:flex-start;gap:6px;font-weight:900;font-size:.78rem;text-align:left}.help svg{width:30px;height:30px;flex:0 0 30px}.help.guide-on{background:#eee6f8;border-color:#79599b}.help.check{grid-column:1/-1}.keypad-dock{min-height:0}.scratch-toggle{min-height:64px;flex:0 0 64px;border:3px solid #b28b51;border-radius:15px;background:#fff8e6;box-shadow:0 3px 0 #b28b51;font-weight:900;display:flex;align-items:center;justify-content:center;gap:9px}.scratch-toggle svg{width:32px}.scratch{display:none;background:#f6f0df;border:3px solid #c99b55;border-radius:20px;padding:8px;box-shadow:0 4px 0 #80552d;min-height:240px;flex-direction:column;gap:8px}.scratch.open{display:flex}.scratch.scratch-size-medium{min-height:330px}.scratch.scratch-size-large{position:fixed;inset:70px 14px 14px;z-index:20;min-height:0}.scratch-head{display:flex;align-items:center;justify-content:space-between;font-weight:900}.scratch-tools{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap}.scratch-tool{width:50px;height:50px;border:2px solid #b58c53;border-radius:14px;background:#fff9e9;box-shadow:0 2px 0 #b58c53;padding:8px}.scratch-tool svg{width:100%;height:100%}.scratch-tool.on{outline:4px solid #81569e}.crayon{border-radius:50%}.scratch-size{font-size:.72rem;font-weight:900}.scratch-canvas{width:100%;height:190px;min-height:150px;flex:1;background:#fff;border:2px solid #d8c9ad;border-radius:12px;touch-action:pinch-zoom;cursor:crosshair}.scratch-close{min-width:50px;height:50px;border:2px solid #b58c53;border-radius:14px;background:#fff9e9;font-weight:900}
    @keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
    @media (orientation:portrait),(max-width:820px){.question:not(.collapsed){grid-template-columns:1fr}.solving .main{display:flex;flex-direction:column}.notebook{flex:1;min-height:0}.solving .side{height:auto;flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;align-items:start;gap:6px}.helpbar{grid-column:1/-1;grid-template-columns:repeat(5,1fr)}.help,.help.check{grid-column:auto;min-height:64px;flex-direction:column;text-align:center;font-size:.7rem}.help svg{width:26px;height:26px}.keypad-dock{grid-column:1/-1}.scratch.open{grid-column:1/-1}.scratch-toggle{min-height:64px}.vertical{margin-top:0}}
    @media (orientation:landscape) and (min-width:821px){.solving .main{width:100%;height:100%;grid-template-columns:minmax(0,1fr) minmax(300px,32%)}.vertical{--cell:64px;--cell-h:64px;--row-h:67px}.vertical.compact{--cell:58px;--cell-h:58px;--row-h:61px}.vertical.dense{--cell:48px;--cell-h:50px;--row-h:52px}.step-note{min-height:48px;padding:11px 14px}.side{width:100%;height:100%}.solving .side{justify-content:space-between}}
    @media (max-width:620px){.math-row{grid-template-columns:28px repeat(var(--cols),calc(var(--cell) + 3px))}.vertical{min-width:0;padding-left:3px;padding-right:3px}.question-readout{min-height:66px}.keypad:not(.workspace){grid-template-columns:repeat(4,1fr)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<body>
<main class="app">
  <header class="top"><a id="helperBack" class="back" href="./index.html" aria-label="Back to Magic Math"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M19 7l-9 9 9 9M11 16h12" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></a><div class="title"><h1>My Math Helper</h1><p>You choose the question. Help waits until you ask.</p></div><button class="voice" hidden aria-hidden="true">Listen</button></header>
  <section id="questionBar" class="question" aria-label="Type a calculation"><div id="questionReadout" class="question-readout"><span class="empty">Type a number, an operation, and another number.</span></div><button id="topNewQuestion" class="new-question" hidden>New question</button><div id="questionKeys" class="keypad"></div></section>
  <section class="main"><div id="notebook" class="notebook"><div class="welcome"><h2>Your notebook is ready.</h2><p>Try your own addition, subtraction, multiplication, or division. Fill the boxes yourself, or ask for just enough help.</p></div></div>
    <aside class="side"><div class="helpbar">
      <button class="help" data-help="hint"><svg viewBox="0 0 40 40"><path d="M14 27h12M15 31h10M20 5a11 11 0 0 0-7 19c2 2 3 3 3 5h8c0-2 1-3 3-5A11 11 0 0 0 20 5Z" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg><span>Hint</span></button>
      <button class="help" data-help="show"><svg viewBox="0 0 40 40"><path d="M7 20h20M21 13l7 7-7 7M9 8v24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg><span>Show Next Step</span></button>
      <button class="help check" data-help="check"><svg viewBox="0 0 40 40"><path d="M7 20l8 8L33 9" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Check My Work</span></button>
      <button class="help" data-help="why"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="15" fill="none" stroke="currentColor" stroke-width="3"/><path d="M15 15a5 5 0 1 1 7 5c-2 1-2 2-2 4M20 30h.1" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg><span>Explain Why</span></button>
      <button class="help" data-help="guide"><svg viewBox="0 0 40 40"><path d="M8 31c7-8 9-14 9-22M17 9l-5 5M17 9l4 6M19 31c5-7 9-10 14-12M33 19l-7-1M33 19l-2 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Guide Me</span></button>
    </div><div id="keypadDock" class="keypad-dock"></div>
    <button id="scratchToggle" class="scratch-toggle" aria-expanded="false"><svg viewBox="0 0 40 40"><path d="M8 31l3-9L27 6l7 7-16 16-10 2Zm4-10 7 7M25 8l7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></svg><span>Scratchpad</span></button>
    <section id="scratch" class="scratch scratch-size-small" aria-label="Scratchpad"><div class="scratch-head"><span>Scratchpad</span><button id="scratchClose" class="scratch-close" aria-label="Hide scratchpad">Hide</button></div><div id="scratchTools" class="scratch-tools"></div><canvas id="scratchCanvas" class="scratch-canvas" aria-label="Drawing scratchpad"></canvas></section>
    </aside></section>
</main>
<script type="module">
import { makeProblem, checkWork } from "./js/math-helper-engine.js";

const $ = selector => document.querySelector(selector);
const world = new URLSearchParams(location.search).get("world");
const worldMenus = {space:"space-math.html",unicorn:"unicorn-math.html",mermaid:"mermaid-math.html"};
if(worldMenus[world]){document.body.dataset.world=world;$("#helperBack").href=`./${worldMenus[world]}`;$("#helperBack").setAttribute("aria-label",`Back to ${world[0].toUpperCase()+world.slice(1)} Math`)}
const readout = $("#questionReadout");
const notebook = $("#notebook");
const CARRY_POSITION = "above"; // Owner default: above the top number, over the receiving column.
let entry = { a: "", op: "", b: "" }, problem = null, work = {}, selected = null, guide = false;
const misses = new Map();

function questionText(){ return `${entry.a}${entry.op ? ` ${entry.op} ` : ""}${entry.b}`; }
function updateReadout(message){ readout.innerHTML = message ? `<span class="empty">${message}</span>` : questionText() || '<span class="empty">Type a number, an operation, and another number.</span>'; }
function questionKey(value){
  if(problem && (/^\d$/.test(value) || value==="back")){writeSelected(value);return}
  if (/^\d$/.test(value)) { const side = entry.op ? "b" : "a"; if (entry[side].length < 4) entry[side] += value; }
  else if (["+","-","×","÷"].includes(value) && entry.a) entry.op = value;
  else if (value === "back") { const side = entry.b ? "b" : entry.op ? "op" : "a"; entry[side] = entry[side].slice(0,-1); }
  else if (value === "clear") entry = { a:"",op:"",b:"" };
  else if (value === "go") startProblem();
  updateReadout();
}
function buildKeys(){
  const q = ["7","8","9","+","-","back","4","5","6","×","÷","clear","1","2","3","0","go"];
  const operationIcon={"+":"M16 5v22M5 16h22","-":"M5 16h22","×":"M7 7l18 18M25 7 7 25","÷":"M5 16h22M16 7h.1M16 25h.1"};
  $("#questionKeys").innerHTML = q.map(v=>{const op=operationIcon[v];const label=v==="+"?"plus":v==="-"?"minus":v==="×"?"times":v==="÷"?"divided by":v==="back"?"backspace":v==="clear"?"Clear":v==="go"?"Go":v;const content=op?`<svg viewBox="0 0 32 32" aria-hidden="true"><path d="${op}" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/></svg>`:v==="back"?'<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M13 8 5 16l8 8h14V8H13Zm4 5 6 6m0-6-6 6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>':v==="clear"?"Clear":v==="go"?"Go":v;return `<button class="key ${op?"op question-only":""} ${["clear","go"].includes(v)?"question-only":""} ${v==="go"?"go":""}" data-q="${v}" aria-label="${label}">${content}</button>`}).join("");
  $("#questionKeys").addEventListener("click",e=>{const key=e.target.closest("[data-q]");if(key)questionKey(key.dataset.q)});
}
function startProblem(){
  if (!entry.a || !entry.op || !entry.b) { updateReadout("Finish both numbers first."); return; }
  problem = makeProblem(Number(entry.a),entry.op,Number(entry.b)); work={};selected=null;guide=false;misses.clear();
  document.body.classList.add("solving");$("#questionKeys").classList.add("workspace");$("#keypadDock").append($("#questionKeys"));$("#topNewQuestion").hidden=false;render();
}
function swapProblem(){ const old=entry.a;entry.a=entry.b;entry.b=old;updateReadout();startProblem(); }
function allCells(){ return problem ? problem.steps.flatMap(step=>step.cells) : []; }
function nextCell(){ return checkWork(problem,work).next; }
function ensureStepVisible(id){requestAnimationFrame(()=>{const meta=allCells().find(c=>c.id===id),step=stepFor(meta);if(!step)return;const boxes=step.cells.map(c=>document.querySelector(`[data-cell="${CSS.escape(c.id)}"]`)).filter(Boolean);if(!boxes.length)return;const pane=notebook.getBoundingClientRect(),top=Math.min(...boxes.map(el=>el.getBoundingClientRect().top)),bottom=Math.max(...boxes.map(el=>el.getBoundingClientRect().bottom));if(top<pane.top+8)notebook.scrollTop-=pane.top+8-top;else if(bottom>pane.bottom-54)notebook.scrollTop+=bottom-(pane.bottom-54)})}
function selectCell(id){ selected=id;document.querySelectorAll(".cell").forEach(el=>el.classList.toggle("selected",el.dataset.cell===id));ensureStepVisible(id); }
function writeSelected(value){
  if(!selected)return;
  const meta=allCells().find(c=>c.id===selected);if(!meta)return;
  if(value==="back") work[selected]=(work[selected]||"").slice(0,-1); else if((work[selected]||"").length<(meta.maxDigits||1)) work[selected]=(work[selected]||"")+value;
  const el=document.querySelector(`[data-cell="${CSS.escape(selected)}"]`);if(el){el.value=work[selected]||"";el.classList.remove("wrong","correct")}
  if(work[selected]===meta.expected){ el?.classList.add("correct"); const next=nextCell();if(next){selectCell(next.id);if(guide){document.querySelectorAll(".cell").forEach(box=>box.classList.remove("guide"));document.querySelector(`[data-cell="${CSS.escape(next.id)}"]`)?.classList.add("guide");const nextStep=stepFor(next);message(`${nextStep.instruction} You still fill the box.`,"teach")}}else message("Every step is correct. You worked it out.","good"); }
}
function rowHtml(label,cells,width,extra="",ariaLabel=label){
  const slots=Array(width).fill("");cells.forEach(c=>{slots[c.slot??(width-1-c.column)]=`<input readonly inputmode="none" class="cell ${c.kind}" data-cell="${c.id}" data-step="${c.step}" aria-label="${c.kind} in the ${c.column>=0?c.column+1:"next"} place" maxlength="${c.maxDigits||1}" value="${work[c.id]||""}">`});
  return `<div class="math-row work-row ${extra}" style="--cols:${width}"><span class="row-label"${ariaLabel?` aria-label="${ariaLabel}"`:""}>${label}</span>${slots.map((v,i)=>v||`<span aria-hidden="true"></span>`).join("")}</div>`;
}
function render(){
  if(problem.needsSwap){notebook.innerHTML=`<div class="swap"><h2>Keep the bigger number on top</h2><p>${problem.message}</p><button id="swapButton">Swap to ${problem.b} − ${problem.a}</button></div>`;$("#swapButton").onclick=swapProblem;return}
  if(problem.message){notebook.innerHTML=`<div class="swap"><h2>Choose another question</h2><p>${problem.message}</p></div>`;return}
  const width=problem.width;const workRows=new Set(allCells().map(c=>c.row||c.kind)).size;const density=workRows>=8?"dense":workRows>=5?"compact":"";let html=`<div class="problem-head"><h2>${problem.a} ${problem.op} ${problem.b}</h2></div><div class="vertical ${density}" data-work-rows="${workRows}">`;
  const grouped=new Map();allCells().forEach(c=>{const group=c.row||c.kind;if(!grouped.has(group))grouped.set(group,[]);grouped.get(group).push(c)});
  if(problem.op==="÷"){
    html+=rowHtml("",grouped.get("quotient")||[],width,"divider");
    html+=`<div class="math-row" style="--cols:${width}"><span></span><div class="division-given"><span class="divisor">${problem.b}</span><span class="dividend">${problem.a}</span></div></div>`;
    for(const [key,cells] of grouped) if(key!=="quotient") html+=rowHtml(key.startsWith("divide-product")?"−":key==="final-remainder"?"R":"",cells,width,key.startsWith("divide-product")?"divider":"");
  }else{
    const preGroups=[...grouped.entries()].filter(([key])=>key.startsWith("borrow-")||(key==="carry"&&CARRY_POSITION==="above"));
    for(const [key,cells] of preGroups) html+=key==="carry"?rowHtml("",cells,width,"","carry"):rowHtml("",cells,width,"","borrow");
    html+=`<div class="math-row" style="--cols:${width}"><span class="row-label"></span><span class="given">${problem.a}</span></div>`;
    html+=`<div class="math-row divider" style="--cols:${width}"><span class="row-label">${problem.op}</span><span class="given">${problem.b}</span></div>`;
    const order=[...grouped.entries()].filter(([key])=>!key.startsWith("borrow-")&&key!=="carry").sort((a,b)=>Math.min(...a[1].map(c=>c.step))-Math.min(...b[1].map(c=>c.step)));
    for(const [key,cells] of order) html+=rowHtml(key.startsWith("partial-")&&key!=="partial-0"?"+":"",cells,width,key==="answer"?"divider":"");
    if(CARRY_POSITION==="below"&&grouped.has("carry"))html+=rowHtml("",grouped.get("carry"),width,"","carry");
  }
  html+=`</div><div id="stepNote" class="step-note">Tap the first empty box. Try it yourself, or ask for help.</div>`;notebook.innerHTML=html;
  notebook.querySelectorAll(".cell").forEach(el=>el.addEventListener("click",()=>selectCell(el.dataset.cell)));
  const next=nextCell();if(next)selectCell(next.id);
}
function renderWelcome(){notebook.innerHTML='<div class="welcome"><h2>Your notebook is ready.</h2><p>Try your own addition, subtraction, multiplication, or division. Fill the boxes yourself, or ask for just enough help.</p></div>'}
function resetQuestion(){problem=null;work={};selected=null;entry={a:"",op:"",b:""};document.body.classList.remove("solving");$("#questionKeys").classList.remove("workspace");$("#questionBar").append($("#questionKeys"));$("#topNewQuestion").hidden=true;updateReadout();renderWelcome()}
$("#topNewQuestion").addEventListener("click",resetQuestion);
function stepFor(cell){return problem.steps.find(step=>step.cells.some(item=>item.id===cell?.id))}
function message(text,kind=""){const el=$("#stepNote");if(el){el.textContent=text;el.className=`step-note ${kind}`}}
function revealStep(step){step.cells.forEach(c=>{if(work[c.id]!==c.expected)work[c.id]=c.expected});render();message(`${step.title}: ${step.instruction}`,"teach")}
function help(action){
  if(!problem||problem.message||problem.needsSwap)return;
  const result=checkWork(problem,work), next=result.next, step=stepFor(next);
  if(!next){message("Every step is correct. You worked it out.","good");return}
  if(action==="hint") {const count=(misses.get(step.id)||0)+1;misses.set(step.id,count);if(count>=3){work[next.id]=next.expected;render();message(`This box is ${next.expected}. Now try the next one.`,"teach")}else if(count===2)message(step.why,"teach");else message(step.hint)}
  if(action==="show") revealStep(step);
  if(action==="why") message(step.why,"teach");
  if(action==="guide") {guide=!guide;document.querySelector('[data-help="guide"]').classList.toggle("guide-on",guide);document.querySelectorAll(".cell").forEach(el=>el.classList.remove("guide"));if(guide){selectCell(next.id);document.querySelector(`[data-cell="${CSS.escape(next.id)}"]`)?.classList.add("guide");message(`${step.instruction} You still fill the box.`,"teach")}else message("Guide mode is off. Keep going your way.")}
  if(action==="check") {
    document.querySelectorAll(".cell").forEach(el=>el.classList.remove("wrong","correct"));
    result.correct.forEach(id=>document.querySelector(`[data-cell="${CSS.escape(id)}"]`)?.classList.add("correct"));result.wrong.forEach(id=>document.querySelector(`[data-cell="${CSS.escape(id)}"]`)?.classList.add("wrong"));
    if(result.wrong.length){const wrong=result.wrong[0],wrongStep=stepFor({id:wrong});const count=(misses.get(wrongStep.id)||0)+1;misses.set(wrongStep.id,count);if(count>=3){work[wrong]=allCells().find(c=>c.id===wrong).expected;render();message(`This box is ${work[wrong]}. Keep your correct boxes.`,"teach")}else{message(count===2?wrongStep.why:`Check this box: ${wrongStep.errorKind}.`,count===2?"teach":"");selectCell(wrong)}}else if(result.complete)message("Every step is correct. You worked it out.","good");else{message("Your filled boxes are correct. Keep going.","good");selectCell(next.id)}
  }
}
document.querySelectorAll("[data-help]").forEach(button=>button.addEventListener("click",()=>help(button.dataset.help)));

const scratch=$("#scratch"),canvas=$("#scratchCanvas"),ctx=canvas.getContext("2d");let drawing=false,last=null,colour="#334d8f",pen=6,eraser=false,sizeIndex=0;const strokes=[];const sizes=["small","medium","large"];
function resizeCanvas(){const rect=canvas.getBoundingClientRect(),ratio=Math.max(1,devicePixelRatio||1);canvas.width=Math.round(rect.width*ratio);canvas.height=Math.round(rect.height*ratio);ctx.setTransform(ratio,0,0,ratio,0,0);ctx.lineCap="round";ctx.lineJoin="round";replay()}
function replay(){ctx.clearRect(0,0,canvas.width,canvas.height);for(const stroke of strokes){ctx.strokeStyle=stroke.eraser?"#fff":stroke.colour;ctx.lineWidth=stroke.pen;ctx.beginPath();stroke.points.forEach((p,i)=>i?ctx.lineTo(p.x*canvas.clientWidth,p.y*canvas.clientHeight):ctx.moveTo(p.x*canvas.clientWidth,p.y*canvas.clientHeight));ctx.stroke()}}
function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}}
canvas.addEventListener("pointerdown",e=>{if(e.pointerType==="touch"&&!e.isPrimary)return;drawing=true;last=point(e);strokes.push({colour,pen,eraser,points:[last]})});canvas.addEventListener("pointermove",e=>{if(!drawing)return;const p=point(e),r=canvas.getBoundingClientRect();ctx.strokeStyle=eraser?"#fff":colour;ctx.lineWidth=eraser?22:pen;ctx.beginPath();ctx.moveTo(last.x*r.width,last.y*r.height);ctx.lineTo(p.x*r.width,p.y*r.height);ctx.stroke();strokes.at(-1).points.push(p);last=p});["pointerup","pointercancel","pointerleave"].forEach(name=>canvas.addEventListener(name,()=>{drawing=false;last=null}));
const icon=(path)=>`<svg viewBox="0 0 32 32" aria-hidden="true"><path d="${path}" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
function scratchTools(){const tools=[`<button class="scratch-tool scratch-size" data-tool="size" aria-label="Change scratchpad size">${icon("M12 12L6 6m0 0v6m0-6h6M20 20l6 6m0 0v-6m0 6h-6")}</button>`,...[["#334d8f","blue"],["#d13f55","red"],["#24855e","green"],["#7c4aa1","purple"]].map(([c,n])=>`<button class="scratch-tool crayon" style="background:${c}" data-colour="${c}" aria-label="Choose the ${n} crayon"></button>`),...[4,7,12].map((n,i)=>`<button class="scratch-tool" data-pen="${n}" aria-label="${["Thin","Medium","Thick"][i]} crayon">${icon(`M5 16h22${n>4?"M5 19h22":""}${n>8?"M5 13h22":""}`)}</button>`),`<button class="scratch-tool" data-tool="eraser" aria-label="Eraser">${icon("M7 23 20 7l7 7-11 13H9l-2-4Zm9 4 5-6")}</button>`,`<button class="scratch-tool" data-tool="clear" aria-label="Clear page">${icon("M9 10h14l-1 17H10L9 10Zm-2 0h18M13 10V6h6v4")}</button>`];$("#scratchTools").innerHTML=tools.join("")}
$("#scratchTools").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.colour){colour=b.dataset.colour;eraser=false}if(b.dataset.pen){pen=Number(b.dataset.pen);eraser=false}if(b.dataset.tool==="eraser")eraser=true;if(b.dataset.tool==="clear"){strokes.length=0;replay()}if(b.dataset.tool==="size"){sizeIndex=(sizeIndex+1)%3;scratch.classList.remove(...sizes.map(s=>`scratch-size-${s}`));scratch.classList.add(`scratch-size-${sizes[sizeIndex]}`);requestAnimationFrame(resizeCanvas)}});
function toggleScratch(open){scratch.classList.toggle("open",open);$("#scratchToggle").setAttribute("aria-expanded",String(open));if(open)requestAnimationFrame(resizeCanvas)}$("#scratchToggle").onclick=()=>toggleScratch(!scratch.classList.contains("open"));$("#scratchClose").onclick=()=>toggleScratch(false);new ResizeObserver(()=>{if(scratch.classList.contains("open"))resizeCanvas()}).observe(scratch);
buildKeys();scratchTools();updateReadout();
</script>
</body>
