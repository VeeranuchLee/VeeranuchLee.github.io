<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Number Catch</title><link rel="stylesheet" href="./fonts.css"><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;touch-action:manipulation}body{font-family:Nunito,sans-serif;background:radial-gradient(circle at 50% 0,#5246a5,#151447 66%);color:#fff;display:grid;place-items:center;padding:28px}.box{width:min(760px,100%);text-align:center;padding:30px;border:5px solid #f5ba38;border-radius:34px;background:#22266d;box-shadow:inset 0 0 0 4px #fff09a,0 14px 30px #090823}h1{margin:0;color:#ffd84e;font-size:clamp(2.4rem,8vw,4.4rem);text-shadow:0 4px 0 #943e1b}p{font-size:1.2rem;font-weight:800}.worlds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:24px}.world{min-height:150px;display:grid;place-items:center;padding:22px;border:4px solid #fff2a3;border-radius:28px;color:#fff;text-decoration:none;font-size:1.6rem;font-weight:1000;box-shadow:0 7px 0 #6b3218;touch-action:manipulation}.space{background:linear-gradient(145deg,#2787db,#26318d)}.unicorn{background:linear-gradient(145deg,#ef78b1,#7d45ad)}small{display:block;margin-top:22px;color:#dcdcff}@media(max-width:540px){.worlds{grid-template-columns:1fr}.world{min-height:110px}}</style></head><body><main class="box"><h1>Number Catch</h1><p>Pick a world. Boop the matching numbers and let the others duck away.</p><div class="worlds"><a class="world space" href="./space-math.html#play-t1">🚀 Space Arcade</a><a class="world unicorn" href="./unicorn-math.html#play-t1">🦄 Unicorn Arcade</a></div><small>Test Hub candidate · no service worker</small></main><script src="./js/tap-zoom-guard.js"></script></body></html>
