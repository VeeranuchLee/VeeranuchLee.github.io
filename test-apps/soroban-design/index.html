<h1>Soroban Garden: design preview</h1>
<p>Three painted screen mockups for a new app that teaches the real abacus (soroban): one bead worth 5 above the bar, four beads worth 1 below it, read one rod per digit. A bead counts when it touches the bar.</p>
<a class="go" href="prototype.html">Try the tap prototype: Make 47</a>
