<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Our Dictionary</title>
  <link rel="manifest" href="./manifest.webmanifest?v=d6b07ff2a-20261018203724"/>
  <link rel="stylesheet" href="./fonts.css?v=d6b07ff2a-20261018203724"/>
  <meta name="theme-color" content="#3a1e33"/>
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png?v=d6b07ff2a-20261018203724"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Our Dictionary"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    /* INTERACTION-DIRECTION.md method C, layer 1: manipulation on BOTH html and body. Layer 3
       is the shared tap-zoom-guard.js loaded at the end of the page. No pinch is blocked. */
    html,body{touch-action:manipulation}
    body{
      font-family:'Nunito',sans-serif;min-height:100vh;color:#3a1e33;
      background:#fdf6ff;
      -webkit-text-size-adjust:100%;
    }

    /* ── The header, stuck as ONE piece ──
       The bar and the A-Z strip used to be sticky separately, both at top:0. The bar won
       on z-index, so the moment the page scrolled it painted straight over the strip and
       a child lost the only fast way to move through the dictionary.

       They stick together now, from this one wrapper, because the bar's height is not a
       number anyone can write down: it wraps at narrow widths (79px at 768px, 183px at
       400px) and its top padding carries env(safe-area-inset-top), which differs by
       device. Any `.az{top:<px>}` would be right on one screen and wrong on the next.
       Gluing them means nothing has to be measured at all. */
    .topbar{position:sticky;top:0;z-index:20}

    /* Back to OUR WORD BOOK, not to Children Games. That is the navigation the owner
       asked for -- Children Hub -> Our Word Book -> activity -> back to Our Word Book --
       and it is the one thing a promotion like this gets wrong: moving a card without
       moving the arrow leaves a child two taps from a page nobody meant them to see.
       Relative, because this page and the front door are the same app. */
    .bar{
      display:flex;align-items:center;gap:12px;flex-wrap:wrap;
      padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
      background:rgba(253,246,255,.94);backdrop-filter:blur(8px);
      border-bottom:3px solid #f0dcea;
    }
    .back{
      display:inline-flex;align-items:center;gap:8px;
      min-height:64px;padding:0 18px 0 14px;border-radius:50px;
      background:linear-gradient(135deg,#fff,#ffe9f1);
      border:2.5px solid #e59bbb;box-shadow:0 4px 0 #e59bbb;
      color:#a8386a;text-decoration:none;
      font-weight:900;font-size:1rem;line-height:1;white-space:nowrap;
      -webkit-tap-highlight-color:transparent;transition:transform .1s;
    }
    .back:active{transform:translateY(3px);box-shadow:0 1px 0 #e59bbb}
    .back:focus-visible{outline:4px solid #ffd54f;outline-offset:3px}
    .back svg{width:22px;height:22px;flex:none}

    h1{font-weight:900;font-size:1.35rem;color:#a8386a;margin-right:auto}

    .find{
      flex:1 1 220px;min-width:200px;
      display:flex;align-items:center;gap:8px;
      background:#fff;border:3px solid #f0dcea;border-radius:50px;
      padding:0 14px;min-height:64px;
    }
    .find:focus-within{border-color:#e59bbb}
    .find svg{width:22px;height:22px;flex:none;color:#c98aa8}
    .find input{
      flex:1;border:0;outline:0;background:transparent;
      font-family:inherit;font-weight:800;font-size:1.05rem;color:#3a1e33;min-width:0;
    }
    .find input::placeholder{color:#c9a8bb}
    .clear{
      border:0;background:#f6e6ef;color:#a8386a;border-radius:50%;
      width:44px;height:44px;flex:none;font:inherit;font-weight:900;font-size:1.1rem;
      cursor:pointer;line-height:1;
    }
    .clear[hidden]{display:none!important}

    .mode-switch{
      display:flex;justify-content:center;gap:8px;padding:10px 14px 0;background:#fdf6ff;
    }
    .mode-switch button{
      min-width:150px;min-height:64px;padding:8px 20px;border-radius:20px;
      border:3px solid #e8cddd;background:#fff;color:#8a5c76;
      font:900 1rem 'Nunito',sans-serif;cursor:pointer;-webkit-tap-highlight-color:transparent;
    }
    .mode-switch button[aria-pressed="true"]{
      background:linear-gradient(160deg,#d4739a,#a8386a);color:#fff;border-color:#a8386a;
    }
    .mode-switch button:focus-visible,.collection-card:focus-visible,.poster-choice:focus-visible,
    .poster-word:focus-visible,.poster-back:focus-visible,
    .collection-link:focus-visible,.all-groups:focus-visible{outline:4px solid #ffd54f;outline-offset:3px}

    /* ── A to Z ──
       The whole alphabet, always visible, because a child who can find "S" does not need
       to be taught a menu. 64px tall so it clears a finger on the 9.7" iPad this is built
       for, and it scrolls sideways rather than wrapping into a block that pushes the words
       off the screen. Not sticky itself -- .topbar above carries it. */
    .az{
      display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;
      padding:10px 14px;background:#fdf6ff;
      border-bottom:3px solid #f0dcea;
      scrollbar-width:none;
    }
    .az::-webkit-scrollbar{display:none}
    .az button{
      flex:none;min-width:64px;height:64px;border-radius:18px;
      border:2.5px solid #f0dcea;background:#fff;
      font-family:inherit;font-weight:900;font-size:1.1rem;text-transform:uppercase;
      color:#8a5c76;cursor:pointer;-webkit-tap-highlight-color:transparent;
    }
    .az button[aria-pressed="true"]{
      background:linear-gradient(160deg,#d4739a,#a8386a);color:#fff;border-color:#a8386a;
    }
    .az button:focus-visible{outline:4px solid #ffd54f;outline-offset:2px}
    .az[hidden]{display:none}

    main{padding:16px 14px 40px;max-width:1100px;margin:0 auto}

    /* Three cards across at 768px, which is the target device in portrait. */
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
    .grid.collections{grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}

    .collection-card{
      min-height:154px;padding:18px;border:3px solid #ead5e2;border-radius:24px;
      background:linear-gradient(145deg,#fff,#fff5fa);color:#3a1e33;text-align:left;
      display:grid;grid-template-columns:68px 1fr;align-items:center;gap:14px;
      font:inherit;cursor:pointer;box-shadow:0 5px 0 #ead5e2;
      -webkit-tap-highlight-color:transparent;touch-action:manipulation;
    }
    .collection-card:active{transform:translateY(3px);box-shadow:0 2px 0 #ead5e2}
    .collection-icon{font-size:3rem;line-height:1;text-align:center}
    .collection-icon img{display:block;width:100%;height:100%;object-fit:contain}
    .collection-card .collection-icon{width:68px;height:68px}
    .collection-name{display:block;font-family:'Fredoka One',Nunito,sans-serif;font-size:1.35rem;line-height:1.15}
    .collection-description{display:block;margin-top:6px;color:#6b5260;font-weight:800;line-height:1.3}
    .collection-total{display:block;margin-top:8px;color:#a8386a;font-size:.82rem;font-weight:900}

    .collection-heading{
      display:grid;grid-template-columns:auto auto 1fr;align-items:center;gap:12px;
      margin-bottom:14px;padding:14px 16px;border:3px solid #ead5e2;border-radius:22px;
      background:#fff;
    }
    .collection-heading[hidden]{display:none}
    .all-groups{
      min-width:64px;min-height:64px;padding:8px 14px;border-radius:18px;
      border:3px solid #e59bbb;background:#fff5fa;color:#a8386a;
      font:900 .95rem 'Nunito',sans-serif;cursor:pointer;
      grid-column:1;grid-row:1/3;
    }
    .collection-heading .collection-icon{grid-row:1/3;grid-column:2;width:64px;height:64px;font-size:2.35rem;text-align:left;padding-left:2px}
    .collection-title{grid-column:3;font-family:'Fredoka One',Nunito,sans-serif;font-size:1.5rem;line-height:1.1}
    .collection-copy{grid-column:3;color:#6b5260;font-weight:800}
    .subgroup-filters{
      grid-column:1/-1;display:flex;gap:10px;overflow-x:auto;overscroll-behavior-inline:contain;
      scrollbar-width:thin;padding:6px 2px 2px;scroll-snap-type:x proximity
    }
    .subgroup-filters[hidden]{display:none}
    .subgroup-filter{
      flex:0 0 auto;min-height:64px;padding:10px 18px;border:3px solid #dfb8cc;border-radius:999px;
      background:#fff;color:#71405a;font:900 .96rem Nunito,sans-serif;cursor:pointer;scroll-snap-align:start
    }
    .subgroup-filter[aria-pressed="true"]{background:#a8386a;color:#fff;border-color:#a8386a}
    .subgroup-filter:focus-visible{outline:4px solid #ffd54f;outline-offset:3px}
    .collection-link img{width:28px;height:28px;object-fit:contain;vertical-align:middle;margin-right:5px}

    .card{
      background:#fff;border:3px solid #f0dcea;border-radius:22px;
      overflow:hidden;display:flex;flex-direction:column;
    }

    /* POSTERS -- ordered teaching sets are scenes, paths and strips rather than another
       card grid. Every labelled word is at least 60 CSS px in both axes on the 9.7-inch
       iPad, and its text never drops under 16 px.
       THE WHOLE POSTER IS VISIBLE AT ONCE, IN BOTH ORIENTATIONS (owner, 2026-10-13).
       Round 2 sized the stage with width:min(100%, calc((100dvh - 245px)*4/3)) -- the
       245px reserve guessed the chrome above the stage and guessed ~60px short, so at
       1024x768 every poster put its bottom label row behind a page scroll. Instead of a
       better guess, the detail view now LOCKS the document to the viewport
       (body.poster-view: a 100dvh column, no page scroll) and the stage area takes
       whatever height is left; the stage is then the largest EXACT 4:3 box that fits,
       measured against that area with container units (100cqw / 100cqh) -- no number
       that can drift from the real header. The plate fills the stage exactly
       (object-fit:contain on a same-ratio box), and the labels are % of the stage, so
       they scale with the plate and stay beside the things they name. Engines without
       container units fall back to the old dvh arithmetic with a safe 320px reserve:
       a slightly smaller poster, never a scrolling one. The stage itself still never
       scrolls and never captures pinch: INTERACTION-DIRECTION method C stays unchanged.
       ROUND 4 (owner, 2026-10-13): the poster is a listening surface, not a
       navigation one. A word label tap plays that word and STAYS on the poster; a strip
       of small icon cards (one per word, poster order) sits BESIDE the plate in
       landscape and UNDER it in portrait, and each plays its word's sentence while the
       matching label glows on the plate. .poster-body holds the stage area and the
       strip and is the box the strip is measured against; everything still fits the one
       viewport with no page scroll. */
    .poster-groups{display:grid;gap:24px;width:100%}
    .poster-group h2{margin:0 0 10px;color:#5b3550;font-size:clamp(1.25rem,3vw,1.65rem)}
    .poster-choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;width:100%}
    .poster-choice{min-height:150px;border:0;border-radius:24px;padding:0;overflow:hidden;background:#fff9ed;box-shadow:0 6px 0 #d8b88f;color:#5b3550;font:900 1.08rem/1.25 inherit;cursor:pointer;text-align:left}
    .poster-choice img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#f3dfc5}
    .poster-choice-copy{display:block;padding:11px 14px 13px}
    .poster-choice-copy span{display:block;margin-top:4px;font-size:.82rem;font-weight:800;color:#825f75}
    .poster-wrap{width:min(1120px,100%);margin:auto}
    /* The picker and a poster's word card are lists: the page may scroll there, as it
       always did. The lock exists only while one poster's plate is on screen. */
    body.poster-view{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
    /* width:100% because main's base margin:0 auto would otherwise shrink-wrap it: in a
       flex column those horizontal auto margins are cross-axis autos, and cross-axis
       auto margins turn stretching off. */
    body.poster-view main{flex:1;min-height:0;display:flex;flex-direction:column;padding-bottom:16px;width:100%}
    body.poster-view .poster-wrap{flex:1;min-height:0;display:flex;flex-direction:column;margin:0}
    .poster-heading{display:flex;align-items:center;justify-content:center;gap:14px;margin:0 0 16px;color:#5b3550}
    body.poster-view .poster-heading{flex:none;margin:0 0 12px}
    .poster-heading h2{font-size:clamp(1.45rem,4vw,2.25rem);text-align:center}
    .poster-back{min-height:60px;min-width:60px;border:0;border-radius:50%;background:#fff;color:#a8386a;box-shadow:0 4px 0 #d69ab4;font:900 1rem inherit;padding:0 17px;cursor:pointer}
    /* One compact entrance; the wrapper is deliberately a choices container so later
       approved activities can become siblings without changing the poster again. */
    .poster-activities{display:flex;gap:7px}
    .poster-play{min-height:48px;border:2px solid #a8386a;border-radius:50px;background:#fff;color:#a8386a;
      box-shadow:0 3px 0 #d69ab4;padding:0 15px;font:900 .95rem Nunito,sans-serif;cursor:pointer}
    .poster-play:active{transform:translateY(2px);box-shadow:0 1px 0 #d69ab4}
    .poster-play:focus-visible,.find-action:focus-visible{outline:4px solid #ffd54f;outline-offset:2px}
    /* Landscape is the default: the strip runs down the right of the plate. Portrait
       turns the body into a column so the same two pieces stack, strip under plate.
       overflow:hidden on the body is the same promise the lock makes on body.poster-view:
       nothing inside the poster view may buy layout with a page scroll. */
    .poster-body{flex:1;min-height:0;display:flex;flex-direction:row;gap:14px;overflow:hidden}
    @media (orientation: portrait){.poster-body{flex-direction:column}}
    .poster-stage-area{flex:1;min-width:0;min-height:0;display:flex;container-type:size}
    /* The plate and the pills live in one wrap so the pills' % coordinates are
       exactly the plate's. The STAGE itself keeps overflow:hidden (it clips the
       plate art to its rounded corners); the PILLS move to an unclipped overlay
       above it, because every pill carries invisible 44px hotspots that may reach
       a little past the plate edge onto the page -- invisible, still tappable,
       and they must not be clipped to less than 44px by the stage. A pill's
       VISIBLE box must still sit inside the plate (check-posters-fit), so nothing
       a child can see ever leaves the picture. */
    .poster-stage-wrap{position:relative;flex:none;width:min(100%,calc((100vh - 320px)*4/3));width:min(100%,calc((100dvh - 320px)*4/3));max-height:calc(100vh - 320px);max-height:calc(100dvh - 320px);aspect-ratio:4/3;margin:auto}
    @supports (width:1cqw){.poster-stage-wrap{width:min(100cqw,133.333cqh);max-height:none}}
    .poster-stage{position:absolute;inset:0;border-radius:28px;overflow:hidden;background-color:#f3dfc5;background-position:center;background-size:contain;background-repeat:no-repeat;box-shadow:inset 0 0 0 5px rgba(255,255,255,.72),0 12px 30px rgba(35,16,31,.28)}
    .poster-live{position:absolute;inset:0;z-index:2;overflow:visible;pointer-events:none}
    .poster-live .poster-word-hit{pointer-events:auto}
    .poster-plate{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
    .find-target{display:none;position:absolute;left:var(--x);top:var(--y);width:var(--w);height:var(--h);
      z-index:4;border:0;border-radius:14px;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent}
    body.find-picture-game .find-target{display:block}
    body.find-picture-game .poster-activities{display:none}
    body.find-picture-game .poster-live{visibility:hidden;pointer-events:none}
    body.find-picture-game .poster-sentence-list,body.find-picture-game .poster-strip{display:none}
    .find-target.is-hint{animation:findHint 1.15s ease-in-out infinite;box-shadow:0 0 0 5px rgba(255,213,79,.48),0 0 24px 9px rgba(255,213,79,.48)}
    .find-target.is-reveal,.find-target.is-correct{animation:findReveal .58s ease-in-out 2;background:rgba(255,213,79,.2);box-shadow:0 0 0 6px #ffd54f,0 0 30px 12px rgba(255,213,79,.65)}
    @keyframes findHint{50%{box-shadow:0 0 0 8px rgba(255,213,79,.3),0 0 34px 13px rgba(255,213,79,.42)}}
    @keyframes findReveal{50%{transform:scale(1.07)}}
    @media (prefers-reduced-motion:reduce){.find-target.is-hint,.find-target.is-reveal,.find-target.is-correct{animation:none}}
    .find-panel{display:none;flex:none;width:min(250px,31vw);align-self:center;border-radius:22px;background:#fff9ee;
      box-shadow:inset 0 0 0 3px #fff,0 8px 22px rgba(35,16,31,.16);padding:14px;color:#5b3550;text-align:center}
    body.find-picture-game .find-panel{display:flex;flex-direction:column;align-items:center;gap:10px}
    .find-prompt{font:900 clamp(1rem,2vw,1.25rem)/1.25 Nunito,sans-serif}
    .find-progress{font-weight:900;color:#a8386a;min-height:1.4em}
    .find-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
    .find-action{min-height:48px;border:2px solid #a8386a;border-radius:50px;background:#fff;color:#a8386a;
      padding:0 13px;font:900 .88rem Nunito,sans-serif;cursor:pointer}
    .find-action.primary{background:#a8386a;color:#fff}
    @media (orientation:portrait){
      .find-panel{width:100%;padding:8px 12px;display:none}
      body.find-picture-game .find-panel{display:grid;grid-template-columns:1fr auto;gap:5px 10px;text-align:left}
      .find-panel .find-actions{grid-column:2;grid-row:1 / span 2}.find-progress{grid-column:1}
    }
    /* ── The label PILL (owner, 2026-10-18): ONE pill per label, [speaker | word]. ──
       The separate round sentence buttons the controller QA'd on 2026-10-18 landed on
       the painted animals (goose body, beside the cow's legs) and doubled the pins on
       the plate, breaking the standing rule that a control never covers an object or a
       neighbour. The sentence control now lives INSIDE the label's own pill. The pill
       is deliberately COMPACT -- the dense posters (numbers trains, weekday strip)
       have 72-94px label pitches, so the icon cell adds only 13px to the pill: a 16px
       icon with 3px of pill on its left. The WORD TEXT stays exactly where the owner
       checked it: the whole pill is shifted left by half the growth
       (calc(-50% - 8.5px)), so nothing moves on the right of any label. The two tap
       zones are invisible 44px hotspots laid over the pill -- the sentence hotspot
       covers the icon cell and may reach 20px past the pill's left edge (empty plate;
       it must never reach the previous label's letters), the word hotspot starts at
       the first letter and covers the rest of the pill. A label without a sentence
       clip (the four held senses, and any poster without rendered sentences) is a
       plain word pill, pixel-for-pixel the pill shipped on 2026-10-15. */
    .poster-word{
      position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);z-index:2;
      display:inline-flex;align-items:center;gap:3px;padding:2px 7px;max-width:none;
      border:2px solid rgba(255,255,255,.96);border-radius:10px;background:rgba(255,253,245,.96);
      box-shadow:0 2px 0 rgba(89,53,72,.3);color:#5b3550;
      font-family:inherit;font-weight:900;font-size:clamp(.875rem,1.2vw,.95rem);line-height:1.05;
      text-align:center;white-space:nowrap;-webkit-tap-highlight-color:transparent;
    }
    .poster-word.has-sentence{gap:2px;padding:2px 4px 2px 2px;transform:translate(calc(-50% - 6.5px),-50%)}
    .poster-word-text{display:block}
    .poster-word-icon{width:12px;height:12px;flex:none;border-radius:50%;display:grid;place-items:center;
      background:#fffdf5;border:1px solid #a8386a;font-size:7px;line-height:1}
    .poster-word-icon::before{content:'🔊'}
    /* The invisible 44px hotspots. They carry the controls' data and states; the pill
       above them carries everything a child sees. The sentence hotspot ends at the
       first letter: a tap on any letter always plays the word. */
    .poster-word-hit{
      position:absolute;top:50%;transform:translateY(-50%);height:44px;min-width:44px;
      border:0;padding:0;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent;
    }
    .poster-word-hit:focus-visible{outline:4px solid #ffd54f;outline-offset:2px;border-radius:10px}
    /* --hit-split is the padding-box x where this pill's letters start, MEASURED per
       pill by layoutPosterHitSplits() (2026-10-18). The old hard-coded 22px assumed
       the 16px icon + 3px padding + 3px gap; the compact 12px pill moved the letters
       to 16px and the split silently stopped matching the render. The fallback is the
       current compact metrics (2px + 12px + 2px) so the hotspots are already right
       before the first measure pass and stay right if the measure pass never runs. */
    .poster-word-hit.say{left:var(--hit-split,16px);right:-2px;min-width:44px}
    .poster-word-hit.sentence{left:calc(var(--hit-split,16px) - 44px);width:44px}
    .poster-word:not(.has-sentence) .poster-word-hit.say{left:-2px;right:-2px;min-width:44px}
    /* A press must answer on the pill, not on the invisible hotspot the finger is
       actually on, and button :active cannot reach out of itself -- so pointerdown
       marks the pill (.press) and pointerup/cancel clear it. */
    .poster-word.press{box-shadow:0 0 0 rgba(89,53,72,.3)}
    .poster-word.press .poster-word-icon{transform:scale(.88)}
    /* A colour word or a Thai day colour (owner, 2026-10-15) outlines its own label. */
    .poster-word.outlined{border:3px solid var(--outline)}
    /* Round 4: a label tap only SPEAKS -- it never leaves the poster -- so the tap must
       never look silent. .speaking is the glow that holds while the word or sentence
       plays (the shared voice clears it on ended); .missed shakes and reddens when the
       clip would not load, the same contract as every .speak button. */
    .poster-word.speaking{
      border-color:#a8386a;background:#ffe9f1;color:#a8386a;
      box-shadow:0 2px 0 rgba(89,53,72,.3),0 0 0 4px rgba(216,58,106,.22);
    }
    .poster-word.missed{animation:nope .45s;border-color:#c5224f;color:#9d173c;box-shadow:none}
    .poster-word.missed .poster-word-icon{color:#9d173c;background:#fff0f3;border-color:#c5224f}
    .poster-word.missed .poster-word-icon::before{content:'✕'}
    @media (prefers-reduced-motion:reduce){.poster-word.missed{animation:none}}
    /* .echo is the pill's face while the outside list plays that word's sentence: the
       row being tapped is elsewhere, so this is the label answering on the plate. */
    .poster-word.echo{
      border-color:#a8386a;background:linear-gradient(160deg,#fff,#ffe9f1);color:#a8386a;
      box-shadow:0 2px 0 rgba(89,53,72,.3),0 0 0 4px rgba(216,58,106,.28);
    }
    .poster-word.speaking .poster-word-icon{background:#ffe9f1}
    .poster-pointers{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;overflow:visible}
    .poster-pointer{stroke:#fffdf5;stroke-width:1.1;stroke-linecap:round;filter:drop-shadow(0 1px 0 rgba(89,53,72,.55))}
    .poster-pointer-tip{fill:#fffdf5;stroke:rgba(89,53,72,.55);stroke-width:.35}

    /* The outside sentence list keeps its row speakers exactly as they were: a visible
       32px round icon in each row. (The on-plate pill icons are .poster-word-icon.) */
    .poster-sentence-icon{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
      background:#fffdf5;border:2px solid #a8386a;box-shadow:0 2px 0 rgba(89,53,72,.3);
      font-size:28px;line-height:1}
    .poster-sentence-icon::before{content:'🔊'}
    .poster-sentence-row:focus-visible{outline:4px solid #ffd54f;outline-offset:2px}
    .poster-sentence-row.speaking .poster-sentence-icon{
      background:#ffe9f1;box-shadow:0 2px 0 rgba(89,53,72,.3),0 0 0 4px rgba(216,58,106,.25)}
    .poster-sentence-row.missed .poster-sentence-icon{
      color:#9d173c;background:#fff0f3;border-color:#c5224f;box-shadow:none}
    .poster-sentence-row.missed .poster-sentence-icon::before{content:'✕'}
    .poster-sentence-list{flex:none;width:min(330px,34vw);display:flex;flex-direction:column;justify-content:center;gap:7px;padding:8px;
      border-radius:22px;background:rgba(255,249,238,.88);box-shadow:inset 0 0 0 3px rgba(255,255,255,.75),0 8px 22px rgba(35,16,31,.14)}
    .poster-sentence-row{min-height:52px;border:3px solid #f0dcea;border-radius:16px;background:#fffdf5;padding:3px 7px;
      display:flex;align-items:center;gap:8px;color:#5b3550;font:800 clamp(.78rem,1.45vw,.98rem)/1.2 Nunito,sans-serif;text-align:left;cursor:pointer;
      box-shadow:0 3px 0 rgba(89,53,72,.18);-webkit-tap-highlight-color:transparent}
    .poster-sentence-row .poster-sentence-icon{flex:0 0 32px}
    .poster-sentence-row mark{background:#ffe08a;color:#5b3550;border-radius:5px;padding:0 3px;font-weight:1000}
    .poster-sentence-row:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(89,53,72,.18)}
    /* Landscape keeps the plate at least 60% of the body, so the list never widens
       past the single-column width; from seven sentences up the rows split into two
       columns so 7-12 sentence posters still fit the 491px landscape body height. */
    .poster-sentence-list.dense{width:min(330px,34vw);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
      align-content:center;gap:5px;padding:6px}
    .poster-sentence-list.dense .poster-sentence-row{min-height:44px;font-size:clamp(.7rem,1.25vw,.84rem);gap:5px;padding:3px 6px}
    @media (orientation:portrait){
      .poster-sentence-list{width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:7px}
      .poster-sentence-row{min-height:48px;font-size:clamp(.72rem,2vw,.9rem)}
      /* Portrait lays the list under the plate, and every plate percentage was placed
         on the tall strip-era stage -- so from seven sentences up the rows use three
         columns to keep the list low and the plate as large as the chips strip left it. */
      .poster-sentence-list.dense{width:100%;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;padding:7px}
      .poster-sentence-list.dense .poster-sentence-row{min-height:48px;font-size:clamp(.7rem,1.9vw,.88rem);gap:5px;padding:3px 6px}
    }

    /* ── The strip of small cards (owner, 2026-10-13) ──
       One icon card per word on the poster, in the poster's order: a small square of
       the word's own card picture with the word under it. Tapping one plays that
       word's SENTENCE clip and the matching label answers on the plate (.echo above).
       The grid shape is chosen by sizePosterStrip() from the real measured box, so the
       whole strip is on screen beside (or under) the plate at both iPad orientations;
       the CSS here is only the no-measurement fallback and MUST keep the same cell
       metrics (68px cell, 82px row, 5px gap, 6px padding) as that function. Cells are
       at least 64 CSS px in both axes -- the page's tablet tap floor. No card is ever
       a dashed placeholder: only words whose letter is enabled get one, exactly like
       the labels, and a word with no playable clip at all gets none. */
    .poster-strip{
      flex:none;display:grid;
      grid-template-columns:repeat(var(--cols,3),var(--cell-w,68px));grid-auto-rows:var(--cell-h,82px);gap:5px;
      padding:6px;align-content:center;justify-content:center;
      border-radius:22px;background:rgba(255,249,238,.82);
      box-shadow:inset 0 0 0 3px rgba(255,255,255,.75),0 8px 22px rgba(35,16,31,.14);
    }
    .poster-chip{
      min-width:64px;min-height:64px;border:3px solid #f0dcea;border-radius:16px;
      background:#fffdf5;padding:3px 0;cursor:pointer;overflow:hidden;
      display:flex;flex-direction:column;align-items:stretch;gap:2px;
      font:inherit;color:#5b3550;-webkit-tap-highlight-color:transparent;
      box-shadow:0 3px 0 rgba(89,53,72,.18);transition:transform .1s;
    }
    .poster-chip:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(89,53,72,.18)}
    .poster-chip:focus-visible{outline:4px solid #ffd54f;outline-offset:2px}
    .poster-chip-pic{flex:1;min-height:0;margin:0 3px;border-radius:10px;overflow:hidden;background:#f6ead9}
    .poster-chip-pic img{width:100%;height:100%;object-fit:cover;display:block}
    .poster-chip-word{
      flex:none;font-weight:900;font-size:.66rem;line-height:1.15;
      text-align:center;white-space:nowrap;overflow:hidden;
    }
    .poster-chip.speaking{border-color:#a8386a;box-shadow:0 3px 0 rgba(89,53,72,.18),0 0 0 4px rgba(216,58,106,.25)}
    .poster-chip.missed{border-color:#d9c3cf;box-shadow:none;animation:nope .45s}
    @media (prefers-reduced-motion:reduce){.poster-chip.missed{animation:none}}
    /* Narrow viewports only narrow the labels a little; the >=16px text floor from
       .poster-word itself is never overridden, and the stage needs no case of its own:
       the container-unit sizing already fits any width. */
    @media(max-width:820px){.poster-word{max-width:none}}
    @media(max-width:520px){.poster-stage{border-radius:20px}.poster-word{max-width:none;padding:0}}
    .pic{
      aspect-ratio:4/3;background:#faf0f6;
      display:flex;align-items:center;justify-content:center;overflow:hidden;
    }
    .pic img{width:100%;height:100%;object-fit:cover;display:block}
    /* A concept whose picture has not been drawn yet. This state NEVER SHIPS -- the owner
       decided on 2026-09-09 that Our Dictionary does not publish until all current concepts
       are illustrated, and check-word-data.py prints the remaining count every run. It
       exists so the corpus can be reviewed now, and it says nothing to a child because no
       child will see it. */
    .pic.todo{background:repeating-linear-gradient(45deg,#faf0f6,#faf0f6 10px,#f4e4ee 10px,#f4e4ee 20px)}
    .pic.todo span{font-weight:900;font-size:.72rem;color:#c9a8bb;letter-spacing:.04em}

    .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px}
    .word{font-family:'Fredoka One',Nunito,sans-serif;font-size:1.5rem;line-height:1.1;color:#3a1e33}
    /* Thai sits DIRECTLY under the English, which is where a reader who can already read
       Thai looks for it -- animal-book/DECISIONS.md 3, applied here. Its own font stack
       because the self-hosted Nunito is latin and latin-ext only and has no Thai glyphs;
       Thonburi is the one the iPad supplies. Printed, never spoken: there is no Thai audio
       anywhere in this project and none is planned (AUDIO-DIRECTION.md 4). */
    .thai{
      font-family:"Noto Sans Thai","Thonburi",ui-rounded,system-ui,sans-serif;
      font-size:1.05rem;font-weight:700;color:#a8386a;line-height:1.35;
    }
    /* An example, not a definition. The owner's brief: "example sentences instead of
       formal definitions". */
    .eg{font-size:.9rem;font-weight:700;color:#6b5260;line-height:1.4;margin-top:2px}

    /* ── Hear it ──
       Every card that has a clip carries one round speaker directly under its word.
       64px, the same size as the A-Z buttons, so it clears a finger on the target iPad.
       Still the word's own control, not the sentence's: the clip says the headword, and
       a child who cannot read the sentence yet can still find the thing that speaks.
       Tapping while
       it speaks starts the word again from the top -- repeating a word is what a child
       practising it wants.
       Two states a child can see: `.speaking` (filled, while the word plays) and
       `.missed` (the clip did not load -- offline and never heard before, or a file
       gone). A missed tap shakes the button and swaps the sound waves for a cross, and
       the button stays live so the next tap tries again. It never goes quiet, and it
       never dims into something that looks tappable and does nothing.
       A card listed in word-audio.js UNRENDERED has no speaker at all -- a speaker that
       can only fail is a dead tap. That table is empty since 2026-09-22 (the eight
       homograph senses were rendered), so every card speaks its word. */
    /* THE WORD OWNS A FULL-WIDTH LINE (controller QA round 2, 2026-10-15). Round 1 kept
       the word beside the two 64px controls, which left it a ~42px column at 768x1024:
       every word sat on the shrink floor and the longest still clipped ("zebr",
       "zooke"). So the card body runs word, then the control row, then Thai. A headword
       may wrap only at a real space; single-token words -- including hyphenated words
       such as hide-and-seek -- stay intact, and the measured fit pass below steps only a
       word wider than the whole card line down to 70% of this normal size. */
    .word{overflow-wrap:normal;word-break:normal;hyphens:none}
    .word-text.single-token{white-space:nowrap}
    .word-letter{border-radius:.28em;padding:0 .02em;transition:background .12s,color .12s,box-shadow .12s}
    .word.current-word .word-letter{background:#ffd54f;box-shadow:0 0 0 2px #ffd54f}
    .word-letter.current{background:#ffd54f;color:#3a1e33;box-shadow:0 0 0 3px #fff,0 0 0 6px #ef9f23}
    /* The control row under the word: left-aligned so it reads as the word's own row,
       and its buttons keep their fixed tap sizes (below) -- this row never sizes the
       headword again. Omitted entirely on a card with no clip: no dead controls, and no
       empty gap where the row would have been. */
    .word-actions{display:flex;align-items:center;justify-content:flex-start;gap:8px;margin-top:4px}
    .speak{
      flex:none;width:64px;height:64px;border-radius:50%;cursor:pointer;
      display:inline-flex;align-items:center;justify-content:center;padding:0;
      border:2.5px solid #e59bbb;background:linear-gradient(135deg,#fff,#ffe9f1);
      color:#a8386a;box-shadow:0 4px 0 #e59bbb;
      -webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:transform .1s;
    }
    .speak:active{transform:translateY(3px);box-shadow:0 1px 0 #e59bbb}
    .speak:focus-visible{outline:4px solid #ffd54f;outline-offset:3px}
    .speak svg{width:26px;height:26px;flex:none;pointer-events:none}
    .speak .no{display:none}
    .speak.speaking{background:linear-gradient(160deg,#d4739a,#a8386a);color:#fff;border-color:#a8386a}
    .speak.missed{color:#9b7a8a;border-color:#d9c3cf;box-shadow:0 4px 0 #d9c3cf;animation:nope .45s}
    .speak.missed .waves{display:none}
    .speak.missed .no{display:inline}
    @keyframes nope{
      0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)}
      60%{transform:translateX(-4px)} 80%{transform:translateX(4px)}
    }
    @media (prefers-reduced-motion:reduce){.speak.missed{animation:none}}

    /* ── Hear the sentence ──
       The example sentence's own speaker (owner spec, 2026-09-22): a second, independent
       clip, audio/sentences/<sense>.m4a, resolved by sentence-audio.js. It must never be
       mistaken for the word speaker, so it differs in every way a child sees: it sits
       BESIDE THE SENTENCE (not the word), it is a rounded SQUARE in the soft card colours
       (not the round pink button), and its icon is a SPEECH BUBBLE with lines of talk
       (not a loudspeaker). 64px square, matching the page's tablet tap floor.
       It shares the one voice and every state with the word speaker -- `.speaking`,
       `.missed`, shake, cross, retry -- because it IS a .speak button: tapping the
       sentence stops the word and tapping the word stops the sentence.
       A card whose sentence has no clip, or whose clip says an older wording, shows no
       sentence speaker at all (sentence-audio.js clipFor() is null): a speaker that
       could only fail is a dead tap. None is rendered yet, so none shows yet. */
    .egline{display:flex;align-items:flex-start;gap:8px;margin-top:2px}
    .egline .eg{flex:1;min-width:0;margin-top:0;padding-top:4px}
    .speak.eg-speak{
      width:64px;height:64px;border-radius:16px;
      border-color:#d9bfd0;background:#f7eef4;color:#8a5c76;box-shadow:0 3px 0 #d9bfd0;
    }
    .speak.eg-speak:active{box-shadow:0 1px 0 #d9bfd0}
    .speak.eg-speak svg{width:28px;height:28px}
    .speak.eg-speak.speaking{background:linear-gradient(160deg,#b98aa5,#8a5c76);color:#fff;border-color:#8a5c76}

    /* Spell is deliberately not another round speaker: its letter tiles and short label
       tell a child that this control does something different. It keeps the same 64px
       tap floor and shares the ONE action row under the word with Hear, so it adds no
       row of its own. */
    .spell{
      min-width:76px;height:64px;padding:5px 9px;border-radius:16px;border:2.5px solid #6d8dc9;
      background:linear-gradient(135deg,#f7fbff,#e5efff);color:#36598e;box-shadow:0 4px 0 #6d8dc9;
      display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
      font:900 .72rem 'Nunito',sans-serif;cursor:pointer;touch-action:manipulation;
      -webkit-tap-highlight-color:transparent;
    }
    .spell-icon{font-family:'Fredoka One',Nunito,sans-serif;font-size:1.05rem;line-height:1;letter-spacing:.04em}
    .spell:active{transform:translateY(3px);box-shadow:0 1px 0 #6d8dc9}
    .spell:focus-visible{outline:4px solid #ffd54f;outline-offset:3px}
    .spell.speaking{background:linear-gradient(160deg,#7ba3e4,#466aa5);color:#fff;border-color:#36598e}
    .spell.missed{animation:nope .45s;color:#756d72;border-color:#bcb4b9;box-shadow:0 4px 0 #bcb4b9}

    /* ── One word, several senses (a merged card; data `groups`) ──
       Each sense sits under the headword as its own block: a part-of-speech tag, then the
       same Thai line and sentence (with its own sentence speaker) a one-sense card has. A
       dashed rule between blocks, so two sentences never read as one paragraph. The tag is
       a quiet pill, not a button -- nothing about it is tappable, so nothing about it may
       look tappable. */
    .senses{list-style:none;display:flex;flex-direction:column;gap:10px;margin-top:2px}
    .sense{display:flex;flex-direction:column;gap:4px}
    .sense + .sense{padding-top:10px;border-top:2px dashed #f0dcea}
    .pos{
      align-self:flex-start;padding:2px 10px;border-radius:50px;
      background:#f7eef4;color:#8a5c76;border:2px solid #efdce8;
      font-weight:900;font-size:.78rem;letter-spacing:.03em;line-height:1.3;
    }
    .explore{margin-top:10px;padding-top:9px;border-top:2px solid #f5e6ef}
    .explore-label{font-size:.78rem;font-weight:900;color:#8a5c76;margin-bottom:6px}
    .explore-links{display:flex;flex-wrap:wrap;gap:7px}
    .collection-link{
      min-height:64px;padding:8px 13px;border-radius:16px;border:2.5px solid #dfbfd1;
      background:#fff5fa;color:#8a3f67;font:900 .82rem 'Nunito',sans-serif;
      cursor:pointer;text-align:left;touch-action:manipulation;display:inline-flex;align-items:center;
    }

    .none{
      grid-column:1/-1;text-align:center;padding:50px 20px;
      font-weight:900;font-size:1.1rem;color:#a8386a;
    }
    .count{
      margin:0 0 12px;font-weight:800;font-size:.85rem;color:#8a5c76;
    }

    @media (max-width:560px){
      h1{font-size:1.1rem;width:100%;order:3;margin:0}
      .find{order:4;flex-basis:100%}
      .mode-switch button{min-width:0;flex:1;padding-inline:10px}
      .grid.collections{grid-template-columns:1fr}
    }
  </style>
</head>
<body>

<div class="topbar">
<div class="bar">
  <a class="back" href="index.html" aria-label="Back to Our Word Book">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      <path d="M15 5 8 12l7 7"/>
    </svg>
    <span>Our Word Book</span>
  </a>
  <h1>Our Dictionary</h1>
  <label class="find">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true" focusable="false">
      <circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/>
    </svg>
    <input id="q" type="search" placeholder="Find a word" autocomplete="off"
           enterkeyhint="search" aria-label="Find a word"/>
    <button class="clear" id="clear" type="button" hidden aria-label="Clear">✕</button>
  </label>
</div>

<div class="mode-switch" role="group" aria-label="Browse the dictionary">
  <button id="modeAZ" type="button" aria-pressed="true">A–Z</button>

</div>
<nav class="az" id="az" aria-label="Choose a letter"></nav>
</div>

<main>
  <section class="collection-heading" id="collectionHeading" hidden aria-live="polite">
    <button class="all-groups" id="allGroups" type="button">← All groups</button>
    <span class="collection-icon" id="collectionIcon" aria-hidden="true"></span>
    <h2 class="collection-title" id="collectionTitle"></h2>
    <p class="collection-copy" id="collectionCopy"></p>
    <div class="subgroup-filters" id="subgroupFilters" role="group" aria-label="Filter this word group" hidden></div>
  </section>
  <p class="count" id="count"></p>
  <div class="grid" id="grid"></div>
</main>

<script src="word-audio.js?v=d6b07ff2a-20261018203724"></script>
<script src="sentence-audio.js?v=d6b07ff2a-20261018203724"></script>
<script src="spelling.js?v=d6b07ff2a-20261018203724"></script>
<script src="audio-wake.js?v=d6b07ff2a-20261018203724"></script>
<script>
(function () {
  'use strict';

  var ALL_LETTERS = 'abcdefghijklmnopqrstuvwxyz'.split('');
  var enabledLetters = null;
  var cards = [], letter = null, query = '';
  var mode = 'az', selectedCollection = null, selectedSubgroup = null;
  var posters = [], selectedPoster = null, rowBySense = {};
  var findPictureByPoster = {}, findGame = null, findMissed = {}, findLast = {};
  var collections = [], collectionById = {}, subgroupById = {};
  var restoredState = readState(), scrollByView = restoredState.scrollByView || {};
  if (restoredState.mode === 'collections' || restoredState.mode === 'posters') mode = restoredState.mode;
  /* ?mode=posters (or collections / az) opens that view directly -- the Test Hub "Posters"
     card links here so the owner lands on the posters, not the Word Book hub (2026-10-15). */
  (function () {
    var m = /[?&]mode=(az|collections|posters)(?:&|$)/.exec((window.location && window.location.search) || '');
    if (m) mode = m[1];
  })();
  if (typeof restoredState.collection === 'string') selectedCollection = restoredState.collection;
  if (typeof restoredState.subgroup === 'string') selectedSubgroup = restoredState.subgroup;
  if (typeof restoredState.poster === 'string') selectedPoster = restoredState.poster;

  function lettersFor() { return enabledLetters || ALL_LETTERS; }
  function firstLetter(word) { return String(word).charAt(0).toLowerCase(); }

  function loadLetters() {
    return fetch('data/letters.json')
      .then(function (r) { return r.json(); })
      .then(function (cfg) {
        var list = (cfg && cfg.enabled) || [];
        enabledLetters = list.map(function (l) { return String(l).toLowerCase(); });
        if (!enabledLetters.length) enabledLetters = ALL_LETTERS;
      })
      .catch(function () {
        // Fallback: if letters.json is missing or unreadable, show every letter. This keeps a
        // fresh checkout or a build without the gate file usable, and it is the pre-gate behaviour.
        enabledLetters = ALL_LETTERS;
      });
  }

  function filterData(d) {
    var allowed = {};
    lettersFor().forEach(function (l) { allowed[l] = true; });
    d.rows = (d.rows || []).filter(function (r) { return allowed[firstLetter(r[0])]; });
    d.groups = (d.groups || []).filter(function (g) { return allowed[firstLetter(g.word)]; });
  }
  var grid = document.getElementById('grid');
  var count = document.getElementById('count');
  var az = document.getElementById('az');
  var q = document.getElementById('q');
  var clear = document.getElementById('clear');
  var modeAZ = document.getElementById('modeAZ');
  var modeCollections = document.getElementById('modeCollections');
  var modePosters = document.getElementById('modePosters');
  var collectionHeading = document.getElementById('collectionHeading');
  var allGroups = document.getElementById('allGroups');
  var collectionIcon = document.getElementById('collectionIcon');
  var collectionTitle = document.getElementById('collectionTitle');
  var collectionCopy = document.getElementById('collectionCopy');
  var subgroupFilters = document.getElementById('subgroupFilters');

  function readState() {
    try { return JSON.parse(window.sessionStorage.getItem('word-book-dictionary-view') || '{}'); }
    catch (e) { return {}; }
  }
  function viewKey() {
    if (mode === 'collections') return 'collections:' + (selectedCollection || 'all') + ':' + (selectedSubgroup || 'all');
    if (mode === 'posters') return 'posters:' + (selectedPoster || 'all');
    return 'az:' + (letter || 'a');
  }
  function rememberScroll() {
    var y = Number(window.scrollY || window.pageYOffset || 0);
    scrollByView[viewKey()] = y;
  }
  function saveState() {
    try {
      window.sessionStorage.setItem('word-book-dictionary-view', JSON.stringify({
        mode: mode, collection: selectedCollection, subgroup: selectedSubgroup, poster: selectedPoster, letter: letter,
        scrollByView: scrollByView
      }));
    } catch (e) {}
  }
  function scrollTopNow() { window.scrollTo({ top: 0, behavior: 'smooth' }); }
  function restoreScroll() {
    var y = Number(scrollByView[viewKey()] || 0);
    if (y) window.setTimeout(function () { window.scrollTo({ top: y, behavior: 'auto' }); }, 0);
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function collectionIconMarkup(c) {
    return '<img class="owner-group-icon" src="' + esc(c.icon_path) + '?v=d6b07ff2a-20261018203724" alt="" ' +
      'data-fallback="' + esc(c.icon) + '" draggable="false">';
  }
  document.addEventListener('error', function (event) {
    var image = event.target;

      wordNode.classList.add('current-word');
      playOwned(btn.getAttribute('data-word-clip'), generation, function () {
        wordNode.classList.remove('current-word'); finish();
      }, function () {
        wordNode.classList.remove('current-word'); btn.classList.add('missed'); finish();
      });
    }
    nextLetter();
  }
  grid.addEventListener('click', function (e) {
    if (e.target.closest('[data-find-exit]')) { exitFindGame(); return; }
    if (e.target.closest('[data-find-start]')) { startFindGame(); return; }
    if (e.target.closest('[data-find-repeat]')) { repeatFind(); return; }
    var findTargetHit = e.target.closest('[data-find-target]');
    if (findTargetHit) { answerFind(findTargetHit.getAttribute('data-find-target')); return; }
    var posterChoice = e.target.closest('[data-poster]');
    if (posterChoice) { selectedPoster = posterChoice.getAttribute('data-poster'); render(); saveState(); scrollTopNow(); return; }
    if (e.target.closest('[data-all-posters]')) { selectedPoster = null; render(); saveState(); scrollTopNow(); return; }
    var posterWordButton = e.target.closest('[data-poster-sense]');
    if (posterWordButton) {
      /* Round 4 (owner, 2026-10-13): a word tap only SPEAKS. It plays the same clip
         the card's word speaker plays, the poster stays exactly where it is, and the
         sentence lives in the pill's icon cell and the outside list. The tap always
         answers visibly: .press is the press, .speaking holds a glow on the pill while
         the word plays, .missed shakes if the clip would not load. */
      if (posterWordButton.getAttribute('data-clip')) say(posterWordButton);
      setEcho(null);
      return;
    }
    var sentenceButton = e.target.closest('[data-poster-sentence]');
    if (sentenceButton) {
      say(sentenceButton);
      var sentenceSense = sentenceButton.getAttribute('data-poster-sentence');
      /* Tapping the pill's own icon cell: the pill is already .speaking, so it needs
         no echo of itself. Tapping an outside row: the row plays and its label
         answers on the plate. */
      setEcho(sentenceButton.classList.contains('poster-word-hit') ? null : posterLabelPill(sentenceSense));
      return;
    }
    var chip = e.target.closest('[data-chip-sense]');
    if (chip) {
      say(chip);
      setEcho(posterLabelPill(chip.getAttribute('data-chip-sense')));
      return;
    }
    var collectionButton = e.target.closest('[data-collection]');
    if (collectionButton) { chooseCollection(collectionButton.getAttribute('data-collection')); return; }
    var spellButton = e.target.closest('button.spell');
    if (spellButton) { spell(spellButton); return; }
    var b = e.target.closest('button.speak');
    if (b) say(b);
  });
  /* Press feedback for the poster pills: the finger lands on an invisible hotspot, so
     button :active can only style the hotspot. pointerdown marks the visible pill and
     the next pointerup/pointercancel (or leaving the poster view) clears it. */
  function clearPillPress() {
    var pressed = grid.querySelectorAll('.poster-word.press');
    for (var i = 0; i < pressed.length; i++) pressed[i].classList.remove('press');
  }
  grid.addEventListener('pointerdown', function (e) {
    clearPillPress();
    var pill = e.target.closest('.poster-word');
    if (pill) pill.classList.add('press');
  });
  window.addEventListener('pointerup', clearPillPress);
  window.addEventListener('pointercancel', clearPillPress);

  count.textContent = 'Opening the book…';

  /* The sentence ledger is fetched beside the data and is allowed to fail: without it the
     book still opens, with word speakers only. */
  var ledgerLoad = SA
    ? fetch(SA.LEDGER).then(function (r) { return r.json(); }).then(null, function () { return null; })
    : Promise.resolve(null);

  loadLetters().then(function () {
    if (restoredState.letter && lettersFor().indexOf(restoredState.letter) > -1) letter = restoredState.letter;
    if (letter === null) letter = lettersFor()[0];
    return Promise.all([
      fetch('data/dictionary.json').then(function (r) { return r.json(); }),
      ledgerLoad,
      fetch('data/posters.json').then(function (r) { return r.json(); }),
      fetch('data/find-picture-bank.json').then(function (r) { return r.json(); }).catch(function () { return { posters: [] }; })
    ]);
  }).then(function (values) {
    var d = values[0];
    ledger = values[1];
    var posterData = values[2] || {};
    (values[3].posters || []).forEach(function (poster) { findPictureByPoster[poster.poster_id] = poster; });
    probeFindLines();
    posters = scopePosters(posterData.posters || [], posterData.live || []);
    filterData(d);
    (d.rows || []).forEach(function (r) { rowBySense[r[1]] = r; });
    /* The full dictionary source remains owned by held PR #1352. These four rows make
       only this held poster candidate complete, using the same final sense IDs; they
       must not leak into A-Z search or collection cards ahead of that held merge. */
    (posterData.held_rows || []).forEach(function (r) {
      if (lettersFor().indexOf(String(r[0]).charAt(0).toLowerCase()) > -1) rowBySense[r[1]] = r;
    });
    collections = d.collections || [];
    collections.forEach(function (c) {
      collectionById[c.id] = c;
      (c.subgroups || []).forEach(function (s) {
        subgroupById[s.id] = { collection: c.id, label: s.label };
      });
    });
    if (!collectionById[selectedCollection]) selectedCollection = null;
    if (!selectedCollection || !subgroupById[selectedSubgroup] ||
        subgroupById[selectedSubgroup].collection !== selectedCollection) selectedSubgroup = null;
    cards = alphabetical(buildCards(d));
    buildAZ();
    render();
    saveState();
    restoreScroll();
  }).catch(function () {
    /* Says what a child can do about it, and does not explain itself. */
    grid.innerHTML = '<p class="none">The book did not open. Try again in a moment.</p>';
    count.textContent = '';
  });

  window.addEventListener('pagehide', function () { if (findGame) exitFindGame(); else hush(); rememberScroll(); saveState(); });
  document.addEventListener('visibilitychange', function () { if (document.hidden) { if (findGame) exitFindGame(); else hush(); } });
  /* Rotation re-shapes the strip against the new box; outside the poster view the
     function finds nothing and does nothing. */
  window.addEventListener('resize', function () { sizePosterStrip(); scheduleWordFit(); layoutPosterHitSplits(); });
  window.addEventListener('orientationchange', scheduleWordFit);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(scheduleWordFit);

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      Promise.resolve() /* Test Hub staging: no service worker */.catch(function () {});
    });
  }
})();
</script>
