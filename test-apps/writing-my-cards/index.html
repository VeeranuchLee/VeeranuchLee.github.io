<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#efe7d8" />
    <meta name="description" content="Hear a word, watch how each letter is written, trace it on a piece of writing paper, and fill your sticker book." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Writing Book" />
    <title>Writing Book</title>
    <link rel="stylesheet" href="./styles.css?v=801ab130a-20261021123656" />
  </head>
  <body>
    <main id="screen"></main>

    <!-- Zoom fix C (2026-09-25, owner: "pick the method that most likely to work well").
         First, before any app script, because it is a document-level listener and must be
         in place before the book starts handling taps. It stops the ZOOM of a second
         quick tap and re-delivers that tap; a multi-finger pinch is never touched, so a
         child who is zoomed in can always pinch back out. It is NOT a gesturestart
         handler and must never become one: a document-level pinch blocker is the banned
         pattern in INTERACTION-DIRECTION.md. -->

    <!-- Load order matters. letters.js is the geometry every other file reads;
         strokes.js reads it at call time, app.js at startup. -->
    <script src="./tap-zoom-guard.js?v=801ab130a-20261021123656"></script>
    <script src="./letters.js?v=801ab130a-20261021123656"></script>
    <script src="./strokes.js?v=801ab130a-20261021123656"></script>
    <script src="./words.js?v=801ab130a-20261021123656"></script>
    <script src="./sentences.js?v=801ab130a-20261021123656"></script>
    <script src="./audio-wake.js?v=801ab130a-20261021123656"></script>
    <script src="./sound.js?v=801ab130a-20261021123656"></script>
    <script src="./vocab.js?v=801ab130a-20261021123656"></script>
    <!-- The My cards tray (owner, 2026-10-21: "import cards ... and able to start
         any of the three activities"). dictionary-cards.js is GENERATED by
         tools/build-card-snapshot.py from word-book/data/dictionary.json and held
         to it by tools/check-card-snapshot.py -- regenerate rather than edit. It
         comes first so my-cards.js can join the tray's saved words against it at
         load, and both come after sound.js/words.js, whose globals they read. -->
    <script src="./dictionary-cards.js?v=801ab130a-20261021123656"></script>
    <script src="./my-cards.js?v=801ab130a-20261021123656"></script>
    <script src="./app.js?v=801ab130a-20261021123656"></script>
    <script>
      /* Offline support. Best-effort on purpose: opened straight off the filesystem
         the browser refuses to register a worker, and the book must still work. */
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          Promise.resolve() /* Test Hub staging: no service worker */.catch(function () {});
        });
      }
    </script>
  </body>
</html>
