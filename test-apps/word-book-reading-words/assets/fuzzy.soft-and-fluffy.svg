<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Picture to come for fuzzy"><defs><pattern id="s" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="28" height="28" fill="#faf0f6"/><rect width="14" height="28" fill="#f4e4ee"/></pattern></defs><rect width="800" height="600" fill="url(#s)"/><text x="400" y="92" text-anchor="middle" font-family="Nunito, sans-serif" font-size="30" font-weight="900" letter-spacing="3" fill="#c9a8bb">PICTURE TO COME</text><text x="400" y="170" text-anchor="middle" font-family="Nunito, sans-serif" font-size="27" font-weight="700" fill="#8a5c76">A comet seen through a telescope, with a</text><text x="400" y="208" text-anchor="middle" font-family="Nunito, sans-serif" font-size="27" font-weight="700" fill="#8a5c76">soft blurry cloud of light around it; no</text><text x="400" y="246" text-anchor="middle" font-family="Nunito, sans-serif" font-size="27" font-weight="700" fill="#8a5c76">text.</text></svg>