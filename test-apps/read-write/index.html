<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Read &amp; Write</title>
<link rel="stylesheet" href="./css/app.css">
<!-- INTERACTION-DIRECTION.md method C, layer 3: byte-identical copy of maze-app/js/tap-zoom-guard.js -->
<script src="./js/tap-zoom-guard.js"></script>
</head>
<body>
<section class="screen map" id="map" hidden>
  <header class="map-head">
    <div class="map-title">
      <h1>Read &amp; Write</h1>
      <p class="map-sub">A little reading and writing every day</p>
    </div>
    <div class="tally" aria-label="Days finished">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 4 l6 13 l14 1.5 l-10.5 9.5 l3 14 l-12.5 -7 l-12.5 7 l3 -14 l-10.5 -9.5 l14 -1.5 z"/></svg>
      <span id="tally">0 / 20</span>
    </div>
    <button class="btn primary go" id="go-next" type="button">Start</button>
  </header>
  <div class="trail" id="trail">
    <svg class="trail-path" id="trail-path" aria-hidden="true"></svg>
    <ol class="stops" id="stops"></ol>
  </div>
  <footer class="map-foot">
    <button class="btn quiet" id="reset" type="button">Start over</button>
  </footer>
  <p class="toast" id="map-toast" role="status"></p>
</section>

<section class="screen lesson" id="lesson" hidden>
  <header class="lesson-head">
    <button class="btn icon home" id="home" type="button" aria-label="Back to the journey">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M6 12 l11 -4 l14 5 l11 -4 v27 l-11 4 l-14 -5 l-11 4 z"/><path d="M17 8 v27 M31 13 v27"/></svg>
    </button>
    <div class="lesson-title">
      <span class="day-chip" id="day-chip">Day 1</span>
      <h2 id="lesson-title"></h2>
    </div>
    <ol class="steps" id="steps" aria-label="Steps"></ol>
  </header>
  <main class="stage" id="stage"></main>
  <footer class="lesson-foot" id="foot"></footer>
</section>

<p class="load-error" id="load-error" hidden>The lessons could not be opened.</p>

<script src="./js/audio-ids.js"></script>
<script src="./js/audio.js"></script>
<script src="./js/store.js"></script>
<script src="./js/write-pad.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
