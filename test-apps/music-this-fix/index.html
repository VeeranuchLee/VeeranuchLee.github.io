<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music Book: the opening "This"</title>
<style>
  :root { --bg: #f7f4ff; --card: #fff; --ink: #2d2640; --muted: #6b6480; --accent: #7a5cff; }
  html, body { touch-action: manipulation; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 24px; margin: 0 0 6px; }
  p.lead { color: var(--muted); margin: 0 0 18px; }
  h2 { font-size: 18px; margin: 28px 0 10px; }
  .clip { background: var(--card); border-radius: 14px; padding: 12px 14px; margin: 0 0 10px;
          box-shadow: 0 2px 8px #2d264014; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .clip .text { flex: 1 1 260px; }
  .clip .boost { color: var(--muted); font-size: 14px; }
  button { font: inherit; border: 0; border-radius: 999px; padding: 10px 18px; min-width: 96px;
           background: #ece7ff; color: var(--ink); cursor: pointer; }
  button.after { background: var(--accent); color: #fff; }
  button.playing { outline: 3px solid #ffcf40; }
</style>
</head>
<body>
<main>
  <h1>Does the song name start with “This”?</h1>
  <p class="lead">Each title sentence should start with a clear “This”. The first ten are the
    quietest ones before the fix: tap <b>Before</b>, then <b>After</b>. Everything below is the
    fixed version of every clip.</p>
  <h2>Before and after (the 10 quietest)</h2>
  <div id="ab"></div>
  <h2>Every title sentence, fixed</h2>
  <div id="all"></div>
</main>
<script src="listen-data.js"></script>
<script>
  const audio = new Audio();
  let current = null;

  function play(src, button) {
    if (current) current.classList.remove("playing");
    audio.pause();
    audio.src = src;
    audio.currentTime = 0;
    audio.play().catch(() => {});
    current = button;
    button.classList.add("playing");
  }
  audio.addEventListener("ended", () => { if (current) current.classList.remove("playing"); });

  function row(clip, withBefore) {
    const el = document.createElement("div");
    el.className = "clip";
    const text = document.createElement("div");
    text.className = "text";
    text.textContent = clip.sentence;
    if (clip.openingBoostDb > 0) {
      const boost = document.createElement("div");
      boost.className = "boost";
      boost.textContent = "“This” raised by " + clip.openingBoostDb.toFixed(1) + " dB";
      text.appendChild(boost);
    }
    el.appendChild(text);
    if (withBefore) {
      const before = document.createElement("button");
      before.textContent = "Before";
      before.addEventListener("click", () => play("before/" + clip.file, before));
      el.appendChild(before);
    }
    const after = document.createElement("button");
    after.className = "after";
    after.textContent = withBefore ? "After" : "Play";
    after.addEventListener("click", () => play("audio/titles/sentences/" + clip.file, after));
    el.appendChild(after);
    return el;
  }

  const clips = window.LISTEN_CLIPS || [];
  const abList = clips.filter((c) => c.ab);
  abList.forEach((c) => document.getElementById("ab").appendChild(row(c, true)));
  clips.forEach((c) => document.getElementById("all").appendChild(row(c, false)));
</script>
</body>
</html>
