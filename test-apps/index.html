<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Test Hub</title>
  <style>
    *{box-sizing:border-box}
    html,body{touch-action:manipulation}
    body{margin:0;min-height:100svh;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#25343b;background:radial-gradient(circle at 20% 10%,#fff9d9 0 8%,transparent 34%),linear-gradient(145deg,#d9f5ee,#e7e1ff 58%,#ffe8cf);background-attachment:fixed;padding:clamp(16px,4vw,44px)}
    main{width:min(1100px,100%);margin:auto}
    .eyebrow{font-weight:900;letter-spacing:.13em;text-transform:uppercase;color:#63747a;font-size:.72rem}
    h1{margin:.2rem 0 .4rem;font-size:clamp(2rem,6vw,3.2rem);line-height:.95;color:#243d52}
    header p{max-width:40rem;font-size:1.05rem;line-height:1.5;color:#506269;margin:0 0 8px}
    .status-line{font-weight:700;color:#3d5260;margin:0 0 26px}
    .group{margin:0 0 34px}
    .group>h2{display:flex;align-items:baseline;gap:10px;font-size:1.35rem;margin:0 0 4px;color:#243d52}
    .group>h2 .count{font-size:.95rem;font-weight:800;color:#63747a}
    .group>p{margin:0 0 14px;color:#63747a;font-size:.95rem}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
    .card{display:flex;flex-direction:column;gap:10px;padding:18px 18px 14px;border:3px solid #fff9;border-radius:22px;background:#fffdf8;box-shadow:0 10px 30px #45566c18;position:relative}
    .card.your-turn{background:linear-gradient(160deg,#fffdf4,#fff1d6)}
    .card.answered,.card.waiting-release{background:linear-gradient(160deg,#f7fffb,#e3f6ee)}
    .card.on-hold{background:#f3f4f6}
    .card.looked{border-color:#9fd3b8}
    .card.looked.your-turn{background:linear-gradient(160deg,#fbfffd,#eaf7f0)}
    .card.missing{opacity:.7}
    .top{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
    .badge{font-size:.78rem;font-weight:800;letter-spacing:.02em;padding:4px 10px;border-radius:999px;white-space:nowrap}
    .badge.candidate{background:#f4dcff;color:#5d3576}
    .badge.experiment{background:#d3ecff;color:#22517a}
    .badge.missing-badge{background:#f3d9d9;color:#7b4a4a}
    .waiting{margin-left:auto;font-size:.82rem;font-weight:800;color:#506269;background:#eef2f4;padding:4px 10px;border-radius:999px;white-space:nowrap}
    .waiting.amber{background:#ffe2a8;color:#7a4b00}
    .card h3{font-size:1.2rem;line-height:1.25;margin:0;color:#243d52}
    .card h3 a{color:inherit;text-decoration:none}
    .ask,.answer{margin:0;font-size:1.02rem;line-height:1.45;font-weight:650;color:#2c3e46}
    .ask .label,.answer .label{display:block;font-size:.74rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#8a5a00;margin-bottom:2px}
    .answer .label{color:#2f6b4f}
    .note{margin:0;font-size:.93rem;line-height:1.45;color:#4d5e65}
    .dates{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.85rem;color:#63747a;font-weight:600}
    .actions{display:flex;gap:10px;align-items:center;margin-top:auto;padding-top:4px}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;min-width:48px;padding:0 16px;border-radius:14px;font:inherit;font-weight:800;font-size:.98rem;text-decoration:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
    .open{background:#2d5d7c;color:#fff;border:0}
    .open:focus-visible,.tick:focus-visible{outline:3px solid #f0a020;outline-offset:2px}
    .tick{margin-left:auto;background:#fff;color:#3d5260;border:2px solid #c8d3d8}
    .tick svg{width:22px;height:22px;flex:none}
    .tick .box{fill:#fff;stroke:#8a9aa1;stroke-width:2}
    .tick .mark{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
    .tick[aria-pressed="true"]{background:#e3f6ee;border-color:#5fb38a;color:#22553c}
    .tick[aria-pressed="true"] .box{fill:#3c9a6c;stroke:#3c9a6c}
    .tick[aria-pressed="true"] .mark{opacity:1}
    .archive{margin-top:10px;padding:6px 18px;border-radius:18px;background:#fff8;box-shadow:0 8px 24px #45566c12}
    .archive summary{cursor:pointer;font-weight:800;color:#506269;min-height:48px;display:flex;align-items:center}
    .archive ul{margin:4px 0 12px;padding:0;list-style:none;columns:2;column-gap:36px}
    .archive li{margin:0 0 6px;break-inside:avoid;line-height:1.35}
    .archive a{color:#2d5d7c;text-underline-offset:2px;display:flex;align-items:center;min-height:44px;padding:6px 0}
    .archive li span{display:block;font-size:.85rem;color:#63747a;margin-top:-4px}
    .load-error{padding:18px;border-radius:18px;background:#fff3f0;color:#7b4a4a;font-weight:700}
    footer{margin-top:30px;color:#63747a;font-size:.88rem}
    @media (max-width:700px){
      .grid{grid-template-columns:1fr}
      .archive ul{columns:1}
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">For test users</div>
      <h1>Test Hub</h1>
      <p>Your turn comes first: each card says the one thing we need from you. Tick <b>I've looked</b> to remember on this device that you have seen it.</p>
      <p class="status-line" id="status-line"></p>
    </header>
    <div id="groups"></div>
    <details class="archive" id="archive">
      <summary id="archive-summary">Older test pages</summary>
      <ul id="archive-list"></ul>
    </details>
    <footer>Testing area · direct link only · not listed on the main hub</footer>
  </main>
  <script>
    (async function(){
      const GROUPS=[
        {status:'your-turn',title:'Your turn',blurb:'Waiting for you to look. Newest first.'},
        {status:'answered',title:'You answered',blurb:'We have your answer and are working on it.'},
        {status:'waiting-release',title:'Waiting for release',blurb:'Done and approved; goes live with the next release.'},
        {status:'on-hold',title:'On hold',blurb:'Paused until you reopen it.'}
      ];
      const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      const groupsEl=document.getElementById('groups');
      let slots=null;
      try{
        const res=await fetch('./slots.json',{cache:'no-store'});
        if(!res.ok) throw new Error('HTTP '+res.status);
        slots=await res.json();
      }catch(e){
        slots=null;
      }
      if(!Array.isArray(slots)){
        const p=document.createElement('p');
        p.className='load-error';
        p.textContent='The list of test pages did not load. Check the connection and reload this page.';
        groupsEl.appendChild(p);
        document.getElementById('archive').hidden=true;
        return;
      }

      // Per-device memory of "I've looked". Keyed by path + ready_for_you, so a card
      // put up again with a new date comes back unticked. Storage may be missing
      // (private mode, blocked site data): the page still works, the tick just
      // does not survive a reload.
      const memory={};
      const storeKey=s=>'testhub-looked:'+s.path+'@'+(s.ready_for_you||'');
      const readLooked=s=>{
        const k=storeKey(s);
        if(k in memory) return memory[k];
        try{return window.localStorage.getItem(k)==='1';}catch(_){return false;}
      };
      const writeLooked=(s,on)=>{
        const k=storeKey(s);
        memory[k]=on;
        try{
          if(on) window.localStorage.setItem(k,'1');
          else window.localStorage.removeItem(k);
        }catch(_){}
      };

      const parseDate=v=>{
        if(typeof v!=='string') return null;
        const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(v);
        return m?new Date(+m[1],+m[2]-1,+m[3]):null;
      };
      const fmt=v=>{const d=parseDate(v);return d?d.getDate()+' '+MONTHS[d.getMonth()]:'';};
      const today=new Date();today.setHours(0,0,0,0);
      const daysSince=v=>{const d=parseDate(v);return d?Math.max(0,Math.round((today-d)/86400000)):null;};
      const newest=field=>(a,b)=>{
        const d=String(b[field]||'').localeCompare(String(a[field]||''));
        return d!==0?d:String(a.title).localeCompare(String(b.title));
      };
      const hrefFor=s=>'./'+s.path+'/'+(s.entry||'');
      const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=text;return n;};
      const SVGNS='http://www.w3.org/2000/svg';
      const tickIcon=()=>{
        const svg=document.createElementNS(SVGNS,'svg');
        svg.setAttribute('viewBox','0 0 24 24');svg.setAttribute('aria-hidden','true');
        const r=document.createElementNS(SVGNS,'rect');
        r.setAttribute('x','2');r.setAttribute('y','2');r.setAttribute('width','20');r.setAttribute('height','20');r.setAttribute('rx','6');r.setAttribute('class','box');
        const p=document.createElementNS(SVGNS,'path');
        p.setAttribute('d','M7 12.5l3.2 3.2L17 8.8');p.setAttribute('class','mark');
        svg.appendChild(r);svg.appendChild(p);
        return svg;
      };

      const active=slots.filter(s=>s&&s.archived!==true&&s.status!=='retired');
      const archived=slots.filter(s=>s&&(s.archived===true||s.status==='retired'))
        .sort((a,b)=>String(b.answered||b.ready_for_you||'').localeCompare(String(a.answered||a.ready_for_you||''))||String(a.title).localeCompare(String(b.title)));

      const statusLine=document.getElementById('status-line');
      const updateStatusLine=()=>{
        const mine=active.filter(s=>s.status==='your-turn');
        const looked=mine.filter(readLooked).length;
        statusLine.textContent=mine.length===0
          ?'Nothing is waiting for you.'
          :mine.length+(mine.length===1?' page waits':' pages wait')+' for you · '+looked+' looked at on this device';
      };

      const card=s=>{
        const missing=s.staged===false;
        const c=el('article','card '+s.status+(missing?' missing':''));
        const top=el('div','top');
        top.appendChild(el('span','badge '+s.side,s.side==='candidate'?'Going live':'Feature test'));
        if(missing) top.appendChild(el('span','badge missing-badge','not staged'));
        if(s.status==='your-turn'){
          const n=daysSince(s.ready_for_you);
          if(n!=null){
            top.appendChild(el('span','waiting'+(n>7?' amber':''),n===0?'New today':'Waiting '+n+(n===1?' day':' days')));
          }
        }
        c.appendChild(top);
        const h=el('h3');
        if(missing){h.textContent=s.title;}
        else{const a=el('a',null,s.title);a.href=hrefFor(s);h.appendChild(a);}
        c.appendChild(h);
        if(s.status==='your-turn'&&s.ask){
          const p=el('p','ask');p.appendChild(el('span','label','We need'));p.appendChild(document.createTextNode(s.ask));c.appendChild(p);
        }else if(s.answer){
          const p=el('p','answer');p.appendChild(el('span','label',s.status==='on-hold'?'On hold':'Your answer'));p.appendChild(document.createTextNode(s.answer));c.appendChild(p);
        }
        if(s.note) c.appendChild(el('p','note',s.note));
        const dates=el('div','dates');
        if(s.ready_for_you&&s.status!=='on-hold'){
          const t=el('time',null,'New for you '+fmt(s.ready_for_you));t.dateTime=s.ready_for_you;dates.appendChild(t);
        }
        if(s.answered){
          const t=el('time',null,'You answered '+fmt(s.answered));t.dateTime=s.answered;dates.appendChild(t);
        }
        if(dates.childNodes.length) c.appendChild(dates);
        const actions=el('div','actions');
        if(!missing){
          const open=el('a','btn open','Open');open.href=hrefFor(s);
          open.setAttribute('aria-label','Open '+s.title);
          actions.appendChild(open);
        }
        const tick=el('button','btn tick');
        tick.type='button';
        tick.appendChild(tickIcon());
        tick.appendChild(el('span',null,"I've looked"));
        const sync=()=>{const on=readLooked(s);tick.setAttribute('aria-pressed',on?'true':'false');c.classList.toggle('looked',on);};
        tick.addEventListener('click',()=>{writeLooked(s,!readLooked(s));sync();updateStatusLine();});
        sync();
        actions.appendChild(tick);
        c.appendChild(actions);
        return c;
      };

      for(const g of GROUPS){
        const items=active.filter(s=>s.status===g.status)
          .sort(newest(g.status==='your-turn'?'ready_for_you':'answered'));
        if(items.length===0) continue;
        const sec=el('section','group');
        sec.id='group-'+g.status;
        const h=el('h2',null,g.title);
        h.appendChild(el('span','count',String(items.length)));
        sec.appendChild(h);
        sec.appendChild(el('p',null,g.blurb));
        const grid=el('div','grid');
        for(const s of items) grid.appendChild(card(s));
        sec.appendChild(grid);
        groupsEl.appendChild(sec);
      }
      updateStatusLine();

      const archive=document.getElementById('archive');
      document.getElementById('archive-summary').textContent='Older test pages ('+archived.length+')';
      const list=document.getElementById('archive-list');
      for(const s of archived){
        const li=el('li');
        const a=el('a',null,s.title);a.href=hrefFor(s);li.appendChild(a);
        if(s.answer) li.appendChild(el('span',null,s.answer));
        list.appendChild(li);
      }
      archive.hidden=archived.length===0;
    })();
  </script>
</body>
</html>
