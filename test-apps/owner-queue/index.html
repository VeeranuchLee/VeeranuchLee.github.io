<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Owner review queue</title>
<style>:root{font-family:ui-rounded,"Avenir Next",system-ui,sans-serif;color:#253047;background:#eef5ff}*{box-sizing:border-box}body{margin:0}main{max-width:1000px;margin:auto;padding:24px}.top{position:sticky;top:0;z-index:5;background:#eef5fff2;padding:12px 0}.bar{height:12px;background:#d5deed;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#5a67d8}section,.card{background:white;border-radius:22px;padding:20px;margin:16px 0;box-shadow:0 5px 20px #4260901c}h1,h2,h3{margin:.2em 0}.evidence{display:flex;gap:12px;overflow:auto;margin:12px 0}.evidence img{max-width:min(620px,80vw);max-height:520px;border-radius:14px}.evidence audio{width:min(520px,75vw)}a{color:#3446b8}.options{display:flex;flex-wrap:wrap;gap:10px}.options button,.export{min-height:48px;min-width:88px;border:2px solid #7180dd;border-radius:14px;background:white;padding:10px 16px;font:inherit;font-weight:700}.options button.chosen{background:#5967d9;color:white}textarea{width:100%;min-height:76px;margin-top:12px;border:2px solid #ccd5e7;border-radius:12px;padding:10px;font:inherit}.release{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}.release input{width:28px;height:28px}.actions{display:flex;gap:10px;flex-wrap:wrap}.muted{color:#667085}@media(max-width:600px){main{padding:12px}.card,section{padding:15px;border-radius:16px}}</style></head>
<body><main><div class="top"><h1>Owner review queue</h1><div id="progress">0 of 0 decided</div><div class="bar"><i id="fill"></i></div></div><div id="reviews"></div><section><h2>Releases ready</h2><p class="muted">Approvals are exact-commit phrases. Exporting does not publish; the controller records each approval with release-intent.sh.</p><div id="releases"></div></section><section><h2>Export</h2><div class="actions"><button class="export" id="copy">Copy summary</button><button class="export" id="download">Download JSON</button></div><pre id="summary"></pre></section></main>
<script>const DATA={"items": [], "releases": []};const KEY='children-games:owner-queue:v1';let saved={decisions:{},notes:{},approvals:{}};try{saved={...saved,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(e){}renderSummary()};
function evidence(e){if(e.kind==='image')return `<figure><img src="${esc(e.url)}" alt="${esc(e.label)}"><figcaption>${esc(e.label)}</figcaption></figure>`;if(e.kind==='audio')return `<figure><audio controls preload="metadata" src="${esc(e.url)}"></audio><figcaption>${esc(e.label)}</figcaption></figure>`;return `<a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.label)}</a>`}
const groups=Object.groupBy?Object.groupBy(DATA.items,x=>x.app):DATA.items.reduce((a,x)=>((a[x.app]??=[]).push(x),a),{});const reviews=document.querySelector('#reviews');for(const [app,items] of Object.entries(groups)){const sec=document.createElement('section');sec.innerHTML=`<h2>${esc(app)}</h2>`;for(const x of items){const card=document.createElement('article');card.className='card';card.innerHTML=`<h3>${esc(x.title)}</h3><p>${esc(x.question)}</p>${x.note?`<p class="muted">${esc(x.note)}</p>`:''}<div class="evidence">${x.evidence.map(evidence).join('')}</div><div class="options">${x.options.map(o=>`<button data-option="${esc(o)}">${esc(o)}</button>`).join('')}</div><textarea placeholder="Optional note" aria-label="Note for ${esc(x.title)}">${esc(saved.notes[x.id]||'')}</textarea>`;card.querySelectorAll('button').forEach(b=>{if(saved.decisions[x.id]===b.dataset.option)b.classList.add('chosen');b.onclick=()=>{saved.decisions[x.id]=b.dataset.option;card.querySelectorAll('button').forEach(z=>z.classList.toggle('chosen',z===b));persist()}});card.querySelector('textarea').oninput=e=>{saved.notes[x.id]=e.target.value;persist()};sec.append(card)}reviews.append(sec)}
const releases=document.querySelector('#releases');for(const r of DATA.releases){const id=String(r.sha||'').slice(0,8),row=document.createElement('label');row.className='release card';row.innerHTML=`<input type="checkbox" ${saved.approvals[id]?'checked':''}><span><b>${esc(r.app)}</b> ${esc(r.old_version)} → ${esc(r.new_version)}<br><code>${esc(r.sha)}</code><br>${esc(r.whats_in_it||r.summary||'')}</span>`;row.querySelector('input').onchange=e=>{saved.approvals[id]=e.target.checked;persist()};releases.append(row)}
function exported(){return {exportedAt:new Date().toISOString(),decisions:DATA.items.map(x=>({id:x.id,app:x.app,title:x.title,decision:saved.decisions[x.id]||null,note:saved.notes[x.id]||''})),releaseApprovals:DATA.releases.filter(r=>saved.approvals[String(r.sha||'').slice(0,8)]).map(r=>`approve ${String(r.sha).slice(0,8)}`)}}function readable(x){return [...x.decisions.map(d=>`${d.app} — ${d.title}: ${d.decision||'UNDECIDED'}${d.note?' — '+d.note:''}`),...x.releaseApprovals].join('\n')}
function renderSummary(){const n=DATA.items.filter(x=>saved.decisions[x.id]).length;document.querySelector('#progress').textContent=`${n} of ${DATA.items.length} decided`;document.querySelector('#fill').style.width=(DATA.items.length?100*n/DATA.items.length:100)+'%';document.querySelector('#summary').textContent=readable(exported())}document.querySelector('#copy').onclick=async()=>{const text=readable(exported());try{await navigator.clipboard.writeText(text)}catch(e){const t=document.createElement('textarea');t.value=text;document.body.append(t);t.select();document.execCommand('copy');t.remove()}};document.querySelector('#download').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(exported(),null,2)+'\n'],{type:'application/json'}));a.download='owner-review-decisions.json';a.click();URL.revokeObjectURL(a.href)};renderSummary();</script></body></html>
