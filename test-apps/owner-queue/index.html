<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Owner review queue</title>
<style>:root{font-family:ui-rounded,"Avenir Next",system-ui,sans-serif;color:#253047;background:#eef5ff}*{box-sizing:border-box}body{margin:0}main{max-width:1000px;margin:auto;padding:24px}.top{position:sticky;top:0;z-index:5;background:#eef5fff2;padding:12px 0}.bar{height:12px;background:#d5deed;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#5a67d8}section,.card{background:white;border-radius:22px;padding:20px;margin:16px 0;box-shadow:0 5px 20px #4260901c}h1,h2,h3{margin:.2em 0}.evidence{display:flex;gap:12px;overflow:auto;margin:12px 0}.evidence img{max-width:min(620px,80vw);max-height:520px;border-radius:14px}.evidence audio{width:min(520px,75vw)}a{color:#3446b8}.options{display:flex;flex-wrap:wrap;gap:10px}.options button,.export{min-height:48px;min-width:88px;border:2px solid #7180dd;border-radius:14px;background:white;padding:10px 16px;font:inherit;font-weight:700}.options button.chosen{background:#5967d9;color:white}textarea{width:100%;min-height:76px;margin-top:12px;border:2px solid #ccd5e7;border-radius:12px;padding:10px;font:inherit}.release{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}.release input{width:28px;height:28px}.actions{display:flex;gap:10px;flex-wrap:wrap}.muted{color:#667085}@media(max-width:600px){main{padding:12px}.card,section{padding:15px;border-radius:16px}}</style></head>
<body><main><div class="top"><h1>Owner review queue</h1><div id="progress">0 of 0 decided</div><div class="bar"><i id="fill"></i></div></div><div id="reviews"></div><section><h2>Releases ready</h2><p class="muted">Approvals are exact-commit phrases. Exporting does not publish; the controller records each approval with release-intent.sh.</p><div id="releases"></div></section><section><h2>Export</h2><div class="actions"><button class="export" id="copy">Copy summary</button><button class="export" id="download">Download JSON</button></div><pre id="summary"></pre></section></main>
<script>const DATA={"items": [{"id": "colorlab-mauve", "app": "Color Lab", "title": "Mauve is a dusty pink-brown", "question": "Our \"mauve\" is the xkcd colour dusty pink-brown (#AE7181). Many people expect a lilac-grey purple. Keep it, or change it?", "options": ["Keep", "Change to a purple mauve", "Skip"], "evidence": [{"url": "https://veeranuchlee.github.io/test-apps/color-lab/", "label": "Open Color Lab and find mauve in Explore", "kind": "link"}, {"path": "/Users/veeranuchleelalai/git-worktrees/children-games/color-lab-expand/color-lab-app/qa/2026-10-08-colour-audit/before-after-swatch-sheet.png", "label": "Colour audit swatch sheet", "url": "evidence/colorlab-mauve-02.png", "kind": "image"}], "note": ""}, {"id": "colorlab-neighbours", "app": "Color Lab", "title": "85 new colours are very close to a neighbour", "question": "85 of the new colours are within delta-E 8 of another colour in the same family (hard to tell apart). Thin them out, or keep all 260?", "options": ["Keep all", "Thin out the closest", "Skip"], "evidence": [{"url": "https://veeranuchlee.github.io/test-apps/color-lab/", "label": "Color Lab (Explore)", "kind": "link"}, {"path": "/Users/veeranuchleelalai/git-worktrees/children-games/color-lab-expand/color-lab-app/qa/2026-10-08-expand/explore-1024x768.png", "label": "Explore, landscape", "url": "evidence/colorlab-neighbours-02.png", "kind": "image"}, {"path": "/Users/veeranuchleelalai/git-worktrees/children-games/color-lab-expand/color-lab-app/qa/2026-10-08-expand/explore-768x1024.png", "label": "Explore, portrait", "url": "evidence/colorlab-neighbours-03.png", "kind": "image"}], "note": ""}, {"id": "colorlab-strokes", "app": "Color Lab", "title": "Bowl strokes: flat colour or brushy?", "question": "The strokes in the bowl are flat colour that follows the paint. Do you prefer that, or a brushy texture?", "options": ["Flat colour (as now)", "Brushy texture", "Skip"], "evidence": [{"url": "https://veeranuchlee.github.io/test-apps/color-lab/", "lab : "/Users/veeranuchleelalai/git-worktrees/children-games/color-lab-expand/color-lab-app/audio/colour-names/fern.m4a", "label": "Fern (heard as: fun)", "url": "evidence/colorlab-listen-06.m4a", "kind": "audio"}, {"path": "/Users/veeranuchleelalai/git-worktrees/children-games/color-lab-expand/color-lab-app/audio/colour-names/tan.m4a", "label": "Tan (heard as: Ten)", "url": "evidence/colorlab-listen-07.m4a", "kind": "audio"}, {"path": "/Users/veeranuchleelalai/git-worktrees/children-games/color-lab-expand/color-lab-app/audio/colour-names/army-green.m4a", "label": "Army green (heard as: Omni green)", "url": "evidence/colorlab-listen-08.m4a", "kind": "audio"}, {"path": "/Users/veeranuchleelalai/git-worktrees/children-games/color-lab-expand/color-lab-app/audio/colour-names/chartreuse-yellow.m4a", "label": "Chartreuse yellow (heard as: Jartrouz yellow)", "url": "evidence/colorlab-listen-09.m4a", "kind": "audio"}], "note": ""}, {"id": "discovery-room-look", "app": "Main hub", "title": "Discovery Room: computer faded, twinkles", "question": "The computer landmark is faded because it is not active yet. Is that OK? Are the twinkles bold enough to notice?", "options": ["Fine as is", "Make twinkles bolder", "Change the faded computer", "Skip"], "evidence": [{"url": "https://veeranuchlee.github.io/test-apps/hub-discovery-room/", "label": "Open the Discovery Room", "kind": "link"}, {"path": "/Users/veeranuchleelalai/.local/state/children-games/qa/2026-10-09/hub-discovery-room/landscape.jpg", "label": "Landscape screenshot", "url": "evidence/discovery-room-look-02.jpg", "kind": "image"}, {"path": "/Users/veeranuchleelalai/.local/state/children-games/qa/2026-10-09/hub-discovery-room/portrait.jpg", "label": "Portrait screenshot", "url": "evidence/discovery-room-look-03.jpg", "kind": "image"}], "note": ""}, {"id": "writing-book-1276", "app": "Writing Book", "title": "Cheer plus quiet pause after each word (PR 1276)", "question": "Listen: after each finished word there is one cheer and a pause of about a second. Is it right?", "options": ["Good", "Shorter pause", "Longer pause", "No cheer", "Skip"], "evidence": [{"url": "https://veeranuchlee.github.io/test-apps/writing-book-audio-fix/", "label": "Open and finish a word", "kind": "link"}, {"url": "https://github.com/VeeranuchLee/children-games/pull/1276", "label": "PR 1276", "kind": "link"}], "note": ""}, {"id": "solar-tap-hear", "app": "Solar System", "title": "Tap-to-hear voices", "question": "Listen to Ceres, Hygiea, Iapetus and the moons of Uranus. Do they sound right (especially Uranus' moons)?", "options": ["All good", "Some need a re-render", "Skip"], "evidence": [{"url": "https://veeranuchlee.github.io/test-apps/solar-tap-to-hear/", "label": "Open and tap Ceres, Hygiea, Iapetus, Uranus' moons", "kind": "link"}, {"url": "https://github.com/VeeranuchLee/children-games/pull/1138", "label": "PR 1138", "kind": "link"}], "note": ""}, {"id": "wordbook-coming-next", "app": "Word Book", "title": "Coming Next: 100 proposed words", "question": "Review the 100 proposed headwords and Titan/Atlas senses, then Export your decisions from the page. Also: what should the Thai be for myth versus mythology?", "options": ["Reviewed - exported", "Need changes", "Skip"], "evidence": [{"url": "https://veeranuchlee.github.io/test-apps/word-book-coming-next/", "label": "Open the review page (Export button inside)", "kind": "link"}], "note": ""}, {"id": "computer-books-round3", "app": "Computer books", "title": "Round 3: read the change log", "question": "Read the ten text drafts and the round 3 change log. Anything wrong or missing?", "options": ["Looks good", "Needs changes", "Skip"], "evidence": [{"url": "https://veeranuchlee.github.io/test-apps/computer-books-drafts/", "label": "Open the drafts and the change log", "kind": "link"}, {"url": "https://github.com/VeeranuchLee/children-games/pull/1280", "label": "PR 1280", "kind": "link"}], "note": ""}, {"id": "growth-report-1298", "app": "Repo / process", "title": "Draft 1298: asset growth report and a what-belongs-in-git rule", "question": "Informational CI report plus a proposed AGENTS.md section. Approve it, change it, or drop it?", "options": ["Approve", "Change", "Drop", "Skip"], "evidence": [{"url": "https://github.com/VeeranuchLee/children-games/pull/1298", "label": "PR 1298", "kind": "link"}], "note": ""}, {"id": "ci-router-phase0", "app": "Repo / process", "title": "Phase 0 CI router: go or no-go", "question": "The first step to cut Actions minutes (run only the checks a PR needs). Go ahead, or hold?", "options": ["Go", "No-go", "Skip"], "evidence": [{"url": "https://github.com/VeeranuchLee/children-games/tree/agent/actions-minutes-research", "label": "Branch agent/actions-minutes-research", "kind": "link"}], "note": ""}, {"id": "solar-small-buttons", "app": "Solar System", "title": "Solar tap-to-hear: small buttons", "question": "The automatic check found the back, page and next buttons are 32 px (the target for little fingers is 44 px). Make them bigger?", "options": ["Make them 44 px", "Leave", "Skip"], "evidence": [{"url": "https://veeranuchlee.github.io/test-apps/solar-tap-to-hear/", "label": "Open Solar tap-to-hear", "kind": "link"}, {"path": "/Users/veeranuchleelalai/.local/state/children-games/qa/2026-10-09/solar-tap-to-hear/contact-sheet.jpg", "label": "Sweep screenshot", "url": "evidence/solar-small-buttons-02.jpg", "kind": "image"}], "note": ""}, {"id": "solar-moon-rosters", "app": "Solar System", "title": "Moon rosters for Jupiter, Saturn, Uranus", "question": "Do the moon rosters for Saturn and Uranus look right (real-size row, yellow Zoomed in group, name tags)? Saturn's 16 moons need a short scroll in landscape. Then please listen to the name tags on the Solar voices page, especially Daphnis and Amalthea, which the recogniser flagged, and choose Keep or Re-record.", "options": ["Rosters look right", "Fix the layout", "Skip"], "evidence": [{"url": "https://veeranuchlee.github.io/test-apps/solar-tap-to-hear/", "label": "Open Solar tap-to-hear (tap a Jupiter, Saturn or Uranus 'Explore the moons' button)", "kind": "link"}, {"url": "https://veeranuchlee.github.io/test-apps/solar-voice-review/", "label": "Solar voices: tap to compare (98 clips; pick Keep or Re-record)", "kind": "link"}, {"path": "/Users/veeranuchleelalai/git-worktrees/children-games/solar-tap-to-read/solar-storybook/qa/2026-10-09-moon-rosters/jupiter-landscape.png", "label": "jupiter landscape screenshot", "url": "evidence/solar-moon-rosters-03.png", "kind": "image"}, {"path": "/Users/veeranuchleelalai/git-worktrees/children-games/solar-tap-to-read/solar-storybook/qa/2026-10-09-moon-rosters/saturn-landscape.png", "label": "saturn landscape screenshot", "url": "evidence/solar-moon-rosters-04.png", "kind": "image"}, {"path": "/Users/veeranuchleelalai/git-worktrees/children-games/solar-tap-to-read/solar-storybook/qa/2026-10-09-moon-rosters/saturn-landscape-scrolled.png", "label": "saturn landscape scrolled screenshot", "url": "evidence/solar-moon-rosters-05.png", "kind": "image"}, {"path": "/Users/veeranuchleelalai/git-worktrees/children-games/solar-tap-to-read/solar-storybook/qa/2026-10-09-moon-rosters/saturn-portrait.png", "label": "saturn portrait screenshot", "url": "evidence/solar-moon-rosters-06.png", "kind": "image"}, {"path": "/Users/veeranuchleelalai/git-worktrees/children-games/solar-tap-to-read/solar-storybook/qa/2026-10-09-moon-rosters/uranus-landscape.png", "label": "uranus landscape screenshot", "url": "evidence/solar-moon-rosters-07.png", "kind": "image"}, {"path": "/Users/veeranuchleelalai/git-worktrees/children-games/solar-tap-to-read/solar-storybook/qa/2026-10-09-moon-rosters/uranus-portrait.png", "label": "uranus portrait screenshot", "url": "evidence/solar-moon-rosters-08.png", "kind": "image"}, {"path": "/Users/veeranuchleelalai/git-worktrees/children-games/solar-tap-to-read/solar-storybook/qa/2026-10-09-moon-rosters/jupiter-portrait.png", "label": "jupiter portrait screenshot", "url": "evidence/solar-moon-rosters-09.png", "kind": "image"}], "note": ""}], "releases": []};const KEY='children-games:owner-queue:v1';let saved={decisions:{},notes:{},approvals:{}};try{saved={...saved,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(e){}renderSummary()};
function evidence(e){if(e.kind==='image')return `<figure><img src="${esc(e.url)}" alt="${esc(e.label)}"><figcaption>${esc(e.label)}</figcaption></figure>`;if(e.kind==='audio')return `<figure><audio controls preload="metadata" src="${esc(e.url)}"></audio><figcaption>${esc(e.label)}</figcaption></figure>`;return `<a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.label)}</a>`}
const groups=Object.groupBy?Object.groupBy(DATA.items,x=>x.app):DATA.items.reduce((a,x)=>((a[x.app]??=[]).push(x),a),{});const reviews=document.querySelector('#reviews');for(const [app,items] of Object.entries(groups)){const sec=document.createElement('section');sec.innerHTML=`<h2>${esc(app)}</h2>`;for(const x of items){const card=document.createElement('article');card.className='card';card.innerHTML=`<h3>${esc(x.title)}</h3><p>${esc(x.question)}</p>${x.note?`<p class="muted">${esc(x.note)}</p>`:''}<div class="evidence">${x.evidence.map(evidence).join('')}</div><div class="options">${x.options.map(o=>`<button data-option="${esc(o)}">${esc(o)}</button>`).join('')}</div><textarea placeholder="Optional note" aria-label="Note for ${esc(x.title)}">${esc(saved.notes[x.id]||'')}</textarea>`;card.querySelectorAll('button').forEach(b=>{if(saved.decisions[x.id]===b.dataset.option)b.classList.add('chosen');b.onclick=()=>{saved.decisions[x.id]=b.dataset.option;card.querySelectorAll('button').forEach(z=>z.classList.toggle('chosen',z===b));persist()}});card.querySelector('textarea').oninput=e=>{saved.notes[x.id]=e.target.value;persist()};sec.append(card)}reviews.append(sec)}
const releases=document.querySelector('#releases');for(const r of DATA.releases){const id=String(r.sha||'').slice(0,8),row=document.createElement('label');row.className='release card';row.innerHTML=`<input type="checkbox" ${saved.approvals[id]?'checked':''}><span><b>${esc(r.app)}</b> ${esc(r.old_version)} → ${esc(r.new_version)}<br><code>${esc(r.sha)}</code><br>${esc(r.whats_in_it||r.summary||'')}</span>`;row.querySelector('input').onchange=e=>{saved.approvals[id]=e.target.checked;persist()};releases.append(row)}
function exported(){return {exportedAt:new Date().toISOString(),decisions:DATA.items.map(x=>({id:x.id,app:x.app,title:x.title,decision:saved.decisions[x.id]||null,note:saved.notes[x.id]||''})),releaseApprovals:DATA.releases.filter(r=>saved.approvals[String(r.sha||'').slice(0,8)]).map(r=>`approve ${String(r.sha).slice(0,8)}`)}}function readable(x){return [...x.decisions.map(d=>`${d.app} — ${d.title}: ${d.decision||'UNDECIDED'}${d.note?' — '+d.note:''}`),...x.releaseApprovals].join('\n')}
function renderSummary(){const n=DATA.items.filter(x=>saved.decisions[x.id]).length;document.querySelector('#progress').textContent=`${n} of ${DATA.items.length} decided`;document.querySelector('#fill').style.width=(DATA.items.length?100*n/DATA.items.length:100)+'%';document.querySelector('#summary').textContent=readable(exported())}document.querySelector('#copy').onclick=async()=>{const text=readable(exported());try{await navigator.clipboard.writeText(text)}catch(e){const t=document.createElement('textarea');t.value=text;document.body.append(t);t.select();document.execCommand('copy');t.remove()}};document.querySelector('#download').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(exported(),null,2)+'\n'],{type:'application/json'}));a.download='owner-review-decisions.json';a.click();URL.revokeObjectURL(a.href)};renderSummary();</script></body></html>
