<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Voice test</title>
<script src="./cg-update.js" defer></script>
<!-- TEMPORARY DIAGNOSTIC (2026-11-24, iPad robot-voice cut-off). Staging only, never merged.
     Each button speaks the same long sentence a different way, so one round of taps on the
     owner's iPad shows which setting survives. No AudioContext, no media: speech only. -->
<style>
  body{font:18px system-ui,sans-serif;margin:16px;background:#1d1b3a;color:#fff}
  h1{font-size:24px;margin:0 0 6px}
  p{margin:0 0 12px;color:#cfd}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:760px}
  button{font:600 20px system-ui;padding:18px 12px;border-radius:14px;border:0;background:#fff;color:#2a2766;text-align:left}
  button small{display:block;font-weight:400;font-size:14px;color:#555;margin-top:4px}
  #stop{background:#ffd5d5}
  #log{margin-top:14px;max-width:760px;background:#000;color:#cfe;font:13px/1.35 Menlo,monospace;padding:8px;border-radius:10px;white-space:pre-wrap;min-height:220px}
</style>
</head>
<body>
<h1>Robot voice test</h1>
<p>Tap one button, listen until it stops, then the next. Note which ones say the WHOLE sentence. Screenshot the log at the end.</p>
<div class="grid">
  <button data-t="A">A · Normal voice<small>speed 1, pitch 1</small></button>
  <button data-t="B">B · Robot (game now)<small>speed 0.86, pitch 0.7</small></button>
  <button data-t="C">C · Robot pitch only<small>speed 1, pitch 0.7</small></button>
  <button data-t="D">D · Robot speed only<small>speed 0.86, pitch 1</small></button>
  <button data-t="E">E · Robot, in pieces<small>speed 0.86, pitch 0.7, short parts</small></button>
  <button data-t="F">F · Robot, Samantha chosen<small>speed 0.86, pitch 0.7, voice set</small></button>
  <button id="stop">Stop</button>
</div>
<div id="log"></div>
<script>
(function(){
  var S=window.speechSynthesis, T0=performance.now(), logEl=document.getElementById('log'), rows=[], keep=[];
  var TEXT='nine hundred and ten trillion equals nine hundred and ten trillion';
  var PIECES=['nine hundred and ten trillion','equals','nine hundred and ten trillion'];
  function log(m){rows.push(((performance.now()-T0)/1000).toFixed(2)+' '+m);if(rows.length>60)rows.shift();logEl.textContent=rows.join('\n');}
  function voice(){var v=(S.getVoices()||[]).filter(function(x){return x.name==='Samantha'&&/^en/i.test(x.lang);})[0];return v||null;}
  log('UA '+navigator.userAgent.replace(/.*(CPU OS|Mac OS X) ([\d_]+).*/,'$1 $2')+' · voices '+(S?S.getVoices().length:'none'));
  if(S&&S.addEventListener)S.addEventListener('voiceschanged',function(){log('voices '+S.getVoices().length+(voice()?' (Samantha found)':''));});
  function utter(tag,text,rate,pitch,v){
    var u=new SpeechSynthesisUtterance(text); u.lang='en-US'; u.rate=rate; u.pitch=pitch; if(v)u.voice=v;
    var words=0;
    u.onstart=function(){log(tag+' start');};
    u.onboundary=function(e){words++;log(tag+' word '+words+' @'+e.charIndex);};
    u.onend=function(){log(tag+' END ('+words+' words)');};
    u.onerror=function(e){log(tag+' ERROR '+e.error+' ('+words+' words)');};
    keep.push(u); return u;
  }
  function run(t){
    S.cancel(); rows=[]; T0=performance.now();
    var R=.86,P=.7;
    if(t==='A')S.speak(utter('A',TEXT,1,1));
    if(t==='B')S.speak(utter('B',TEXT,R,P));
    if(t==='C')S.speak(utter('C',TEXT,1,P));
    if(t==='D')S.speak(utter('D',TEXT,R,1));
    if(t==='F'){var v=voice();log('F voice '+(v?v.name+' '+v.lang:'NOT FOUND'));S.speak(utter('F',TEXT,R,P,v));}
    if(t==='E'){
      var i=0;(function next(){if(i>=PIECES.length)return;var u=utter('E'+(i+1),PIECES[i],R,P);i++;
        var go=u.onend;u.onend=function(){go();setTimeout(next,120);};S.speak(u);})();
    }
    setTimeout(function poll(){if(S.speaking||S.pending){setTimeout(poll,500);return;}log('(engine idle)');},600);
  }
  Array.prototype.forEach.call(document.querySelectorAll('[data-t]'),function(b){b.onclick=function(){log('tap '+b.dataset.t);run(b.dataset.t);};});
  document.getElementById('stop').onclick=function(){S.cancel();log('stopped');};
})();
</script>
</body>
</html>
