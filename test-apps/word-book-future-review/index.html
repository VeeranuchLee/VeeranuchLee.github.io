<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word Book: new words review</title>
<style>
:root{--bg:#fbf7ee;--card:#fff;--ink:#2b2340;--soft:#6d6480;--line:#e6dfcf;--accent:#3a6fd8;--flag:#d9534f;--flagbg:#fff1f0;--ok:#2e8b57}
*{box-sizing:border-box}
html,body{touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px}
h1{margin:0 0 4px;font-size:1.25rem}
.sub{margin:0 0 8px;color:var(--soft);font-size:.9rem}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar button,.filters button{min-height:44px;padding:8px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.bar button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.count{color:var(--soft);font-size:.9rem;margin-left:auto}
.jump{display:flex;gap:6px;align-items:center}
.jump input{width:70px;min-height:44px;padding:6px;border:1px solid var(--line);border-radius:10px;font:inherit}
main{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:10px 12px 80px;max-width:1400px;margin:0 auto}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card.flagged{border-color:var(--flag);background:var(--flagbg)}
.card.approved{border-color:var(--ok);background:#eefaf2}
.ticks label.ok input{accent-color:var(--ok)}
.card img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#eee}
.body{padding:6px 8px 8px;display:flex;flex-direction:column;gap:5px}
.head{display:flex;align-items:center;gap:6px;min-width:0}
.rank{color:var(--soft);font-size:.72rem;font-variant-numeric:tabular-nums}
.word{font-size:1rem;font-weight:800;overflow-wrap:anywhere;min-width:0}
.play{margin-left:auto;width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.play svg{width:20px;height:20px}
.play.playing{background:var(--ok)}
.sentence{margin:0;font-size:.82rem;line-height:1.3}
.note{margin:0;font-size:.72rem;color:#8a5a00;background:#fff6dd;border-radius:8px;padding:6px 8px}
.ticks{display:flex;flex-direction:column;gap:4px}
.ticks label{display:flex;align-items:center;gap:6px;min-height:40px;padding:4px 8px;font-size:.8rem;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;font-weight:600;user-select:none}
.ticks input{width:20px;height:20px;flex:none;accent-color:var(--flag)}
textarea{width:100%;min-height:40px;padding:6px;font-size:.8rem;border:1px solid var(--line);border-radius:10px;font:inherit;resize:vertical;background:#fff}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.empty{grid-column:1/-1;text-align:center;color:var(--soft);padding:40px}
</style>
</head>
<body>
<header>
  <h1>Word Book: new words 101–998 (A to Z)</h1>
  <p class="sub">Tap the blue button to hear the sentence. Tick <b>Approve</b> if a card is good, or <b>Fix picture</b> / <b>Fix voice</b> if it needs work, and add a comment if you like. Your ticks save on this device as you go; tap <b>Send feedback</b> when you are done.</p>
  <div class="bar">
    <div class="filters" role="group" aria-label="Show">
      <button type="button" data-filter="all" aria-pressed="true">All</button>
      <button type="button" data-filter="todo" aria-pressed="false">Not done yet</button>
      <button type="button" data-filter="flagged" aria-pressed="false">Needs fixing</button>
      <button type="button" data-filter="ok" aria-pressed="false">Approved</button>
      <button type="button" data-filter="note" aria-pressed="false">Check the voice note</button>
    </div>
    <div class="jump"><input id="jump" type="number" inputmode="numeric" placeholder="No." aria-label="Go to number"><button type="button" id="go">Go</button></div>
    <button type="button" class="primary" id="send">Send feedback</button>
    <button type="button" id="download">Download file</button>
    <span class="count" id="count"></span>
  </div>
</header>
<main id="grid"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="data.js"></script>
<script>
(function () {
  "use strict";
  var KEY = "wb-future-review-101-400";
  var items = window.REVIEW_ITEMS || [];
  var state = {};
  try { state = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { state = {}; }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  function entry(rank) { return state[rank] || (state[rank] = { ok: false, pic: false, voice: false, comment: "" }); }
  function isApproved(rank) { var s = state[rank]; return !!(s && s.ok); }
  function isFlagged(rank) { var s = state[rank]; return !!(s && (s.pic || s.voice || (!s.ok && (s.comment || "").trim()))); }

  var SPEAKER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
  var grid = document.getElementById("grid");
  var audio = new Audio();
  var playingBtn = null;
  audio.addEventListener("ended", function () { if (playingBtn) playingBtn.classList.remove("playing"); playingBtn = null; });

  function card(it) {
    var el = document.createElement("article");
    el.className = "card"; el.id = "w" + it.rank; el.dataset.rank = it.rank;
    el.innerHTML =
      '<img loading="lazy" alt="">' +
      '<div class="body">' +
        '<div class="head"><span class="rank"></span><span class="word"></span>' +
        '<button type="button" class="play">' + SPEAKER + '</button></div>' +
        '<p class="sentence"></p>' +
        (it.note ? '<p class="note"></p>' : '') +
        '<div class="ticks"><label class="ok"><input type="checkbox" data-k="ok"> Approve</label><label><input type="checkbox" data-k="pic"> Fix picture</label>' +
        '<label><input type="checkbox" data-k="voice"> Fix voice</label></div>' +
        '<textarea placeholder="Comment (optional)"></textarea>' +
      '</div>';
    el.querySelector("img").src = it.pic;
    el.querySelector("img").alt = it.word;
    el.querySelector(".rank").textContent = it.rank;
    el.querySelector(".word").textContent = it.word;
    el.querySelector(".sentence").textContent = it.sentence;
    if (it.note) el.querySelector(".note").textContent = it.note;
    var btn = el.querySelector(".play");
    btn.setAttribute("aria-label", "Play: " + it.sentence);
    btn.addEventListener("click", function () {
      if (playingBtn) playingBtn.classList.remove("playing");
      audio.pause(); audio.src = it.audio; audio.currentTime = 0;
      var p = audio.play(); if (p && p.catch) p.catch(function () {});
      btn.classList.add("playing"); playingBtn = btn;
    });
    var s = state[it.rank] || {};
    el.querySelectorAll("input[type=checkbox]").forEach(function (cb) {
      cb.checked = !!s[cb.dataset.k];
      cb.addEventListener("change", function () {
        var e = entry(it.rank); e[cb.dataset.k] = cb.checked;
        // Approve and Fix are opposites: ticking one clears the other on this card.
        if (cb.checked && cb.dataset.k === "ok") { e.pic = false; e.voice = false; }
        if (cb.checked && cb.dataset.k !== "ok") e.ok = false;
        el.querySelectorAll("input[type=checkbox]").forEach(function (x) { x.checked = !!e[x.dataset.k]; });
        save(); refresh(el);
      });
    });
    var ta = el.querySelector("textarea");
    ta.value = s.comment || "";
    ta.addEventListener("input", function () { entry(it.rank).comment = ta.value; save(); refresh(el); });
    refresh(el, true);
    return el;
  }
  function refresh(el, quiet) {
    el.classList.toggle("flagged", isFlagged(+el.dataset.rank));
    el.classList.toggle("approved", isApproved(+el.dataset.rank) && !isFlagged(+el.dataset.rank));
    if (!quiet) count();
  }
  var filter = "all";
  function render() {
    grid.innerHTML = "";
    var shown = items.filter(function (it) {
      return filter === "all" || (filter === "flagged" && isFlagged(it.rank)) || (filter === "note" && it.note)
        || (filter === "ok" && isApproved(it.rank) && !isFlagged(it.rank)) || (filter === "todo" && !isApproved(it.rank) && !isFlagged(it.rank));
    });
    if (!shown.length) { grid.innerHTML = '<p class="empty">Nothing here yet.</p>'; }
    shown.forEach(function (it) { grid.appendChild(card(it)); });
    count();
  }
  function count() {
    var n = items.filter(function (it) { return isFlagged(it.rank); }).length;
    var ok = items.filter(function (it) { return isApproved(it.rank) && !isFlagged(it.rank); }).length;
    document.getElementById("count").textContent = items.length + " words · " + ok + " approved · " + n + " to fix · " + (items.length - ok - n) + " left";
  }
  document.querySelectorAll(".filters button").forEach(function (b) {
    b.addEventListener("click", function () {
      filter = b.dataset.filter;
      document.querySelectorAll(".filters button").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
      render();
    });
  });
  document.getElementById("go").addEventListener("click", function () {
    var n = document.getElementById("jump").value, el = document.getElementById("w" + n);
    if (!el && filter !== "all") { document.querySelector('[data-filter="all"]').click(); el = document.getElementById("w" + n); }
    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); else toast("No word number " + n);
  });

  function feedback() {
    var out = items.filter(function (it) { return isFlagged(it.rank); }).map(function (it) {
      var s = state[it.rank];
      return { rank: it.rank, word: it.word, sentence: it.sentence, fix_picture: !!s.pic, fix_voice: !!s.voice, comment: (s.comment || "").trim() };
    });
    var approved = items.filter(function (it) { return isApproved(it.rank) && !isFlagged(it.rank); }).map(function (it) {
      var s = state[it.rank]; return { rank: it.rank, word: it.word, comment: (s.comment || "").trim() };
    });
    return { page: "word-book-future-review", at: new Date().toISOString(), total: items.length, marked: out.length, approved_count: approved.length, left: items.length - out.length - approved.length, items: out, approved: approved };
  }
  function asText(fb) {
    var lines = ["Word Book new words review: " + fb.approved_count + " approved, " + fb.marked + " to fix, " + fb.left + " not reviewed, of " + fb.total + "."];
    fb.items.forEach(function (x) {
      var what = [x.fix_picture ? "fix picture" : "", x.fix_voice ? "fix voice" : ""].filter(Boolean).join(" + ");
      lines.push(x.rank + " " + x.word + (what ? " — " + what : "") + (x.comment ? " — " + x.comment : ""));
    });
    lines.push("", JSON.stringify(fb));
    return lines.join("\n");
  }
  function toast(msg) { var t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); setTimeout(function () { t.classList.remove("show"); }, 2600); }
  document.getElementById("send").addEventListener("click", function () {
    var text = asText(feedback());
    if (navigator.share) { navigator.share({ title: "Word Book review", text: text }).catch(function () {}); return; }
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(function () { toast("Copied. Paste it into the chat."); }, function () { toast("Could not copy; use Download file."); });
    else toast("Use Download file.");
  });
  document.getElementById("download").addEventListener("click", function () {
    var blob = new Blob([JSON.stringify(feedback(), null, 1)], { type: "application/json" });
    var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "word-book-review.json";
    document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  });
  items.sort(function (a, b) { return a.word.localeCompare(b.word, "en", { sensitivity: "base" }); });
  render();
})();
</script>
</body>
</html>
