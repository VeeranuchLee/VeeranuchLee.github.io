<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4d8ba">
<title>Soroban Garden</title>
  <link rel="stylesheet" href="cg-back.css">
<link rel="stylesheet" href="styles.css">
<script src="tap-zoom-guard.js">
</script>
</head>
<body>
<main id="app">
  <a class="cg-back" id="back" href="https://veeranuchlee.github.io/" aria-label="Back to Children Games">
<svg viewBox="0 0 48 48" aria-hidden="true">
<path d="M29 11 16 24l13 13M17 24h21"/>
</svg>
</a>
  <header>
<span class="cg-back-slot">
</span>
<div class="brand">
<span class="flower" aria-hidden="true">
<svg viewBox="0 0 48 48">
<circle cx="24" cy="24" r="6"/>
<path d="M24 17c-8-1-9-10-3-12 5-2 8 5 3 12Zm7 7c1-8 10-9 12-3 2 5-5 8-12 3Zm-7 7c8 1 9 10 3 12-5 2-8-5-3-12Zm-7-7c-1 8-10 9-12 3-2-5 5-8 12-3Z"/>
</svg>
</span>
<h1>Soroban Garden</h1>
</div>
<button id="sound" class="icon" aria-label="Mute sounds" aria-pressed="false">
<svg viewBox="0 0 48 48" aria-hidden="true">
<path d="M8 20h8l9-8v24l-9-8H8zM31 19c3 3 3 7 0 10M36 14c6 6 6 14 0 20"/>
</svg>
</button>
</header>
  <section id="home" class="screen active">
<div class="welcome">
<h2>Learn the real soroban</h2>
<p>Only beads touching the bar count.</p>
<div id="lesson-grid" class="lesson-grid">
</div>
<button id="free-play" class="wide">
<svg viewBox="0 0 48 48" aria-hidden="true">
<circle cx="24" cy="24" r="6"/>
<path d="M24 17c-8-1-9-10-3-12 5-2 8 5 3 12Zm7 7c1-8 10-9 12-3 2 5-5 8-12 3Zm-7 7c8 1 9 10 3 12-5 2-8-5-3-12Zm-7-7c-1 8-10 9-12 3-2-5 5-8 12-3Z"/>
</svg>Free play</button>
</div>
</section>
  <section id="play" class="screen">
<div class="play-top">
<button id="lesson-back" class="icon" aria-label="Back to lessons">
<svg viewBox="0 0 48 48">
<path d="M29 11 16 24l13 13M17 24h21"/>
</svg>
</button>
<div>
<div id="step-name" class="step-name">
</div>
<div id="prompt" class="prompt">
</div>
</div>
<button id="reset" class="icon" aria-label="Reset soroban">
<svg viewBox="0 0 48 48">
<path d="M13 14a16 16 0 1 1-3 18M7 13h10v10"/>
</svg>
</button>
</div>
    <div id="read-choices" class="read-choices" hidden>
</div>
<div id="board" class="board" aria-label="Soroban">
</div>
    <footer>
<div id="feedback" role="status" aria-live="polite">Tap a bead.</div>
<button id="check" class="primary">Check</button>
</footer>
  </section>
  <section id="free" class="screen">
<div class="play-top">
<button id="free-back" class="icon" aria-label="Back to lessons">
<svg viewBox="0 0 48 48">
<path d="M29 11 16 24l13 13M17 24h21"/>
</svg>
</button>
<div>
<div class="step-name">Free play</div>
<div class="prompt">Make any number</div>
</div>
<button id="free-reset" class="icon" aria-label="Reset soroban">
<svg viewBox="0 0 48 48">
<path d="M13 14a16 16 0 1 1-3 18M7 13h10v10"/>
</svg>
</button>
</div>
<div class="free-tools">
<label>Rods <select id="rod-count" aria-label="Number of rods">
<option>3</option>
<option>4</option>
<option>5</option>
<option>6</option>
<option>7</option>
</select>
</label>
<button id="hide-numbers" aria-pressed="false">Hide numbers</button>
</div>
<div id="free-board" class="board">
</div>
</section>
</main>
<script src="js/rod-logic.js">
</script>
<script src="app.js">
</script>
<script src="cg-update.js">
</script>
</body>
</html>
