ure><img src="pics/009-pointy.webp?v=99b69b258-20261021213820" alt="pointy" width="480" height="360" loading="lazy"><figcaption><b>9. pointy</b><span>My party hat has a pointy top.</span></figcaption></figure><figure><img src="pics/010-pole.webp?v=99b69b258-20261021213820" alt="pole" width="480" height="360" loading="lazy"><figcaption><b>10. pole</b><span>The flag flies on the tall pole.</span></figcaption></figure></main></body></html>
