<main id="app"><p class="loading">Getting the shapes ready…</p></main>
<!-- Zoom fix C (2026-09-25, owner: "pick the method that most likely to work well").
     First, because it is a document-level listener and must be in place before the game
     starts handling taps. It stops the ZOOM of a second quick tap and re-delivers that
     tap; a multi-finger pinch is never touched, so a child who is zoomed in can always
     pinch back out. -->
<script src="./tap-zoom-guard.js"></script>
<script src="./sound.js"></script>
<script src="./app.js"></script>
<script>
  /* Registered only when served over http(s): a file:// preview has no service worker
     scope and throws. */
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    addEventListener('load', function () { Promise.resolve() /* Test Hub staging: no service worker */; });
  }
</script>
</body>
</html>
