*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#241706;overflow:hidden;
  font-family:ui-rounded,"Avenir Next",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
body{display:grid;place-items:center}

/* Touch hygiene (2026-09-26, zoom fix C). touch-action:manipulation on BOTH html and
   body, not body alone: a tap resolves against every ancestor, so the html surface must
   not stay `auto`. It is NOT the whole answer -- iPadOS Safari still double-tap zooms
   with it in place (owner 2026-09-25: "kids sometimes double tap, and on ipad it's zoom
   in, then they cant zoom out"), which is what ./tap-zoom-guard.js below is for. It is
   NOT a gesturestart handler and must never become one: a document-level pinch blocker
   is the banned pattern in INTERACTION-DIRECTION.md. There is no drag surface in a room,
   so nothing overrides these. */
html,body{touch-action:manipulation}

/* One unit tied to the stage, so every label scales with the picture instead of with
   the window. The stage width is a known expression, so this needs no container query. */
:root{--sw:min(100vw,133.333vh);--fs:calc(var(--sw)*0.0175);--guide-w:16.229%;
  --gfade:60ms}

.stage{position:relative;width:var(--sw);aspect-ratio:4/3;overflow:hidden;
  background:#241706 url("assets/page.webp") center/100% 100% no-repeat}

/* the video layer: one per animal, sitting on the exact rectangle it was cropped from.
   The 9px feather matters: where an animal's motion reaches the edge of its own clip the
   video and the still art disagree, and a hard boundary would draw a rectangle on the
   page. Fading the last few pixels dissolves it. */
.patch{position:absolute;z-index:2;object-fit:fill;opacity:0;pointer-events:none;
  transition:opacity .18s linear;
  -webkit-mask-image:linear-gradient(to right,transparent,#000 9px,#000 calc(100% - 9px),transparent),
                     linear-gradient(to bottom,transparent,#000 9px,#000 calc(100% - 9px),transparent);
  -webkit-mask-composite:source-in;
  mask-image:linear-gradient(to right,transparent,#000 9px,#000 calc(100% - 9px),transparent),
             linear-gradient(to bottom,transparent,#000 9px,#000 calc(100% - 9px),transparent);
  mask-composite:intersect}
.patch.on{opacity:1}
.patch.fading{transition:opacity .45s ease-out}

/* The two guides. Three frames of the same pair; pressing them swaps the frame.

   Decision 21 fixes a guide at 8% of the stage and says to ship it as one variable; the
   owner's frames hold both children in one picture, so --guide-w is the pair and
   tools/build-guides.py scales it so each CHILD lands at 8% - measured, not assumed.

   They are three independent renders, not one drawing with a part changed, so what swaps
   is a pose and an expression rather than a blink; decision 21 allows exactly that for a
   guide, and warns against it for animals. At this size the faces are ~20px, so it is the
   arms and the laugh that read.

   Where they stand is room.json's `guides.at`, and tools/room-guides.py asserts they are
   clear of every animal. The corner is the same in every room on purpose: children who stand
   in the same place on every page are two guides, and children who move are a surprise.

   Decision 21 says a guide is tappable, and until now these were scenery. The press target
   is the pair's own rectangle, trimmed clear of any tap square it clips, and it is the one
   on the page that answers with a picture instead of a voice. */
.guides{position:absolute;left:83.080%;top:84.530%;width:16.229%;z-index:3;
  height:auto;pointer-events:none;opacity:0;transition:opacity var(--gfade) linear;
  transform-origin:50% 100%;filter:drop-shadow(0 6px 10px #0006)}
.guides.on{opacity:1}
.gtap{position:absolute;z-index:6;margin:0;padding:0;border:0;background:transparent;
  cursor:pointer;border-radius:14px;-webkit-appearance:none}
.gtap:focus-visible{outline:3px solid #ffe9a3;outline-offset:2px}
/* The bounce that marks the press. It is applied to all three frames at once, not to the
   one becoming visible, or a frame swap mid-animation would cut it short. It exists because
   the owner could not see a press register at all: at 8% of the stage, in the corner of a
   busy page, the change of expression needs something that says "look here" at the moment
   the finger lands. */
@keyframes guidehop{0%{transform:scale(1) translateY(0)}
  35%{transform:scale(1.075) translateY(-3.2%)}
  70%{transform:scale(0.995) translateY(0.4%)}
  100%{transform:scale(1) translateY(0)}}
.guides.hop{animation:guidehop .46s cubic-bezier(.3,1.5,.5,1)}

/* the finger target: a marker placed ON the animal, nothing to do with the video rect.
   Almost every one is the same 140x140 page px square, because it is a marker and not a
   description - a target sized to each animal's bounding box lets a big animal swallow a
   small one. A ribbon-shaped animal may override it in room.json: the rainforest's eel is a
   645x102 ribbon, so a square would cover a tenth of it and a child aiming at the tail would
   press open water. Generated by tools/room-rects.py, which fails if any two targets overlap
   or any falls under 44 CSS px. */
.tap{position:absolute;z-index:5;margin:0;padding:0;border:0;background:transparent;
  border-radius:18px;cursor:pointer;-webkit-appearance:none}
.tap:focus-visible{outline:3px solid #ffe9a3;outline-offset:2px}

/* a tap that has no clip yet still answers, so nothing feels broken */
@keyframes nudge{0%{transform:scale(1)}45%{transform:scale(1.06)}100%{transform:scale(1)}}
.tap.nudge{animation:nudge .42s ease-in-out}

/* The name box. The button is 44 CSS px tall for the finger; the pill inside it is 25,
   because the rule here is to shrink the mark and never the tap target. Placed by
   tools/room-names.py, which proves each one clears every tap target, every other box,
   the guides and the sound button. */
.name{position:absolute;z-index:6;display:grid;place-items:center;margin:0;padding:0;
  border:0;background:transparent;cursor:pointer;-webkit-appearance:none;font:inherit}
.name>span{display:block;padding:.28em .7em;border:2px solid #2d4a1c;border-radius:999px;
  background:linear-gradient(#fffdf3,#ffeec9);color:#22370f;text-align:center;
  font-size:calc(var(--fs)*var(--s,1));font-weight:800;line-height:1;white-space:nowrap;
  box-shadow:0 3px 10px #0008;transition:transform .14s,background .14s}
.name>span>i{display:block;font-style:normal;line-height:1.15}
.name:hover>span{background:linear-gradient(#fffdf3,#ffe08e);transform:translateY(-1px)}
.name:focus-visible>span{outline:3px solid #ffe9a3;outline-offset:2px}
.name.on>span{background:linear-gradient(#fff6d8,#ffd166);
  box-shadow:0 0 0 3px #ffc52b,0 3px 10px #0008}

/* Sound. AUDIO-DIRECTION.md: every page keeps a Sound toggle. */

/* The room returns to the book's chooser. It sits BESIDE the Sound toggle rather
   than in the corner, because Sound already owns the corner and moving a control a
   child has already learned costs more than it buys. The offset is measured in BOTH
   rooms, not one: 7.1% looked clear in the rainforest
   but sits under Home & pets's "pet" name box. 15% is the first offset that clears
   every .tap, .gtap and .name box in both rooms with 1% to spare, so the gap after
   Sound is the measurement, not a spacing choice. Everything here is
   percentage-positioned, so a clearance that holds at one size holds at all of them.
   Taking an animal's tap would be worse than having no way home.
   Absolute URL on purpose: publishing restructures this file as
   /animal-book/home-and-pets/index.html, while the chooser is /animal-book/. Using its
   published absolute URL makes the destination unambiguous in local previews too. */
.hubx{position:absolute;z-index:7;left:15.000%;top:0.737%;width:5.732%;height:7.643%;
  display:grid;place-items:center;margin:0;padding:0;cursor:pointer;text-decoration:none;
  border:2px solid #2d4a1c;border-radius:50%;background:#fffdf3d9;color:#2d4a1c;
  font-size:calc(var(--fs)*1.15);line-height:1}
.sound{position:absolute;z-index:7;left:0.552%;top:0.737%;width:5.732%;height:7.643%;
  display:grid;place-items:center;margin:0;padding:0;cursor:pointer;
  border:2px solid #2d4a1c;border-radius:50%;background:#fffdf3d9;
  font-size:calc(var(--fs)*1.15);-webkit-appearance:none}
.sound.off{background:#dfd8c8d9;color:#7a7a6a}

/* The language layer, opened by a name box. Text, deliberately: this is the one part of
   the book that is about words rather than pictures - see "Interaction model" in
   animal-book/README.md. */
.sheet{position:absolute;inset:0;z-index:9;display:none;place-items:center;
  background:#06110499;backdrop-filter:blur(3px);padding:3%}
.sheet.open{display:grid}
.card{position:relative;width:min(74%,calc(var(--sw)*0.74));max-height:94%;overflow:auto;
  background:linear-gradient(#fffdf3,#fff4de);border:3px solid #2d4a1c;
  border-radius:calc(var(--fs)*1.3);box-shadow:0 18px 50px #000a;
  padding:calc(var(--fs)*1.5) calc(var(--fs)*1.7);color:#22370f;font-size:var(--fs)}
.card h2{margin:0;padding-right:2.4em;font-size:calc(var(--fs)*2.1);line-height:1.05}
/* The Thai name, printed and never spoken. DECISIONS.md 3: Thai is a printed label for
   children who can already read it, so it needs no pronunciation and no audio; the voice
   script in animals.json leaves it out. */
.card .thai{margin:.2em 0 0;color:#4a6b2a;font-weight:700;
  font-size:calc(var(--fs)*1.5);line-height:1.3;
  font-family:"Noto Sans Thai","Thonburi",ui-rounded,system-ui,sans-serif}
.card .x{position:absolute;top:calc(var(--fs)*0.9);right:calc(var(--fs)*0.9);
  width:calc(var(--fs)*2.6);height:calc(var(--fs)*2.6);display:grid;place-items:center;
  margin:0;padding:0;cursor:pointer;border:2px solid #2d4a1c;border-radius:50%;
  background:linear-gradient(#fffdf3,#ffeec9);color:#22370f;
  font:inherit;font-size:calc(var(--fs)*1.25);font-weight:800;line-height:1;
  -webkit-appearance:none}
.card .x:hover{background:linear-gradient(#fffdf3,#ffd9d0)}
.card section{margin-top:calc(var(--fs)*1.15)}
.card h3{margin:0 0 .35em;font-size:calc(var(--fs)*1.02);letter-spacing:.06em;
  text-transform:uppercase;color:#6a7d45}
.card p{margin:0;font-size:calc(var(--fs)*1.22);line-height:1.42}
.chips{display:flex;flex-wrap:wrap;gap:.45em}
.chip{padding:.3em .7em;border-radius:999px;background:#e8efd6;border:1.5px solid #c3d3a4;
  font-size:calc(var(--fs)*1.08)}
.chip b{font-weight:800}
/* A gloss on an alternative name - "informal British mixed cat". It is printed and never
   spoken: a caveat is the wrong thing to read to a child in a three-sentence popup, so
   room-animals.py keeps glossed names out of the voice script and shows them only here.

   Bracketed, because without the brackets the chip read "night ape misleading" - which looks
   like part of the name rather than a warning about it. */
.chip em{font-size:.88em;font-style:normal;color:#6a7d45}

     A child taps animal names quickly and in quick succession, which is exactly the
     gesture that zoomed the room in on an iPad. The guard stops the ZOOM of a second
     quick tap and re-delivers that tap; a multi-finger pinch is never touched, so a
     child who is zoomed in over a full-screen room can always pinch back out.

     `./tap-zoom-guard.js` is a copy of the app's own guard sitting BESIDE this page, not
     one reached with `../..`. A room is published at <room>/index.html, one level shallower
     than rooms/<room>/page-01.html, so any path that climbs out of the page's own
     directory resolves in the source tree and breaks on the live site. A sibling copy has
     the same relative path in both, which is the same reason the room's own assets/ is
     written that way. Keep the three copies byte-identical (sha256 4366d8b4...). -->

const stage = document.getElementById('stage');
const clips = new Map();
for (const v of stage.querySelectorAll('.patch')) clips.set(v.dataset.a, v);
const pending = new Map();          // videos waiting out a fade, so a re-tap can cancel it
let playing = null;

/* ---- voice --------------------------------------------------------------------
   An ADULT voice, by the owner's decision of 2026-08-19 for this book specifically.
   AUDIO-DIRECTION.md still requires a child voice for Ari in the solar storybook - that
   is unchanged - but Our Animal Book has no child character, it has a narrator naming
   animals, and an adult reading them is what the owner wants. That makes browser
   speechSynthesis a real option here rather than scaffolding: it ships no audio files, so
   the provenance and redistribution questions that gate recorded audio do not arise.

   Two playback rules from that file are obeyed because they are about clarity, not source:
   one sentence per utterance, and never chain playback on an onend callback - queue every
   piece at once and let the queue order them.

   The Thai name is never spoken. DECISIONS.md 3 settles that Thai is printed only, and the
   script in animals.json is built without it. */
let sound = true;
const synth = window.speechSynthesis;
let voice = null;

function pickVoice() {
  if (!synth) return;
  const all = synth.getVoices();
  if (!all.length) return;                          // Safari fills this in late
  const gb = all.filter(v => /^en[-_]GB/i.test(v.lang));   // British English, decision 2
  const pref = ['Daniel', 'Serena', 'Kate', 'Arthur', 'Google UK'];
  voice = pref.map(n => gb.find(v => v.name.includes(n))).find(Boolean)
       || gb[0] || all.find(v => /^en/i.test(v.lang)) || all[0];
}
pickVoice();
if (synth) synth.addEventListener('voiceschanged', pickVoice);

function speak(lines) {
  if (!sound || !synth) return;
  synth.cancel();                                   // a new tap replaces the old one
  for (const line of lines) {
    const u = new SpeechSynthesisUtterance(line);
    u.lang = 'en-GB';
    if (voice) u.voice = voice;
    u.rate = 0.95;
    synth.speak(u);                                 // queued immediately, never on onend
  }
  duck();
}

/* ---- the background bed -------------------------------------------------------
   The room's ambience loop, if it has one - the rainforest's was spliced seamless by
   tools/build-ambience.py from the soundtrack of a Grok clip of that very page. A room
   without one still has this control, because it governs the voice too. Three things
   about the bed:

   - It starts on the first press, not on load. Every browser blocks audio that begins
     without a gesture, and a page that starts making noise by itself is the wrong
     manners for a children's book anyway.
   - The Sound toggle owns it, along with the voice. One control, as AUDIO-DIRECTION.md
     requires of every page.
   - It ducks while anything is being read. A bed and a narrator at the same level are
     mud; the words have to win. Ducking is not "chaining playback on an onend callback",
     which is the rule that bans the other thing - the queue is untouched, this only
     watches it. */
const bed = document.getElementById('bed');
const BED_LEVEL = 0.30, BED_DUCKED = 0.10;
let bedStarted = false, duckTimer = null;

function startBed() {
  if (!bed || bedStarted || !sound) return;
  bedStarted = true;
  bed.volume = BED_LEVEL;
  bed.play().catch(() => { bedStarted = false; });   // still blocked? try again next press
}

const DUCK_CEILING_MS = 30000;

function unduck() {
  clearInterval(duckTimer); duckTimer = null;
  if (bed) bed.volume = BED_LEVEL;
}

function duck() {
  if (!bed || !bedStarted) return;
  bed.volume = BED_DUCKED;
  clearInterval(duckTimer);
  const until = Date.now() + DUCK_CEILING_MS;
  duckTimer = setInterval(() => {
    // The ceiling is not belt-and-braces, it is the actual failure mode: a speech queue
    // that is cancelled, stalled, or suspended - which is what a backgrounded tab does -
    // can leave speaking/pending true for good, and the bed would stay quiet forever with
    // nothing on screen to explain why.
    if (Date.now() < until && synth && (synth.speaking || synth.pending)) return;
    unduck();
  }, 200);
}

document.getElementById('sound').addEventListener('click', e => {
  sound = !sound;
  if (!sound && synth) synth.cancel();
  if (bed) { if (sound) startBed(); else { bed.pause(); bedStarted = false; } }
  e.currentTarget.classList.toggle('off', !sound);
  e.currentTarget.textContent = sound ? '🔊' : '🔇';
  e.currentTarget.setAttribute('aria-label', sound ? 'Turn the sound off' : 'Turn the sound on');
});

/* ---- the animal comes alive, and says its name ------------------------------- */
function settle(v) {                // actually stop it, once its fade has finished
  clearTimeout(pending.get(v)); pending.delete(v);
  v.pause();
  try { v.currentTime = 0; } catch (e) {}
  v.classList.remove('fading');
}

function stop(v, quick) {
  if (!v) return;
  clearTimeout(pending.get(v));
  v.classList.toggle('fading', !quick);
  v.classList.remove('on');
  pending.set(v, setTimeout(() => settle(v), quick ? 200 : 470));
}

function play(name, btn) {
  const v = clips.get(name);
  if (!v) { btn.classList.remove('nudge'); void btn.offsetWidth;
             btn.classList.add('nudge'); return; }
  if (playing && playing !== v) stop(playing, true);
  clearTimeout(pending.get(v)); pending.delete(v);   // a re-tap outruns its own fade
  v.classList.remove('fading');
  playing = v;
  try { v.currentTime = 0; } catch (e) {}
  v.classList.add('on');
  v.play().catch(() => {});
}

/* ---- the name box opens the language layer ----------------------------------- */
const sheet = document.getElementById('sheet');
const card  = document.getElementById('card');
let openFor = null;

const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function build(a) {
  let h = `<button class="x" id="close" aria-label="Close">✕</button>` +
          `<h2>${esc(a.name)}</h2>`;
  if (a.thai) h += `<p class="thai" lang="th">${esc(a.thai)}</p>`;
  if (a.spot) h += `<section><h3>How to spot it</h3><p>${esc(a.spot)}</p></section>`;
  if (a.family.length) h += `<section><h3>Its words</h3><div class="chips">` +
    a.family.map(f => `<span class="chip">${esc(f.label)} <b>${esc(f.value)}</b></span>`).join('') +
    `</div></section>`;
  const alt = a.also_names || [];
  if (alt.length) h += `<section><h3>Also called</h3><div class="chips">` +
    alt.map(x => `<span class="chip">${esc(x.name)}` +
                 (x.gloss ? ` <em>(${esc(x.gloss)})</em>` : '') + `</span>`).join('') +
    `</div></section>`;
  if (a.tell) h += `<section><h3>Telling them apart</h3><p>${esc(a.tell)}</p></section>`;
  else if (a.similar.length) h += `<section><h3>Easy to mix up with</h3><div class="chips">` +
    a.similar.map(s => `<span class="chip">${esc(s)}</span>`).join('') + `</div></section>`;
  return h;
}

function openSheet(slug) {
  const a = ANIMALS[slug];
  if (!a) return;
  openFor = slug;
  card.innerHTML = build(a);
  sheet.classList.add('open');
  for (const b of stage.querySelectorAll('.name')) b.classList.toggle('on', b.dataset.a === slug);
  // The child pressed the name box to be told about the animal, so reading it is the
  // answer to a deliberate tap, not autoplay into a panel they did not ask for.
  speak(a.script);
  card.querySelector('#close').addEventListener('click', closeSheet);
}

function closeSheet() {
  sheet.classList.remove('open');
  openFor = null;
  if (synth) synth.cancel();
  unduck();                          // cancelling the queue must not leave the bed ducked
  for (const b of stage.querySelectorAll('.name')) b.classList.remove('on');
}

sheet.addEventListener('click', e => { if (e.target === sheet) closeSheet(); });

stage.addEventListener('click', e => {
  startBed();                        // the first gesture is what lets audio play at all
  const box = e.target.closest('.name');
  if (box) { openSheet(box.dataset.a); return; }
  const btn = e.target.closest('.tap');
  if (btn) {
    const a = ANIMALS[btn.dataset.a];
    play(btn.dataset.a, btn);
    if (a) speak([a.name + '.']);      // the picture says the name, and only the name
  }
});

for (const v of clips.values()) {
  v.addEventListener('ended', () => { if (playing === v) { stop(v, false); playing = null; } });
}

addEventListener('keydown', e => {
  if (e.key === 'd') document.body.classList.toggle('debug');
  if (e.key === 'Escape' && openFor) closeSheet();
});

/* The guides play a short animation when a child presses them - the owner's call, after
   a timed cycle and then a one-frame-per-press swap.

   The timing is the point. The in-between frame is held for HALF as long as the others
   (210ms against 420ms), which is what makes the sequence read as a blink and a laugh
   rather than as three pictures shown in turn: real eyes pass through half-closed quickly
   and dwell at the ends. It runs out and back - rest, mid, peak, mid, rest - so the
   children always finish where they started, the same "play once and return to rest" the
   animal patches follow.

   All of it comes from assets/guides/frames.json, so the timing is data: a genuinely
   half-lidded frame could be added as another `mid` with no change here.

   A re-press restarts cleanly rather than stacking timers. */
const GUIDE_SEQ  = [{"frame": 1, "ms": 320}, {"frame": 2, "ms": 640}, {"frame": 1, "ms": 320}];
const GUIDE_IDLE = 0;
const guideFrames = [...document.querySelectorAll('.guides')];
let guideTimer = null;

if (guideFrames.length) {
  const show = i => guideFrames.forEach((g, n) => g.classList.toggle('on', n === i));
  show(GUIDE_IDLE);
  const play = () => {
    clearTimeout(guideTimer);
    // restart the bounce on every press, on all three frames at once
    guideFrames.forEach(g => g.classList.remove('hop'));
    void guideFrames[0].offsetWidth;
    guideFrames.forEach(g => g.classList.add('hop'));
    let step = 0;
    const next = () => {
      if (step >= GUIDE_SEQ.length) { show(GUIDE_IDLE); guideTimer = null; return; }
      const s = GUIDE_SEQ[step++];
      show(s.frame);
      guideTimer = setTimeout(next, s.ms);
    };
    next();
  };
  document.querySelector('.gtap').addEventListener('click', play);
}

// warm the clips one at a time once the page has settled, so a child's first
// tap on any animal plays at once instead of waiting on a download
addEventListener('load', () => {
  const queue = [...clips.values()];
  const warm = () => {
    const v = queue.shift();
    if (!v) return;
    v.preload = 'auto';
    v.addEventListener('loadeddata', () => setTimeout(warm, 120), {once: true});
    v.addEventListener('error', () => setTimeout(warm, 120), {once: true});
    v.load();
  };
  setTimeout(warm, 800);
});
</script>
