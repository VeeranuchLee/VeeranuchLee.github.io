<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f8dfbd">
  <title>Living Things Lab</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./css/app.css">
  <link rel="stylesheet" href="./cg-back.css">
  <script src="./cg-update.js" defer></script>
</head>
<body class="room-page">
  <a class="cg-back" href="../" aria-label="Back to Children Games"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
  <main class="room-main">
    <section class="room-stage" id="roomStage" aria-label="Living Things Lab classroom">
      <img id="roomImage" src="./art/main-room.webp" width="2048" height="1536" alt="A warm biology classroom with a microscope, plant, skeleton, body poster, fish tank, butterfly case, flower and terrarium">
      <h1 class="room-title">Living Things Lab</h1>
      <svg id="roomDebug" class="debug-overlay" viewBox="0 0 2048 1536" aria-hidden="true"></svg>
      <div id="roomLabels" class="room-labels" aria-hidden="true"></div>
      <div id="roomHotspots" class="room-hotspots"></div>
      <div id="roomGlints" class="room-glints" aria-hidden="true"></div>
    </section>
  </main>
  <p id="roomStatus" class="sr-only" aria-live="polite"></p>
  <script src="./safe-storage.js"></script>
  <script src="./tap-zoom-guard.js"></script>
  <script src="./js/audio.js"></script>
  <script src="./js/room.js"></script>
  </body>
</html>
