<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Books — Children Games</title>
  <link rel="stylesheet" href="https://veeranuchlee.github.io/children-apps/fonts.css"/>
  <meta name="theme-color" content="#f7d9ec"/>
  <link rel="apple-touch-icon" href="https://veeranuchlee.github.io/children-apps/assets/app-192.png"/>
  <link rel="icon" href="https://veeranuchlee.github.io/children-apps/assets/app-192.png"/>
  <link rel="stylesheet" href="./playroom/category.css?v=2d804f87b-20261009095032"/>
  <link rel="stylesheet" href="./playroom/room-label.css?v=2d804f87b-20261009095032"/>
  <!-- A CATEGORY PAGE of the playroom hub (prototype, 2026-10-02). Every category page is this
       same shell; only data-category differs. Its cards come from playroom/destinations.js. -->
</head>
<body class="painted-room" data-category="books">
  <div class="topbar">
    <a class="back" id="back" href="./" aria-label="Back to Children Games">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M15 5l-7 7 7 7"/></svg>
      <span>Children Games</span>
    </a>
    <div class="view-switch" role="group" aria-label="Choose a view">
      <button type="button" data-view="room" aria-pressed="true">Room</button>
      <button type="button" data-view="cards" aria-pressed="false">Cards</button>
    </div>
  </div>
  <main class="room-view" id="roomView">
    <div class="room-frame"><img id="roomPicture" width="1672" height="941" alt=""/><div class="room-hotspots" id="roomHotspots"></div></div>
  </main>
  <section class="cards-view" id="cardsView" hidden>
    <header>
      <h1 id="catTitle">Books</h1>
      <p class="tagline" id="catLine"></p>
    </header>
    <main class="grid" id="catGrid"></main>
  </section>
  <noscript><p class="missing">These games need JavaScript. <a href="./">Back to Children Games</a>.</p></noscript>
  <script src="./tap-zoom-guard.js?v=2d804f87b-20261009095032"></script>
  <script src="./playroom/destinations.js?v=2d804f87b-20261009095032"></script>
  <script src="./playroom/room-label.js?v=2d804f87b-20261009095032"></script><script src="./playroom/category.js?v=2d804f87b-20261009095032"></script>
</body>
</html>
