<!-- HOME: one card per house. Siblings each keep their own. -->
<section id="home" class="screen">
  <h1 class="title"><span class="title-star"><svg><use href="#i-star"/></svg></span> Celebration House</h1>
  <div id="slots" class="slots"></div>
</section>

<!-- THE HOUSE -->
<section id="app" class="screen" hidden>
  <header id="topbar">
    <button class="btn round" id="btn-home" aria-label="My houses"><svg><use href="#i-home"/></svg></button>
    <button class="btn round" id="btn-overview" aria-label="Whole house"><svg><use href="#i-house"/></svg></button>
    <span class="spacer"></span>
    <button class="btn round" id="btn-undo" aria-label="Undo"><svg><use href="#i-undo"/></svg></button>
    <button class="btn round" id="btn-redo" aria-label="Redo"><svg><use href="#i-redo"/></svg></button>
    <span class="spacer"></span>
    <button class="btn round switch" id="btn-master" aria-label="All lights on or off" aria-pressed="true"><svg><use href="#i-bulb"/></svg></button>
    <button class="btn lightup" id="btn-lightup" aria-pressed="false"><svg class="sun"><use href="#i-sun"/></svg><svg class="moon"><use href="#i-moon"/></svg><span>Light Up My House!</span></button>
  </header>

  <main id="viewport" aria-label="The house">
    <div id="world">
      <div id="house"></div>
      <div id="fixtures"></div>
      <div id="decos"></div>
    </div>
    <div id="night"></div>
    <canvas id="lights"></canvas>
    <div id="overlay"></div>
    <div id="area-name" aria-live="polite"></div>
    <div id="hint" hidden></div>
  </main>

  <div id="panel" hidden></div>

  <nav id="dock">
    <div id="tabs" role="tablist">
      <button class="tab is-on" data-tab="decorations" aria-label="Decorations"><svg><use href="#i-deco"/></svg></button>
      <button class="tab" data-tab="lights" aria-label="Lights"><svg><use href="#i-bulb"/></svg></button>
      <button class="tab" data-tab="music" aria-label="Music"><svg><use href="#i-music"/></svg></button>
      <button class="tab" data-tab="scene" aria-label="Scene"><svg><use href="#i-scene"/></svg></button>
    </div>
    <div id="tray"></div>
  </nav>
</section>

<div id="confirm" class="modal" hidden>
  <div class="modal-card">
    <div class="modal-pic"></div>
    <div class="modal-buttons">
      <button class="btn big no" id="confirm-no" aria-label="No"><svg><use href="#i-close"/></svg></button>
      <button class="btn big yes" id="confirm-yes" aria-label="Yes"><svg><use href="#i-check"/></svg></button>
    </div>
  </div>
</div>

<script src="./tap-zoom-guard.js?v=368937474-20261019151338"></script>
<script src="./audio-wake.js?v=368937474-20261019151338"></script>

<script src="js/state.js?v=368937474-20261019151338"></script>
<script src="js/lights.js?v=368937474-20261019151338"></script>
<script src="js/audio.js?v=368937474-20261019151338"></script>
<script src="js/app.js?v=368937474-20261019151338"></script>
</body>
</html>
