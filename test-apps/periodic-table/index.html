<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>Periodic Table</title>
  <meta name="apple-mobile-web-app-title" content="Periodic Table"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="theme-color" content="#f7fbff"/>
  <link rel="icon" href="./icon-192.png"/>
  <link rel="manifest" href="./manifest.webmanifest"/>
  <link rel="stylesheet" href="./css/app.css"/>
</head>
<body>
  <main id="app" class="app" data-mode="explore">
    <header class="topbar">
      <a id="back-link" class="round-nav" href="../" aria-label="Go back">
        <span aria-hidden="true">‹</span><span>Back</span>
      </a>
      <h1>Periodic Table</h1>
      <a id="home-link" class="round-nav home" href="../../children-apps/" aria-label="Go to the children apps home">
        <span aria-hidden="true">⌂</span><span>Home</span>
      </a>
    </header>

    <section class="control-strip" aria-label="Learning mode and question set">
      <nav class="chip-group mode-picker" aria-label="Mode">
        <button type="button" class="chip mode-chip is-active" data-mode="explore" aria-pressed="true">Explore</button>
        <button type="button" class="chip mode-chip" data-mode="find-it" aria-pressed="false">Find It</button>
        <button type="button" class="chip mode-chip" data-mode="symbol-match" aria-pressed="false">Symbol Match</button>
        <button type="button" class="chip mode-chip" data-mode="atomic-number" aria-pressed="false">Atomic Number</button>
      </nav>
      <div class="chip-group set-picker" aria-label="Difficulty set">
        <span class="set-label">Set</span>
        <button type="button" class="chip set-chip is-active" data-set="starter" aria-pressed="true">Starter</button>
        <button type="button" class="chip set-chip" data-set="first20" aria-pressed="false">First 20</button>
        <button type="button" class="chip set-chip" data-set="common" aria-pressed="false">Common</button>
        <button type="button" class="chip set-chip" data-set="all" aria-pressed="false">All 118</button>
      </div>
      <p id="game-prompt" class="game-prompt" aria-live="polite">Tap any element to hear one short fact.</p>
    </section>

    <section id="legend" class="legend" aria-label="Element category colours"></section>

    <section id="periodic-zone" class="periodic-zone" aria-label="Interactive periodic table">
      <div id="main-grid" class="main-grid"></div>
      <div id="f-block" class="f-block"></div>
    </section>

    <section id="info-strip" class="info-strip" aria-label="Selected element information" aria-live="polite">
      <div id="info-preview" class="info-preview">
        <span class="atomic-number"></span>
        <span class="symbol-line"><span class="symbol"></span><span class="icon" aria-hidden="true"></span></span>
        <span class="element-name"></span>
      </div>
      <button id="speak-button" class="speak-button" type="button" aria-label="Replay this element's fact">
        <span aria-hidden="true">🔊</span>
      </button>
      <p id="info-sentence" class="info-sentence"></p>
      <button id="next-question" class="next-question" type="button" hidden>Next question</button>
    </section>
  </main>

  <script src="./js/tap-zoom-guard.js"></script>
  <script src="./js/elements.js"></script>
  <script src="./js/voice.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
