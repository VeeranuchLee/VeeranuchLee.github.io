<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#efe7d8" />
    <meta name="description" content="Hear a word, watch how each letter is written, trace it on a piece of writing paper, and fill your sticker book." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Writing Book" />
    <title>Writing Book</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="screen"></main>

    <!-- Load order matters. letters.js is the geometry every other file reads;
         strokes.js reads it at call time, app.js at startup. -->
    <script>
      /* Pinch-zoom guard. iOS Safari ignores user-scalable=no (since iOS 10), so
         this is the only thing that stops two small hands zooming the page mid
         stroke. gesturestart fires once per pinch; preventing it cancels the zoom
         without touching scrolling or any single-finger gesture. Non-Safari
         browsers never fire it, so this is inert there. */
      document.addEventListener("gesturestart", function (e) { e.preventDefault(); }, { passive: false });
    </script>
    <script src="./letters.js"></script>
    <script src="./strokes.js"></script>
    <script src="./words.js"></script>
    <script src="./sentences.js"></script>
    <script src="./sound.js"></script>
    <script src="./vocab.js"></script>
    <script src="./app.js"></script>
    <script>
      /* Offline support. Best-effort on purpose: opened straight off the filesystem
         the browser refuses to register a worker, and the book must still work. */
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('./service-worker.js').catch(function () {});
        });
      }
    </script>
  </body>
</html>
