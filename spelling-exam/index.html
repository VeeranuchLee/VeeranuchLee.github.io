<!doctype html><html lang="en"><head><meta charset="utf-8"><!-- Zoom fix C, 2026-09-27: `user-scalable=no` is GONE from this viewport meta, deliberately. iOS has ignored it since iOS 10 on purpose -- zoom is an accessibility feature -- while Android Chrome honours it, so the tag was a real global pinch blocker on exactly the platform that respects it, and did nothing on the iPad in the house. The fix is ./tap-zoom-guard.js below, not the meta tag (INTERACTION-DIRECTION.md layer 4). --><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f06fb4"><title>Spelling Exam</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"></head><body>
<main id="app" aria-live="polite"></main><!-- Zoom fix C (2026-09-25, owner: "pick the method that most likely to work well").
     First, before the engine and app.js, because it is a document-level listener and must
     be in place before the page starts handling taps. It stops the ZOOM of a second quick
     tap -- and picking a letter tile or a keyboard key is exactly a tap a child makes
     twice -- and re-delivers that tap; a multi-finger pinch is never touched, so a child
     who is zoomed in can always pinch back out. It is NOT a gesturestart handler and must
     never become one: a document-level pinch blocker is the banned pattern in
     INTERACTION-DIRECTION.md. -->
<script src="tap-zoom-guard.js"></script>
<!-- The Writing Book's handwriting engine, copied verbatim by tools/port-handwriting.js
     and held byte-identical by its --check in preflight. Plain scripts, before app.js,
     because both files are already (function(global){...})(window) and this page takes
     no modules. -->
<script src="handwriting/letters.js"></script><script src="handwriting/strokes.js"></script><script src="app.js"></script>  </body></html>
