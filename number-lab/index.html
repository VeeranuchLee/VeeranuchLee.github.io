<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14284b"><title>Number Lab</title><link rel="stylesheet" href="styles.css"><style>.tool-art{display:inline-block;width:58px;height:58px;background:url('assets/tile-atlas.webp');background-size:500% 400%;background-position-y:100%}.tool-art.wildcard{background-position-x:0}.tool-art.hand{background-position-x:25%}.tool-art.bomb{background-position-x:50%}.tool-art.toolbox{background-position-x:75%}.shop .tool-art{width:48px;height:48px}.use .tool-art{width:60px;height:60px}</style><script src="tap-zoom-guard.js"></script>  <link rel="stylesheet" href="./cg-back.css" />
  </head>
<body>
<!-- The way out (INTERACTION-DIRECTION.md, 2026-10-23): this app had none on its first screen. -->
<a class="cg-back" href="https://veeranuchlee.github.io/children-apps/" aria-label="Back to Children Games"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
<main>
  <header><span class="cg-back-slot" aria-hidden="true"></span><div><h1>NUMBER LAB</h1><small id="status">PLACE THE NEXT TILE</small></div><div class="score"><span>SCORE <b id="score">0</b></span><span><svg class="icon-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2v7.527a2 2 0 0 1-.211.896L4.72 20.55a1 1 0 0 0 .9 1.45h12.76a1 1 0 0 0 .9-1.45l-5.069-10.127A2 2 0 0 1 14 9.527V2"/><path d="M8.5 2h7"/><path d="M7 16h10"/><circle cx="10" cy="18.6" r="1.1" fill="currentColor" stroke="none"/><circle cx="13.8" cy="17.4" r=".8" fill="currentColor" stroke="none"/></svg><b id="credits">0</b></span></div><button data-act="sound" aria-label="Toggle sound effects" aria-pressed="true"><svg class="icon-svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z" fill="currentColor" stroke="none"/><path class="snd-on" d="M15.5 8.5a5 5 0 0 1 0 7"/><path class="snd-on" d="M18.5 6a9 9 0 0 1 0 12"/><line class="snd-off" x1="16" y1="9" x2="22" y2="15"/><line class="snd-off" x1="22" y1="9" x2="16" y2="15"/></svg></button><button data-act="music" aria-label="Toggle music" aria-pressed="false">♫</button></header>
  <section class="battlebar"><b id="timer">ENDLESS</b><span>CPU <b id="cpu-score">0</b></span><button id="opponent-toggle" data-act="opponent" hidden>SHOW OPPONENT</button></section>
  <section class="top-controls"><button data-act="tools"><strong>TOOLS</strong><i class="tool-art toolbox"></i></button><div><strong>NEXT</strong><span id="next"></span></div><button data-act="hold"><strong>HOLD</strong><span id="hold" class="hold-frame"></span></button></section>
  <section id="board" class="board" aria-label="6 by 6 Number Lab board"></section><section id="opponent" aria-label="CPU board"></section>
  <nav><button data-act="restart">↻<span>RESTART</span></button><button data-act="mode" data-mode="solo">∞<span>SOLO</span></button><button data-act="mode" data-mode="battle" data-profile="QUICK" data-minutes="10"><svg class="icon-svg" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4.5 13.5h6L9 22l10.5-12h-6z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg><span>10 MIN BATTLE</span></button></nav>
</main>
<dialog id="toolbox"><form method="dialog"><button class="close">×</button></form><h2>LAB TOOLBOX</h2><div class="shop">
  <button data-act="buy" data-id="A1">1<small>20</small></button><button data-act="buy" data-id="A3">3<small>60</small></button><button data-act="buy" data-id="A9">9<small>180</small></button><button data-act="buy" data-id="A27">27<small>500</small></button><button data-act="buy" data-id="A81">81<small>1,500</small></button>
  <button data-act="buy" data-id="B1">๑<small>20</small></button><button data-act="buy" data-id="B3">๓<small>60</small></button><button data-act="buy" data-id="B9">๙<small>180</small></button><button data-act="buy" data-id="bomb"><i class="tool-art bomb"></i><small>170</small></button><button data-act="buy" data-id="wildcard"><i class="tool-art wildcard"></i><small>300</small></button><button data-act="buy" data-id="hand"><i class="tool-art hand"></i><small>300</small></button>
</div><div class="use"><button data-act="bomb"><i class="tool-art bomb"></i></button><button data-act="wildcard"><i class="tool-art wildcard"></i></button><button data-act="hand"><i class="tool-art hand"></i></button></div><p>Battle: <button data-act="mode" data-mode="battle" data-profile="CASUAL" data-minutes="10">CASUAL</button> <button data-act="mode" data-mode="battle" data-profile="EXPERT" data-minutes="15">EXPERT</button> <button data-act="mode" data-mode="battle" data-profile="RIVAL" data-minutes="20">RIVAL</button></p></dialog>
<dialog id="result"><h2 id="result-title"></h2><p id="result-scores"></p><button data-act="restart">PLAY AGAIN</button></dialog>
<script type="module" src="js/app.js"></script><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js')</script></body></html>
