<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Space</title>
  <link rel="manifest" href="./manifest.webmanifest"/>
  <link rel="stylesheet" href="./fonts.css"/>
  <meta name="theme-color" content="#2e2560"/>
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Space"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    /* A night sky, in the space violet proposed for the SPACE card on Children Games
       (HUB-SPEC.md §2) -- dark like Planets & Moons' deliberate night, so the two
       card colours below sit inside it rather than fighting it. The gradient stays as
       the background colour: it is what paints before the image decodes, and what
       shows if the image 404s -- never a blank white flash on a dark app. */
    body{
      font-family:'Nunito',sans-serif;min-height:100vh;color:#fff;
      background:linear-gradient(170deg,#3b2e78 0%,#2e2560 55%,#1e1748 100%);
    }
    /* The owner's backdrop -- planets and stars framing an empty centre -- sits behind
       everything as its own layer so the scrim below can dim it without touching the
       gradient underneath. background-attachment stays the default (scroll): iOS Safari
       does not support fixed backgrounds well, and this page never scrolls anyway. */
    .backdrop{
      position:fixed;inset:0;z-index:0;
      background-image:url('./assets/backdrop.webp');
      background-size:cover;background-position:center;background-repeat:no-repeat;
    }
    /* A subtle scrim: the source image is brightest at its four corners (planets,
       nebula) and darkest in the middle, which is the opposite of what the cards need,
       since the cards sit in the middle on a phone and spread toward the corners on
       the iPad's wider canvas. A soft radial vignette keeps the centre clear (that is
       where the heading reads best against the plain sky) and quietly darkens the
       edges the art is busiest at, so white card text stays readable without hiding
       the art. */
    .scrim{
      position:fixed;inset:0;z-index:0;
      background:radial-gradient(ellipse at center,rgba(20,14,46,0) 0%,rgba(20,14,46,.15) 55%,rgba(20,14,46,.5) 100%);
    }
    .wrap{
      position:relative;z-index:1;min-height:100vh;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:26px;padding:32px 20px;
    }
    h1{font-weight:900;font-size:clamp(1.8rem,6vw,3rem);text-shadow:0 4px 12px rgba(0,0,0,.5);text-align:center}
    /* The one word the SPACE card on Children Games will say, in the star-gold every
       dark front door in this family uses, so the page a child lands on says what the
       card they tapped said it would. */
    h1 span{color:#ffd54f}
    .sub{
      font-weight:800;font-size:clamp(1rem,3.4vw,1.3rem);opacity:.92;
      margin-top:-14px;text-align:center;text-shadow:0 2px 8px rgba(0,0,0,.5);
    }

    /* TWO CARDS, because the owner named two: "for now we can add ari and dot and
       planet game to the space hub" (2026-09-17). Space Trivia joins the day it is
       released, Stars & Sky and Spacecraft the day they exist, and none of those days
       is a redesign -- the grid is auto-fit, so a new app is a card added below and
       nothing else, exactly as Our Word Book grows. */
    .cards{
      display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:20px;width:100%;max-width:900px;
    }
    .card{
      display:flex;flex-direction:column;align-items:center;gap:12px;
      padding:26px 18px 22px;border-radius:28px;
      text-decoration:none;color:#fff;font-weight:900;font-size:1.2rem;text-align:center;
      transition:transform .15s ease,box-shadow .15s ease;
      text-shadow:0 2px 4px rgba(0,0,0,.35);
      -webkit-tap-highlight-color:transparent;
      /* 9.7" iPad portrait is 768px, so the two cards sit side by side and a child's
         finger gets a target well past 44px in both directions. Checked in pixels,
         not assumed. */
      min-height:190px;
    }
    .card:hover{transform:translateY(-6px) scale(1.03)}
    .card:active{transform:translateY(2px)}
    .card:focus-visible{outline:5px solid #ffd54f;outline-offset:4px}
    .card img{width:104px;height:104px;object-fit:contain;filter:drop-shadow(0 6px 12px rgba(0,0,0,.35))}
    .card small{font-weight:700;font-size:.82rem;opacity:.92;max-width:22ch}
    /* Planets & Moons only has a square app icon rather than a cut-out sprite.
       Rounding it makes it read as a deliberate tile instead of a pasted square --
       the same call the Children Games grid makes for the same file. */
    .card img.tile{border-radius:20px}

    /* EACH CARD KEEPS THE COLOUR ITS MAIN-HUB CARD WORE. Until the SPACE card
       replaces them on Children Games, Ari & Dot is indigo (.c-story) and Planets &
       Moons night-sky navy (.c-planets) there. A child who knew those two cards finds
       the same two colours here, one level down -- the cheapest possible way to say
       "they are not gone, they moved". The gradient ends and the 8px bases below are
       those cards' own --edge and --shadow hexes, unchanged. */
    .c-story  {background:linear-gradient(160deg,#9aa1e3,#5b64c9);box-shadow:0 8px 0 #3b429c,0 14px 28px rgba(59,66,156,.35)}
    .c-planets{background:linear-gradient(160deg,#515fae,#26306e);box-shadow:0 8px 0 #151c46,0 14px 28px rgba(21,28,70,.4)}

    footer{font-size:.8rem;font-weight:700;opacity:.72;text-align:center;max-width:44ch;line-height:1.5}

    /* ── Back to Children Games ──
       Top-left, 60px tall, arrow AND words -- the shape every app in this project uses,
       copied deliberately from word-book/index.html rather than reinvented. The arrow is
       for the child who cannot read yet and already knows what it does; the words are
       for the one who can and wants to know where it goes. */
    .hub-btn{
      position:fixed;z-index:9;
      top:calc(14px + env(safe-area-inset-top));
      left:calc(14px + env(safe-area-inset-left));
      display:inline-flex;align-items:center;gap:9px;
      min-height:60px;padding:0 20px 0 16px;
      border-radius:50px;
      background:linear-gradient(135deg,#fff,#ece9ff);
      border:2.5px solid #8f86d8;box-shadow:0 4px 0 #8f86d8;
      color:#4a3d8f;text-decoration:none;
      font-family:inherit;font-weight:900;font-size:1rem;line-height:1;
      white-space:nowrap;-webkit-tap-highlight-color:transparent;
      transition:transform .1s;
    }
    .hub-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8f86d8}
    .hub-btn:focus-visible{outline:4px solid #ffd54f;outline-offset:3px}
    .hub-btn svg{width:24px;height:24px;flex:none}
    /* Narrow phones get the arrow alone. The words are the first thing to go, not the
       target: the button keeps its height and the tap area with it. */
    @media (max-width:420px){
      .hub-btn{padding:0;width:60px;justify-content:center;gap:0}
      .hub-btn span{display:none}
    }
    /* The heading clears the button on a narrow screen, where they would otherwise
       share the top line. */
    .wrap{padding-top:max(32px,calc(86px + env(safe-area-inset-top)))}

    @media (prefers-reduced-motion:reduce){
      .card{transition:none}
      .card:hover{transform:none}
    }

    /* ── Music toggle ──
       Top-right and fixed, mirroring the hub-btn's top-left placement and the same
       60px circle the children's hub and Magic Math both use for this control -- a
       child who learns the shape in one place should not have to find it again here.
       Colours follow THIS page's own palette rather than copying children-apps' pink:
       the note lights up in the star-gold (#ffd54f) the "Space" heading and every
       focus ring on this page already use, so "on" reads as this app's own accent,
       not a borrowed one. */
    .music-btn{
      position:fixed;z-index:50;
      top:calc(14px + env(safe-area-inset-top));
      right:calc(14px + env(safe-area-inset-right));
      width:60px;height:60px;border-radius:50%;
      display:grid;place-items:center;
      background:linear-gradient(135deg,#fff,#ece9ff);
      border:2.5px solid #8f86d8;box-shadow:0 4px 0 #8f86d8;
      cursor:pointer;padding:0;
      -webkit-tap-highlight-color:transparent;
      transition:transform .16s ease,box-shadow .16s ease;
    }
    .music-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8f86d8}
    .music-btn:focus-visible{outline:5px solid #ffd54f;outline-offset:4px}
    .music-btn svg{width:30px;height:30px;display:block}
    /* Two signals, not one: colour alone is not a state a child reads reliably, and
       the slash is the part that says "no sound" with no words on it. */
    .music-btn .note{fill:#8f86d8;transition:fill .16s ease}
    .music-btn .slash{stroke:#8f86d8;stroke-width:2.6;stroke-linecap:round}
    .music-btn[aria-pressed="true"] .note{fill:#e5a100}
    .music-btn[aria-pressed="true"] .slash{display:none}
    /* Only while it is actually playing, so the button never animates at a silence --
       the same rule children-apps' bed follows: the pulse tracks what is AUDIBLE, not
       what is merely preferred. */
    .music-btn.playing{animation:musicPulse 2.2s ease-in-out infinite}
    @keyframes musicPulse{
      0%,100%{box-shadow:0 4px 0 #8f86d8}
      50%    {box-shadow:0 4px 0 #8f86d8,0 8px 22px rgba(255,213,79,.55)}
    }
    @media (prefers-reduced-motion:reduce){
      .music-btn{transition:none}
      .music-btn.playing{animation:none}
    }
    @media (max-width:420px){
      .music-btn{width:52px;height:52px}
      .music-btn svg{width:26px;height:26px}
    }
  </style>
</head>
<body>

<!-- The URL is absolute for the same reason every app's arrow is: published, this page
     is a sibling of nothing in the source repo's site/ tree -- it goes to the shared
     Pages repo at /space/ -- so a relative link would work live and 404 in every local
     preview. -->
<a class="hub-btn" href="https://veeranuchlee.github.io/children-apps/" aria-label="Back to Children Games">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
    <path d="M15 5 8 12l7 7"/>
  </svg>
  <span>Children Games</span>
</a>

<!-- Starts as "off" in the markup and is corrected by the script below the moment it
     runs, so a remembered preference never renders as the wrong state. -->
<button class="music-btn" id="musicBtn" type="button" aria-pressed="false" aria-label="Play music">
  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    <path class="note" d="M20 3.5v11.2a3.3 3.3 0 1 1-2-3V7.9l-7 1.6v8.2a3.3 3.3 0 1 1-2-3V6.3l11-2.8z"/>
    <line class="slash" x1="3.4" y1="3.4" x2="20.6" y2="20.6"/>
  </svg>
</button>

<div class="backdrop"></div>
<div class="scrim"></div>
<div class="wrap">
  <h1><span>Space</span></h1>
  <p class="sub">Stories and planets to explore</p>

  <div class="cards">
    <!-- Both apps are their own published repositories, so their links are absolute
         for the same reason the back arrow's is. The art, name and small line are the
         ones each card wears on Children Games today, so the door a child knows and
         the door they land on agree. -->
    <a class="card c-story" href="https://veeranuchlee.github.io/solar-storybook-feedback/">
      <img src="assets/ari-and-dot.webp" alt="" width="104" height="104"/>
      Ari &amp; Dot
      <small>A story about the planets</small>
    </a>

    <a class="card c-planets" href="https://veeranuchlee.github.io/solar-system-game/">
      <img class="tile" src="assets/planets-and-moons.png" alt="" width="104" height="104"/>
      Planets &amp; Moons
      <small>Planets in order, moons at home, then the dwarf planets</small>
    </a>
  </div>

  <footer>Made with love for little learners</footer>
</div>
<script>
  /* Offline support. Registration is best-effort: opened straight from a file the
     browser refuses it, and the page must still open. */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./service-worker.js').catch(function () {});
    });
  }

  /* ══ HUB MUSIC ══
     Owner approval, 2026-09-17, verbatim: "(c) Render a new space track: about 1,031
     credits (1.7% of the key's quota). -> yes pls." One generated instrumental track,
     off by default, behind its own toggle -- AUDIO-DIRECTION.md decision 9's shape,
     decision 10's "conversation and not a habit" accepted a second time.

     OWN KEY, NOT A SHARED ONE. veeranuchlee.github.io/, /children-apps/, /spelling-exam/
     and /magic-math/ share an origin and therefore `localStorage`. This page's own key,
     `space_music`, is what keeps it from reading or overwriting the main hub's
     `ca_music` -- the same reason `ca_music`, `sm_music` and `spelling-exam-bed-v1` are
     all distinct rather than one shared flag.

     THIS PAGE ONLY, NEVER SPACE TRIVIA. Space Trivia is a wholly separate published
     tree with its own service worker and no Sound toggle of its own (HUB-SPEC §12), so
     the bed cannot follow a child in there even by accident -- there is no shared code
     path for it to travel on.

     PLAYHEAD PARKING, copied from Magic Math (math-app/index.html) rather than
     children-apps: `space-bed.m4a` is 70.8s of written music, not a few-second loop, so
     a fresh <audio> restarting at 0:00 on every navigation back to this hub would be
     audibly broken. The position is parked in `space_music_t` on the way out and picked
     up on the way in.

     ARM SKIPS `<a>` TAPS, same reason as Magic Math: almost everything on this page is
     a link (both cards, the back arrow) and starting a 900ms fade-in on the tap that
     unloads the document buys a swell cut off mid-breath. A tap that keeps the child
     here is what should start the music.

     NOT PRECACHED. service-worker.js's SHELL list is unchanged by this file -- the
     fetch handler is cache-first for same-origin GETs and stores the bed the first time
     it plays. Adding ~880 KB to every child's first install to serve a feature that is
     off by default would be the wrong trade, exactly as children-apps' own bed reasons
     it (index.html, "NOT PRECACHED"). CACHE_NAME is still bumped on publish, because
     index.html itself -- which IS precached -- changed. */
  var Music = (function () {
    var SRC = './audio/space-bed.m4a';
    var KEY = 'space_music';
    var TKEY = 'space_music_t';   // the parked playhead, in seconds
    var FULL = 0.20;              /* resting level: present in a quiet room, never in front */
    var RAMP_MS = 900, STEP_MS = 50;
    var el = null, ramp = 0, armed = false, pref = false;
    var seekTo = 0, posTaken = true;
    try { pref = localStorage.getItem(KEY) === '1'; } catch (e) {}

    var btn = document.getElementById('musicBtn');

    function paint() {
      btn.setAttribute('aria-pressed', pref ? 'true' : 'false');
      btn.setAttribute('aria-label', pref ? 'Stop music' : 'Play music');
      /* The pulse tracks what is AUDIBLE, not what is preferred: while a remembered
         preference is still waiting on a first tap, the note is gold but nothing
         throbs, which is the truth of that moment. */
      btn.classList.toggle('playing', !!(el && !el.paused));
    }

    function fadeTo(v, thenPause) {
      if (!el) return;
      if (ramp) { clearInterval(ramp); ramp = 0; }
      var from = el.volume, steps = Math.max(1, Math.round(RAMP_MS / STEP_MS)), i = 0;
      ramp = setInterval(function () {
        i++;
        try { el.volume = Math.max(0, Math.min(1, from + (v - from) * (i / steps))); } catch (e) {}
        if (i >= steps) {
          clearInterval(ramp); ramp = 0;
          if (thenPause && el) { try { el.pause(); } catch (e) {} }
          paint();
        }
      }, STEP_MS);
    }

    function readPos() {
      var t = 0; try { t = parseFloat(localStorage.getItem(TKEY)); } catch (e) {}
      return (isFinite(t) && t > 0) ? t : 0;
    }
    /* Seeking needs metadata, and preload:'none' means there is none until something
       asks for it -- called from loadedmetadata and again after play() resolves. */
    function takePos() {
      if (posTaken || !el || !(el.readyState >= 1)) return;
      try { if (seekTo < el.duration) el.currentTime = seekTo; } catch (e) {}
      posTaken = true;
    }
    /* `posTaken` is the guard that matters: a child who arrives, never touches the
       page and taps straight into a card had an element that never loaded a byte and
       whose currentTime is 0 -- saving that would overwrite a real position with
       nothing. A page that never took the playhead does not get to move it. */
    function savePos() {
      if (!el || !posTaken) return;
      try { localStorage.setItem(TKEY, String(el.currentTime || 0)); } catch (e) {}
    }

    function arm() {
      if (armed) return;
      armed = true;
      var go = function (e) {
        /* Skip taps that land on a link: both cards and the back arrow navigate away,
           and starting the fade-in on the tap that unloads the page buys a swell cut
           off mid-breath followed by silence on the other side. */
        if (e.target && e.target.closest && e.target.closest('a')) return;
        window.removeEventListener('pointerdown', go, true);
        armed = false;
        apply();
      };
      window.addEventListener('pointerdown', go, true);
    }

    function apply() {
      if (!pref) {
        if (el && !el.paused) fadeTo(0, true); else paint();
        return;
      }
      if (!el) {
        try { el = new Audio(SRC); } catch (e) { return; }
        el.loop = true;
        el.preload = 'none';
        el.volume = 0;
        seekTo = readPos(); posTaken = (seekTo === 0);
        el.addEventListener('loadedmetadata', takePos);
        el.addEventListener('playing', paint);
        el.addEventListener('pause', paint);
        takePos();
      }
      el.volume = 0;
      var p;
      try { p = el.play(); } catch (e) { arm(); return; }
      if (p && p.then) p.then(function () { takePos(); fadeTo(FULL, false); paint(); }).catch(arm);
      else { takePos(); fadeTo(FULL, false); paint(); }
    }

    btn.addEventListener('click', function () {
      pref = !pref;
      try { localStorage.setItem(KEY, pref ? '1' : '0'); } catch (e) {}
      /* The click itself is the user gesture, so this is the one path where play() is
         reliably allowed. */
      apply();
      paint();
    });

    paint();
    apply();

    /* Read-only, for verification. The element is never added to the document, so
       there is otherwise no way to tell from outside whether the bed is actually
       playing or merely intended to be. */
    return {
      save: savePos,
      state: function () {
        return { pref: pref, exists: !!el, playing: !!(el && !el.paused),
                 volume: el ? +el.volume.toFixed(3) : null, armed: armed,
                 posTaken: posTaken, currentTime: el ? +el.currentTime.toFixed(2) : null,
                 src: SRC };
      }
    };
  })();

  /* Park the playhead before this document goes. `pagehide` is the one that fires on
     iOS when the child taps into a card; `visibilitychange` catches the iPad being put
     to sleep or the app swapped away, where pagehide does not come. */
  window.addEventListener('pagehide', Music.save);
  document.addEventListener('visibilitychange', function () { if (document.hidden) Music.save(); });
</script>
</body>
</html>
