<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Grammar Game</title>
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png"/>
  <link rel="stylesheet" href="./fonts.css"/>
  <link rel="stylesheet" href="./grammar-game.css"/>
  <link rel="stylesheet" href="./cg-back.css"/>
  <script src="./cg-update.js" defer></script>
</head>
<body>
  <a class="cg-back" href="./index.html" aria-label="Back to Our Word Book"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
  <main>
    <section id="start" class="panel start-panel">
      <img src="./assets/grammar/grammar-game.webp" alt="A child arranging colourful word tiles beside an open book"/>
      <h1>Grammar Game</h1>
      <p>Build sentences, spot word jobs and help every sentence shine.</p>
      <button id="play" class="primary" type="button">Play</button>
    </section>

    <section id="game" class="panel" hidden>
      <header><span id="progress">1 of 10</span><span id="stars" aria-label="Stars">☆ ☆ ☆</span>
        <button id="voiceToggle" class="voice-toggle" type="button" aria-pressed="true" aria-label="Voice on"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M11 5L6 9H3v6h3l5 4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 6a9 9 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button></header>
      <img id="scene" class="scene" alt=""/>
      <p class="prompt-row"><span id="prompt" class="prompt"></span>
        <button id="hearQuestion" class="hear" type="button" aria-label="Hear the question again"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M11 5L6 9H3v6h3l5 4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 6a9 9 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button></p>
      <div id="stem" class="stem"></div>
      <div id="answerLine" class="answer-line" hidden></div>
      <div id="choices" class="choices"></div>
      <button id="check" class="primary" type="button" hidden>Check</button>
    </section>

    <section id="finish" class="panel start-panel" hidden>
      <img src="./assets/grammar/building-together.webp" alt="Two children building a colourful block tower together"/>
      <h1>Sentence star!</h1>
      <p id="finishCopy"></p>
      <button id="again" class="primary" type="button">Play again</button>
    </section>
  </main>

  <div id="lesson" class="lesson" role="dialog" aria-modal="true" aria-labelledby="lessonTitle" hidden>
    <div class="lesson-card">
      <div id="lessonFace" class="lesson-face"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 2c.7 6.2 3.8 9.3 10 10-6.2.7-9.3 3.8-10 10-.7-6.2-3.8-9.3-10-10 6.2-.7 9.3-3.8 10-10z" fill="currentColor"/></svg></div>
      <h2 id="lessonTitle">Let’s learn it</h2>
      <p id="lessonText"></p>
      <button id="listen" class="listen" type="button" hidden aria-label="Listen to the explanation"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M11 5L6 9H3v6h3l5 4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 6a9 9 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg> Listen</button>
      <button id="continue" class="primary" type="button">Try the next one</button>
    </div>
  </div>

  <script src="./tap-zoom-guard.js"></script>
  <script src="./audio-wake.js"></script>
  <script src="./grammar-game.js"></script>
</body>
</html>
